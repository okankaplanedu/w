html,body{height:100%}
body{

#statusBox i{width:8px;height:8px;border-radius:50%;background:#5a6472;flex:none;transition:background .25s}

main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;min-height:0}

.prog{height:2px;background:var(--line);border-radius:2px;margin:14px auto 0;max-width:560px;overflow:hidden}

.legend{margin-top:8px;text-align:center;font-size:9.5px;letter-spacing:.08em;color:var(--mut)}

/* ---------- 0. Yardımcılar ---------- */
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
class Rng{
  constructor(seed){this.f=mulberry32(seed>>>0);}
  next(){return this.f();}
  range(a,b){return a+(b-a)*this.f();}
  int(a,b){return Math.floor(this.range(a,b+1));}
  pick(arr){return arr[Math.floor(this.f()*arr.length)];}
  chance(p){return this.f()<p;}
  weighted(pairs){let s=0;for(const p of pairs)s+=p[1];let r=this.f()*s;for(const p of pairs){r-=p[1];if(r<=0)return p[0];}return pairs[pairs.length-1][0];}
  shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(this.f()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
}

/* ---- NOTASYON OTORİTESİ — piyano notasyonu standartları ----
   Ritim değerleri temiz nota değerleridir (16'lık birimde): 1·2·3·4·6·8·12·16

const NOTATION_CLEAN=[1,2,3,4,6,8,12,16];
const NOTE_SPELL={0:['C',0],1:['D',-1],2:['D',0],3:['E',-1],4:['E',0],5:['F',0],
  6:['G',-1],7:['G',0],8:['A',-1],9:['A',0],10:['B',-1],11:['B',0]};
const STEP_SEMI={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function validateNotation(plan){
  const v=[];
  const clean=new Set(NOTATION_CLEAN);
  for(const e of plan.events){
    if(e.kind!=='ring'){
      if(!Number.isInteger(e.slot))v.push('slot '+e.slot);
      if(!clean.has(e.dur))v.push('ritim '+e.dur);
    }
    if(e.midi<21||e.midi>108)v.push('midi '+e.midi);
    const sp=NOTE_SPELL[e.midi%12];
    if(Math.floor(e.midi/12)*12+STEP_SEMI[sp[0]]+sp[1]!==e.midi)v.push('yazım '+e.midi);
  }
  return v;
}

function freshCounters(){
  const r={keys:{},circleRoots:{},chords:{},transitions:{},tempos:{},forms:{},phases:{},progressions:{},motifs:{},instruments:{},notes:{},modes:{},aksak:{},arps:{},nefes:{},handModes:{},compositions:0,signatures:[]};
  CIRCLE.forEach(n=>{r.keys[n]=0;r.circleRoots[n]=0;});
  TEMPOS.forEach(n=>{r.tempos[String(n)]=0;});
  FORMS.forEach(n=>{r.forms[n.id]=0;});
  CLASSIC_PROGRESSIONS.forEach(n=>{r.progressions[n.id]=0;});
  MOTIFS.forEach(n=>{r.motifs[n.id]=0;});
  Object.keys(INSTRUMENTS).forEach(n=>{r.instruments[n]=0;});
  MODES.forEach(n=>{r.modes[n.id]=0;});
  AKSAK_PATTERNS.forEach(n=>{r.aksak[n.id]=0;});
  ARP_PATTERNS.forEach(n=>{r.arps[n.id]=0;});
  PICCOLO_MODES.forEach(n=>{r.nefes[n.id]=0;});
  HAND_MODES.forEach(n=>{r.handModes[n.id]=0;});
  return r;
}
const STORE_KEY='piyanoCemberV2::sayac';
class CounterStore{
  constructor(){
    const saved=Store.get(STORE_KEY,null);
    const fresh=freshCounters();
    if(saved){
      ['keys','circleRoots','chords','transitions','tempos','forms','phases','progressions','motifs','instruments','notes','modes','aksak','arps','nefes','handModes'].forEach(k=>{
        fresh[k]=Object.assign(fresh[k],saved[k]||{});
      });
      fresh.compositions=saved.compositions||0;
      fresh.signatures=(saved.signatures||[]).slice(-80);
    }
    this.c=fresh;
  }
  bump(map,key,n){const m=this.c[map];m[key]=(m[key]||0)+(n||1);}
  save(){try{this.c.signatures=this.c.signatures.slice(-80);Store.set(STORE_KEY,this.c);}catch(e){}}
  /* Korunan "oa" algoritması: sayaç sayısı + jitter sıralaması, ilk 3 arasından rastgele */
  least(candidates,map,k,rng){
    k=k||3;
    const rnd=()=>rng&&typeof rng.next==='function'?rng.next():Math.random();
    const arr=candidates.map(x=>({x,cnt:(this.c[map][x]||0),j:rnd()}))
      .sort((a,b)=>a.cnt-b.cnt||a.j-b.j);
    const top=arr.slice(0,Math.min(k,arr.length));
    return top[Math.floor(rnd()*top.length)].x;
  }
}

/* ---------- 4. YEPYENİ 3·5·7 MAKSİMUM PROGRESYON MOTORU ----------
   Kök yürüyüşü aralıklara göre: 3'lü (mediant), 5'li (kwintem),
   7'li (bir alt basamak ≈ 2'li). Aynı derece ve aynı yürüyüş
   arka arkaya gelmez; ögelerin tümü sayaç dengesinden geçirilir. */
const MOTION_STEPS={3:[-2,2],5:[-3,4],7:[-1,1]}; // diatonik basamak
function generateProgression(rng,bars,energy,store){
  bars=Math.max(1,Math.floor(bars||1));
  const tC=store.c.transitions;
  const usage=m=>(tC[m]||0);
  const cls=d=>{const r=((d%7)+7)%7;return r===0?null:(r===1||r===6)?'7':(r===2||r===5)?'3':'5';};
  if(bars===1){
    return{id:'gen357-1b-I',label:'3·5·7 TEK KÖK',degrees:[0],generated:true,motions:[],cadenceStart:0};
  }
  if(bars===2){
    return{id:'gen357-2b-50',label:'3·5·7 KISA KADANS (5·I)',degrees:[4,0],generated:true,motions:['5'],cadenceStart:0};
  }
  const steps=[0];
  const motions=[null];
  const lastDeg=()=>mod7(steps[steps.length-1]);
  /* Başlangıç + iç gövde + iki akorlu kadans = tam olarak bars. */
  while(steps.length<bars-2){
    const cand=[];
    for(const m of ['3','5','7']){
      for(const off of MOTION_STEPS[m]){
        const ns=steps[steps.length-1]+off;
        const deg=mod7(ns);
        if(deg===lastDeg())continue;
        if(m===motions[motions.length-1])continue;
        let w=(m==='3'?0.36:m==='5'?0.34:0.30);
        w*=1+(1.5/(1+usage(m)));
        /* Enerji yükseldikçe 3/5 hareketi, dinginlikte 7 adımı güçlenir. */
        w*=m==='7'?(1.18-energy*.22):(0.92+energy*.18);
        cand.push([[m,ns],w]);
      }
    }
    const pick=cand.length?rng.weighted(cand):['3',steps[steps.length-1]+2];
    steps.push(pick[1]);motions.push(pick[0]);
  }
  const prevDeg=lastDeg(),prevMotion=motions[motions.length-1];
  const approaches=rng.shuffle([4,3,6,1,2]);
  let cad=null;
  for(const ap of approaches){
    if(mod7(ap)===prevDeg)continue;
    const mIn=cls(ap-steps[steps.length-1]),mOut=cls(-ap);
    if(!mIn||!mOut)continue;
    const penalty=(prevMotion&&mIn===prevMotion?1:0)+(mIn===mOut?1:0);
    if(!cad||penalty<cad.penalty)cad={ap,mIn,mOut,penalty};
    if(penalty===0)break;
  }
  cad=cad||{ap:4,mIn:'5',mOut:'5'};
  steps.push(cad.ap);motions.push(cad.mIn);
  steps.push(0);motions.push(cad.mOut);
  const degrees=steps.slice(0,bars).map(s=>mod7(s));
  const motionOut=[];
  for(let i=1;i<degrees.length;i++)motionOut.push(cls(degrees[i]-degrees[i-1])||'7');
  const motionSeq=motionOut.join('');
  return{
    id:'gen357-'+bars+'b-'+motionSeq,
    label:'3·5·7 YÜRÜYÜŞ ('+(motionSeq.replace(/(.)/g,'$1·').slice(0,-1)||'I')+')',
    degrees,generated:true,motions:motionOut,cadenceStart:Math.max(0,bars-2)
  };
}

/* ---------- 5. ARMONİ YARDIMCILARI ---------- */
const LETTERS=['C','D','E','F','G','A','B'];
const SHARP_SPELL={0:['C',0],1:['C',1],2:['D',0],3:['D',1],4:['E',0],5:['F',0],
  6:['F',1],7:['G',0],8:['G',1],9:['A',0],10:['A',1],11:['B',0]};
const XML_MODE={ionian:'major',aeolian:'minor',dorian:'dorian',lydian:'lydian',mixolydian:'mixolydian'};
const FIFTH_MAJOR_PC={"-7":11,"-6":6,"-5":1,"-4":8,"-3":3,"-2":10,"-1":5,"0":0,"1":7,"2":2,"3":9,"4":4,"5":11,"6":6,"7":1};
function signedPcDiff(target,natural){let d=((target-natural)%12+12)%12;if(d>6)d-=12;return d;}
function buildScaleSpellMap(keyName,keyPc,mode){
  const map=new Map();
  const li=Math.max(0,LETTERS.indexOf((keyName||NOTE_TR[keyPc]||'C')[0]));
  for(let i=0;i<7;i++){
    const step=LETTERS[(li+i)%7],target=(keyPc+mode.steps[i])%12;
    const alter=signedPcDiff(target,STEP_SEMI[step]);
    map.set(target,[step,clamp(alter,-2,2)]);
  }
  return map;
}
function spellingName(sp){return sp[0]+(sp[1]===2?'##':sp[1]===1?'#':sp[1]===-1?'b':sp[1]===-2?'bb':'');}
function spellMidiInBar(midi,bar){
  const pc=((midi%12)+12)%12;
  if(bar&&bar.spellMap&&bar.spellMap.has(pc))return bar.spellMap.get(pc);
  return (bar&&bar.keyFifths>=0?SHARP_SPELL:NOTE_SPELL)[pc];
}
function keySignatureFifths(keyPc,mode){
  const wanted=new Set(mode.steps.map(s=>(keyPc+s)%12));
  let best={f:0,cost:99};
  for(let f=-7;f<=7;f++){
    const tonic=FIFTH_MAJOR_PC[String(f)];
    const major=[0,2,4,5,7,9,11].map(s=>(tonic+s)%12);
    let cost=0;for(const pc of major)if(!wanted.has(pc))cost++;
    if(cost<best.cost||(cost===best.cost&&Math.abs(f)<Math.abs(best.f)))best={f,cost};
  }
  return best.f;
}
function diatonicInterval(mode,deg,offset){
  const absolute=deg+offset;
  return mode.steps[mod7(absolute)]+12*Math.floor(absolute/7)-mode.steps[deg];
}
function resolveDiatonicExtension(mode,deg,quality,requested){
  if(!requested)return null;
  let semi;
  if(requested==='add9')semi=diatonicInterval(mode,deg,8);
  else if(requested==='6')semi=diatonicInterval(mode,deg,5);
  else semi=diatonicInterval(mode,deg,6);
  let id=requested,suffix='';
  if(requested==='add9')suffix='add9';
  else if(requested==='6')suffix='6';
  else if(quality==='dim'&&semi===10){id='hdim7';suffix='ø7';}
  else if(quality==='dim'&&semi===9){id='dim7';suffix='°7';}
  else if(quality==='maj'&&semi===11){id='maj7';suffix='maj7';}
  else if(quality==='maj'&&semi===10){id='7';suffix='7';}
  else if(quality==='min'&&semi===11){id='mmaj7';suffix='maj7';}
  else {id=quality==='min'?'m7':'7';suffix='7';}
  return{id,semi,suffix};
}
function chordFromDegree(keyPc,mode,deg,ext,keyName){
  deg=mod7(deg);
  const rootPc=(keyPc+mode.steps[deg])%12;
  const quality=mode.triads[deg];
  const semis=QUALITY_SEMI[quality].slice();
  const spec=resolveDiatonicExtension(mode,deg,quality,ext);
  if(spec&&!semis.includes(spec.semi))semis.push(spec.semi);
  const spell=buildScaleSpellMap(keyName||NOTE_TR[keyPc],keyPc,mode);
  const rootName=spellingName(spell.get(rootPc)||NOTE_SPELL[rootPc]);
  let label;
  if(spec&&quality==='dim'&&(spec.id==='hdim7'||spec.id==='dim7'))label=rootName+spec.suffix;
  else label=rootName+QUALITY_LABEL[quality]+(spec?spec.suffix:'');
  return{rootPc,quality,ext:spec?spec.id:null,extSemi:spec?spec.semi:null,
    semis,label,pcs:semis.map(s=>(rootPc+s)%12),key:rootPc+':'+quality+':'+(spec?spec.id:'tri')};
}
function pcToMidi(pc,lo,hi,center){
  const opts=[];
  for(let m=lo;m<=hi;m++)if(m%12===pc%12)opts.push(m);
  if(!opts.length)return null;
  const c=(center==null?(lo+hi)/2:center);
  opts.sort((a,b)=>Math.abs(a-c)-Math.abs(b-c));
  return opts[0];
}

/* ---------- 6. PERMÜTASYON MOTORU — akor notaları ASLA aynı sırayla ---------- */
class PermEngine{
  constructor(rng){this.rng=rng;this.last={};this.log=[];}
  nextOrder(key,n){
    const prev=this.last[key];
    const idx=[];for(let i=0;i<n;i++)idx.push(i);
    let order=this.rng.shuffle(idx);
    if(prev&&arrEq(order,prev)){
      order=order.slice(1).concat(order.slice(0,1)); // garanti: döndür
      if(arrEq(order,prev)&&n>1)order=order.slice().reverse();
    }
    this.last[key]=order.slice();
    this.log.push({key,order:order.slice()});
    return order;
  }
}


/* ---------- 6A. AÇIK TRİAD · PROFESYONEL LEGATO SESLEME ----------
   Akor sesleri 4–5 oktava açılır. Aday seslemeler; önceki ölçüye en
   küçük hareket, yeterli spektral açıklık, kök/bas kararlılığı ve aşırı
   sıçrama cezasıyla değerlendirilir. Çıkış blok akor değil, çakışan
   kuyruklu arpej dalgasıdır. */
class LegatoVoicer{
  constructor(rng){this.rng=rng;this.prev=null;this.lastPath='';}
  candidate(chord,count,lo,hi,variant){
    const pcs=chord.pcs.slice(),root=chord.rootPc;
    const rest=this.rng.shuffle(pcs.filter(p=>p!==root));
    const order=[root].concat(rest.length?rest:[(root+7)%12]);
    if(variant%2)order.push(root);
    const all=[];for(let m=lo;m<=hi;m++)if(pcs.includes(m%12))all.push(m);
    const out=[];let prev=-Infinity;
    for(let i=0;i<count;i++){
      const target=lo+(hi-lo)*i/Math.max(1,count-1)+((variant%3)-1)*1.5;
      const wanted=order[i%order.length];
      let opts=all.filter(m=>m>prev+2&&m%12===wanted);
      if(!opts.length)opts=all.filter(m=>m>prev+2);
      if(!opts.length)break;
      opts.sort((a,b)=>Math.abs(a-target)-Math.abs(b-target));
      const m=opts[Math.min(opts.length-1,variant%2)];out.push(m);prev=m;
    }
    return out;
  }
  choose(chord,energy,hand){
    const count=energy>.78?8:energy>.46?7:6;
    const lo=hand==='capraz'?33:35,hi=hand==='birlesik'?91:94;
    const targetSpan=energy>.7?48:42;
    let best=null;
    for(let v=0;v<10;v++){
      const a=this.candidate(chord,count,lo,hi,v);if(a.length<5)continue;
      const span=a[a.length-1]-a[0];let move=0;
      if(this.prev&&this.prev.length){
        const n=Math.min(this.prev.length,a.length);

/* ---------- 6AB. ANA MOTİF ↔ PİKOLO KİLİT MOTORU -----------------
   Geliştirme işlemi yalnız bir kez yapılır. Ana melodi ve pikolo aynı
   derece, onset, armonik düzeltme ve token dizisini tüketir. Pikolo için
   bağımsız perde üretimi yoktur: yalnız oktav/register orkestrasyonu
   serbesttir. Böylece tematik olarak ilgisiz ayrım matematiksel olarak 0. */

    let degs=motif.degrees.slice(),steps=motif.steps.slice();
    if(op.includes('rot')){const k=Math.min(2,Math.max(1,degs.length>2?2:1));

    if(op.includes('inv'))degs=degs.map(d=>-d);
    if(op.includes('ret'))degs=degs.slice().reverse(); /* ritmik onsetler artan kalır */
    if(op.includes('aug')){const dd=[],ss=[];steps.forEach((x,i)=>{if(i%2===0){dd.push(degs[i]);ss.push(x);}});degs=dd;steps=ss;}
    return{degs,steps};

    d.steps.forEach((raw,i)=>{

      const degree=d.degs[i],basePc=(bar.keyPc+bar.modeSteps[mod7(degree)]+12)%12;
      const strong=bar.strong.has(slot)||i===0||i===d.steps.length-1;

    });

  }
}
