  const aestheticIndex=100*clamp(.18*coherence+.13*complexity+.14*phaseExpectation+
    .10*strongChordRatio+.09*modeIntegrity+.07*clamp(contrast/.7,0,1)+
    .06*clamp(ops.size/6,0,1)+.18*memory.score+.05*(granular.ok?1:0),0,1);
  const proofs=[
    {id:'exact-bars',ok:phaseAudits.every(x=>x.prog.degrees.length===x.bars),value:phaseAudits.length},
    {id:'mode-integrity',ok:modeIntegrity===1,value:modeIntegrity},
    {id:'markov-normalized',ok:markovRowsValid(THESIS_MARKOV_MINOR)&&markovRowsValid(THESIS_MARKOV_MAJOR),value:1},
    {id:'voice-leading',ok:vl<=7.5,value:vl},
    {id:'conditional-entropy',ok:entropy<=.90,value:entropy},
    {id:'strong-beat-anchor',ok:strongChordRatio>=.55,value:strongChordRatio},
    {id:'controlled-rest',ok:plan.stats.restFraction>=.19&&plan.stats.restFraction<=.55,value:plan.stats.restFraction}, /* eşleşmiş motif çiftleri birlikte korunur */
    {id:'dynamic-arc',ok:contrast>=.35,value:contrast},
    {id:'notation',ok:notationErrors===0,value:notationErrors},
    {id:'open-legato-span',ok:openSpans.length>0&&openSpan>=36&&openMinSpan>=30,value:openSpan},
    {id:'triad-to-legato',ok:triadCoverage===1&&triadOverlap===1&&legacyFlow===0,
      value:{coverage:triadCoverage,overlap:triadOverlap,legacyFlow}},
    {id:'no-block-triads',ok:granular.ok,value:granular.collisions},
    {id:'piccolo-melody-fusion',ok:memory.fusionCoverage>=.72,value:memory.fusionCoverage},
    {id:'piccolo-motif-lock',ok:motifLock.ok,value:motifLock.ratio},
    {id:'memorability',ok:memory.ok,value:memory.score},
    {id:'aesthetic-proxy',ok:aestheticIndex>=60,value:aestheticIndex},
    {id:'two-minute-form',ok:Math.abs(durationSeconds-120)<.01,value:durationSeconds},
    {id:'atmospheric-decay',ok:atmosphere.ok,value:atmosphere.waves},
    {id:'piccolo-low-integration',ok:pikoMain===0||pikoLow>0,value:pikoLow},
    {id:'finite-score',ok:Number.isFinite(aestheticIndex),value:aestheticIndex}
  ];
  return{version:THESIS_VERSION,aestheticIndex,conditionalEntropy:entropy,meanSurprisal:phaseExpectation,
    voiceLeading:vl,modeIntegrity,strongChordRatio,dynamicContrast:contrast,motifOperations:ops.size,
    openLegatoSpan:openSpan,openLegatoMinSpan:openMinSpan,openLegatoBars:openSpans.length,
    triadCoverage,triadOverlap,legacyFlow,granular,memory,motifLock,durationSeconds,
    atmosphere,piccoloMain:pikoMain,piccoloLow:pikoLow,
    phaseAudits:phaseAudits.map(x=>({role:x.role,bars:x.bars,degrees:x.prog.degrees.slice(),
      source:x.usageKey,score:x.metrics.total,uncertainty:x.metrics.uncertainty,
      surprisal:x.metrics.surprisal,voiceLeading:x.metrics.voiceLeading,closure:x.metrics.closure})),
    proofs,passed:proofs.filter(p=>p.ok).length,total:proofs.length};
}

/* =====================================================================
   7. KOMPÜZİTÖR — tam kompozisyon önceden kusursuz kurulur
   ===================================================================== */
class Composer{
  constructor(store){this.store=store;this.lastRootIdx=null;}

  newComposition(bpm,salt){
    const store=this.store,st=store.c;
    const n=st.compositions;
    const seed=(Math.imul(n+1,0x9E3779B1)^Math.imul((salt||0)>>>0,0x85EBCA6B)^0xC2B2AE35)>>>0;
    const rng=new Rng(seed);

    /* --- kök: çember penceresi (circleShift korunur) + en az çalınan --- */
    const prevIdx=this.lastRootIdx==null?rng.int(0,11):this.lastRootIdx;
    const windowSet=new Set();
    [-2,-1,1,2].forEach(d=>windowSet.add(CIRCLE[(prevIdx+d+12)%12]));
    windowSet.add(CIRCLE[(prevIdx+rng.pick([3,4,5,6,7,8,9]))%12]); // uzak sıçrama
    const root=store.least([...windowSet],'circleRoots',3,rng);
    this.lastRootIdx=CIRCLE.indexOf(root);
    store.bump('keys',root);store.bump('circleRoots',root);

    const modeId=store.least(MODES.map(m=>m.id),'modes',3,rng);
    const mode=MODE_BY_ID[modeId];store.bump('modes',modeId);
    const formId=store.least(FORMS.map(f=>f.id),'forms',3,rng);
    const form=FORM_BY_ID[formId];store.bump('forms',formId);
    store.bump('tempos',String(bpm));

    /* --- motifler: verse / nakarat / köprü — hepsi farklı, en az çalınan --- */
    const mIds=MOTIFS.map(m=>m.id);
    const verseM=store.least(mIds,'motifs',3,rng);
    const refrainM=store.least(mIds.filter(x=>x!==verseM),'motifs',3,rng);
    const bridgeM=store.least(mIds.filter(x=>x!==verseM&&x!==refrainM),'motifs',3,rng);

    const perm=new PermEngine(rng);
    const permDeep=new PermEngine(rng); /* 2. piyano kendi nota sırası garantisiyle */
    const perm3=new PermEngine(rng);     /* 3. piyano tiz bileşke — kendi sırası */
    const legato=new LegatoVoicer(rng);   /* 4–5 oktav açık triad ses-yürüyüşü */
    const events=[];const bars=[];
    const stats={potential:0,rests:0,strikes:0,chordOrderLog:perm.log};
    let slotCursor=0;
    let compBass=0,compMid=0,compTiz=0,compArp=0,deepBars=0,deepPhasesOff=0;
    let thirdBars=0,thirdPhasesOff=0,thirdCells=0;
    let pikoloBars=0,pizBars=0,heartBars=0;
    const handTally={},aksakTally={};
    let dir=rng.chance(0.5)?1:-1; // progressionDirection korunur
    let keyIdx=this.lastRootIdx;
    const phraseHist={}; // motif+op tekrar engeli
    const phaseAudits=[]; // tez motoru: her bölümün ölçülebilir armonik seçimi

    form.phases.forEach((ph,pi)=>{
      if(pi>0&&rng.chance(0.65))keyIdx=(keyIdx+dir+12)%12; // circleShift
      const key=CIRCLE[keyIdx],keyPc=PC[key];
      /* %70 3·5·7 / %30 klasik mimari korunur. Tez motoru her dalda
         çoklu aday üretir; belirsizlik-sürpriz, ses yürüyüşü, tekrar,
         karmaşıklık ve kısmi kadans denklemleriyle en iyi adayı seçer. */
      const useGenerated=rng.chance(0.70);
      const selected=selectAffectiveProgression(rng,ph.bars,ph.energy,ph.role,keyPc,mode,store,useGenerated);
      const prog=selected.prog;
      store.bump('progressions',selected.usageKey);
      phaseAudits.push({role:ph.role,bars:ph.bars,prog,metrics:selected.metrics,usageKey:selected.usageKey});
      prog.motions&&prog.motions.forEach(m=>store.bump('transitions',m));
      const handId=store.least([...new Set(HAND_CAND[ph.role])],'handModes',3,rng);
      store.bump('handModes',handId);
      handTally[handId]=(handTally[handId]||0)+1;
      let aksakId;
      if(rng.chance(0.50))aksakId='even';
      else aksakId=store.least(AKSAK_PATTERNS.map(a=>a.id),'aksak',3,rng);
      store.bump('aksak',aksakId);
      aksakTally[aksakId]=(aksakTally[aksakId]||0)+1;
      const poly=aksakId!=='even'&&rng.chance(0.25); // çok hafif polimetre
      const motifId=(ph.role==='chorus'||ph.role==='solo'||ph.role==='final')?refrainM:(ph.role==='bridge'?bridgeM:verseM);
      store.bump('motifs',motifId);
      /* PİKOLO KONTRAST SOLOSU: köprü/ara/solo bölümlerinde %65;
         ölçek (uzak doğu / native) en-az-çalınan sayacıyla döner */
      const pikoEligible=['bridge','interlude','solo','chorus','final'].includes(ph.role);
      const pikoRequired=ph.role==='chorus'||ph.role==='final'||ph.role==='solo';
      const pikoloMode=pikoEligible&&(pikoRequired||rng.chance(.72))?
        PICCOLO_BY_ID[store.least(PICCOLO_MODES.map(m=>m.id),'nefes',3,rng)]:null;
      if(pikoloMode)store.bump('nefes',pikoloMode.id);
      store.bump('phases',ph.role);
      const restDensity=clamp(0.50-ph.energy*0.22+rng.range(-0.03,0.05),0.25,0.50);
      /* 2. PİYANO: %92 bölümde aktif — nadiren tüm bölüm susar (kontrast) */
      const deepOn=rng.chance(ph.role==='intro'?0.55:ph.role==='solo'?0.35:0.92);
      if(!deepOn)deepPhasesOff++;
      /* 3. PİYANO: tiz bileşke — dramatik anlarda (nakarat/final) parlar */
      const thirdOn=ph.role==='outro'||ph.role==='final'?true
        :ph.role==='solo'?rng.chance(0.85)
        :ph.role==='chorus'?rng.chance(0.95)
        :ph.role==='lift'?rng.chance(0.70)
        :ph.role==='bridge'?rng.chance(0.50)
        :ph.role==='verse'?rng.chance(0.35)
        :rng.chance(0.15);
      if(!thirdOn)thirdPhasesOff++;

      for(let b=0;b<ph.bars;b++){
        const deg=prog.degrees[b%prog.degrees.length];
        const ext=chooseExt(rng,MODE_BY_ID[modeId].triads[deg],ph.energy);
        const chord=chordFromDegree(keyPc,mode,deg,ext,key);
        store.bump('chords',chord.quality+(chord.ext?('+'+chord.ext):''));
        const groups=rng.chance(0.5)?AKSAK_BY_ID[aksakId].groups:AKSAK_BY_ID[aksakId].groups.slice().reverse();
        const pulses=groups.reduce((a,g)=>a+g,0);
        const barSlots=pulses*4;
        const groupStarts=[];let acc=0;
        groups.forEach(g=>{groupStarts.push(acc*4);acc+=g;});
        const strong=new Set();
        for(let p=0;p<pulses;p++){strong.add(p*4);strong.add(p*4+2);}
        groupStarts.forEach(s=>strong.add(s));
        const phraseIdx=Math.floor(b/2);
        const phraseEnd=(b%2===1)||b===ph.bars-1;
        const breathLen=ph.energy<0.45?rng.int(3,4):rng.int(2,3);
        const bar={
          slotStart:slotCursor,slots:barSlots,pulses,groups,groupStarts,strong,
          phaseIndex:pi,role:ph.role,roleLabel:ROLE_LABEL[ph.role],barInPhase:b,bars:ph.bars,
          tempoMul:ROLE_TEMPO[ph.role]||1,
          energy:ph.energy,chord,chordLabel:chord.label,key,keyPc,modeId,modeSteps:mode.steps,degree:deg,
          keyFifths:keySignatureFifths(keyPc,mode),spellMap:buildScaleSpellMap(key,keyPc,mode),
          affect:selected.metrics,progLabel:prog.label,progId:prog.id,
          aksakLabel:AKSAK_BY_ID[aksakId].label+(poly?' · POLİ':''),
          handId,handLabel:HAND_BY_ID[handId].label,
          motifId,motifLabel:MOTIF_BY_ID[motifId].label,pikoloMode,
          restDensity,phraseIdx,phraseEnd,breathLen,
          susSlots:new Set(),events:[]
        };
        this.buildBar(bar,rng,perm,permDeep,perm3,legato,deepOn,thirdOn,phraseHist,stats,poly,events,bars);
        slotCursor+=barSlots;
        if(bar._bass)compBass++;if(bar._mid)compMid++;if(bar._tiz)compTiz++;if(bar._arp)compArp++;
        if(bar._deep)deepBars++;
        if(bar._third){thirdBars++;thirdCells+=bar._cells||0;}
        if(bar._pikolo)pikoloBars++;if(bar._piz)pizBars++;if(bar._heart)heartBars++;
      }
    });

    /* --- final: çok yumuşak kök akoru (outro son barına) --- */
    const lastBar=bars[bars.length-1];
    if(lastBar){
      const rootMidi=pcToMidi(lastBar.chord.rootPc,48,64,null);
      [rootMidi,rootMidi+7,rootMidi+12,rootMidi+16].forEach((m,i)=>{
        events.push({slot:lastBar.slotStart+lastBar.slots-7+i,midi:m,vel:0.06+0.015*i,
          dur:10+i,release:6.5,lane:'final',hand:'L',hum:rng.range(-0.01,0.01),
          harmonyGroup:'final-'+(bars.length-1),granularIndex:i,articulation:'legato',kind:'final-legato'});
      });
      /* FİNAL IŞIMASI: 3. piyano tiz kök bileşkesi — derin legato ile
         birlikte yüksekten uçup kaybolur (sinematik final derinliği) */
      const gRoot=pcToMidi(lastBar.chord.rootPc,72,84,84);
      if(gRoot!=null){
        [gRoot,gRoot+7,gRoot+12].forEach((m,i)=>{
          events.push({slot:lastBar.slotStart+lastBar.slots-7+i*2,midi:clamp(m,72,96),vel:0.055-0.01*i,
            dur:9+i,release:9.5,lane:'third',hand:'R3',hum:rng.range(-0.008,0.008),
            harmonyGroup:'final-glow-'+(bars.length-1),granularIndex:i,kind:'final-glow'});
        });
      }
      lastBar.events=events.filter(ev=>ev.slot>=lastBar.slotStart&&ev.slot<lastBar.slotStart+lastBar.slots);
    }

    /* --- SU DAMLASI + ATMOSFERİK DALGA ALANI ----------------------
       Tutti bitişi tek damla üretir. Ardından 5–6 halka geometrik gain
       kaybıyla uzaklaşır; her dalgada filtre kararır, fog-send ve reverb
       kuyruğu büyür, stereo merkez dışa açılır. Böylece ses yükselmeden
       alan dolar; uzak dalga daha uzun fakat daha düşük enerjilidir. */
    let ringSets=0,ringNotes=0,dropCount=0;
    bars.forEach((bar,bi)=>{
      if(!bar._tutti)return;
      const nb=bars[bi+1];if(nb&&nb._tutti)return;
      const tes=bar.events.filter(e=>e.kind==='tutti');if(!tes.length)return;
      const uniq=[...new Set(tes.map(e=>e.slot))].sort((a,b)=>a-b),s0=uniq[uniq.length-1];
      const strike=tes.filter(e=>e.slot===s0);
      const vr=strike.find(e=>e.lane==='deep')||strike.find(e=>e.lane==='bass');
      const vm=strike.find(e=>e.lane==='orta')||strike.find(e=>e.lane==='open');
      const vt=strike.find(e=>e.lane==='tiz')||strike.find(e=>e.lane==='third');
      if(!vr&&!vm&&!vt)return;
      const isLast=bi===bars.length-1,waves=isLast?6:5,dropId='drop-'+bi+'-'+Math.round(s0*10);
      const sv=strike.reduce((a,e)=>a+e.vel,0)/strike.length;
      /* Her halka sırası mutlaka oluşur: eksik orkestral register varsa
         mevcut gerçek telden oktav türetilir; zincirde delik bırakılmaz. */
      const rootWave=vr?vr.midi:(vm?vm.midi-12:vt.midi-24);
      const midWave=vm?vm.midi:(vr?vr.midi+12:vt.midi-12);
      const topWave=vt?vt.midi:(vm?vm.midi+12:vr.midi+24);
      const dropMidi=clamp(topWave,55,96);
      const dropVel=clamp(sv*.78,.035,.115);
      events.push({slot:s0+1,midi:dropMidi,vel:dropVel,dur:3,release:4.5,
        lane:'ring',hand:'R',hum:rng.range(-.008,.008),pan:rng.range(-.12,.12),
        ring:0,fog:0,distance:0,drop:true,dropId,waveId:dropId+'-0',kind:'ring'});
      ringNotes++;dropCount++;
      for(let r=1;r<=waves;r++){
        const at=s0+1+Math.round(1.7*r+.48*r*r);
        const source=r===1?[rootWave,midWave,topWave]
          :r===2?[rootWave,topWave+12]
          :r===3?[midWave,topWave]
          :r===4?[topWave]
          :r===5?[rootWave-12]
          :[rootWave];
        const ns=source;
        const gain=dropVel*Math.pow(.56,r),fog=r/waves;
        const pan0=(r%2?1:-1)*(.16+.115*r);
        ns.forEach((m,i)=>{
          events.push({slot:at,midi:clamp(m,24,96),vel:clamp(gain,.003,.10),
            dur:5+5*r,release:4.5+2.4*r,lane:'ring',hand:'R',hum:rng.range(-.012,.012),
            pan:clamp(pan0+(i-(ns.length-1)/2)*.09,-.94,.94),ring:r,fog,distance:r/waves,
            dropId,waveId:dropId+'-'+r,kind:'ring'});
          ringNotes++;
        });
        ringSets++;
      }
    });
    stats.rings=ringSets;stats.ringNotes=ringNotes;stats.drops=dropCount;

    /* --- NOTASYON KUANTALAMASI — porte otoritedir: her ritim temiz nota
           değerine oturur (16'lık·8'lik·noktalı 8'lik·4'lük·noktalı 4'lük·
           2'lik·noktalı 2'lik·tam), girişler 16'lık ızgaraya hizalanır.
           Su halkaları hariç — yıkama notaları tam nota olarak yazılır. --- */
    events.forEach(e=>{
      if(e.kind==='ring')return; /* halkalar nefes içine çınlamayı bilir — tam nota */
      /* NEFES-GÜVENLİ hizalama: aşağı yuvarla (asla ileri sıçramaz — nefes
         penceresine yeni giriş oluşmaz), güvenlik için pencere koruması */
      let sl=Math.floor(e.slot+1e-6);
      if(e.kind!=='final-legato'&&e.kind!=='final-glow'){
        for(const b of bars){
          if(!b.phraseEnd)continue;
          const w0=b.slotStart+b.slots-b.breathLen,w1=b.slotStart+b.slots;
          if(sl>=w0&&sl<w1){sl=Math.max(0,w0-1);break;}
        }
      }
      e.slot=sl;
      let best=1;
      for(const cv of NOTATION_CLEAN)if(Math.abs(cv-e.dur)<Math.abs(best-e.dur))best=cv;
      e.dur=best;
    });

    events.sort((a,b)=>a.slot-b.slot);
    events.forEach(e=>{
      e.vel=clamp(e.vel,e.kind==='ring'?0.003:0.02,0.34);e.dur=Math.max(1,e.dur);
      let bar=bars[bars.length-1];
      for(let i=0;i<bars.length;i++){if(e.slot>=bars[i].slotStart&&e.slot<bars[i].slotStart+bars[i].slots){bar=bars[i];break;}}
      e.spelling=spellMidiInBar(e.midi,bar);
    });

    /* sayaç: enstrümanlar + notalar */
    store.bump('instruments','piano_bass',compBass);
    store.bump('instruments','piano_triad',compMid);
    store.bump('instruments','piano_melody',compTiz);
    store.bump('instruments','piano_arp',compArp);
    store.bump('instruments','piano_deep',deepBars);
    store.bump('instruments','piano_3rd',thirdBars);
    events.forEach(e=>{store.bump('notes',String(e.midi%12),1);});

    /* imza (korunan mantık: çakışma → -vN) */
    const primAksak=Object.entries(aksakTally).sort((a,b)=>b[1]-a[1])[0][0];
    const primHand=Object.entries(handTally).sort((a,b)=>b[1]-a[1])[0][0];
    let sig=root+'·'+mode.label+'·'+form.label+'·'+AKSAK_BY_ID[primAksak].label.split(' ')[0]+'·'+primHand.toUpperCase();
    if(st.signatures.includes(sig))sig+='-v'+(st.compositions+1);
    st.signatures.push(sig);
    st.compositions=n+1;

    /* --- benzersiz tın rengi (kompozisyon başına) --- */
    const timbre={
      detuneCents:rng.range(-3.5,3.5),
      deepDetune:rng.range(-3,3), /* 2. piyano bağımsız akort — gerçek iki piyano derinliği */
      trebDetune:rng.range(-2.5,2.5), /* 3. piyano kendi akort rengi — üç ayrı piyano */
      stretchCents:rng.range(0.2,0.9),       // oktav gerilmesi (akustik piyano)
      partial2:rng.range(0.24,0.42),
      partial3:rng.range(0.05,0.14),
      filterHz:rng.range(1900,4200),
      reverbWet:rng.range(0.24,0.40),
      release:rng.range(2.6,4.8),
      attack:rng.range(0.006,0.016),
      panSpread:rng.range(0.16,0.34),
      seed
    };

    const structuralSlots=slotCursor;
    const performanceSlots=Math.ceil(Math.max(structuralSlots,
      events.reduce((mx,e)=>Math.max(mx,e.slot+Math.min(e.dur,20)),0))+8);
    const performanceBpm=performanceSlots/8; /* slot=16'lık → tam 120.000 sn */
    const plan={
      events,bars,num:n+1,signature:sig,root,mode:mode.label,modeId,form:form.label,
      verseMotif:verseM,refrainMotif:refrainM,bridgeMotif:bridgeM,
      totalSlots:performanceSlots,structuralSlots,performanceBpm,targetDurationSec:120,timbre,deepBars,deepPhasesOff,thirdBars,thirdPhasesOff,thirdCells,
      pikoloBars,pizBars,heartBars,
      stats:{potential:stats.potential,rests:stats.rests,strikes:stats.strikes,
             restFraction:stats.potential?stats.rests/stats.potential:0,
             deep:stats.deep||0,third:stats.third||0,cells:stats.cells||0,
             tutti:stats.tutti||0,tuttiBars:stats.tuttiBars||0,
             weave:stats.weave||0,openLegato:stats.openLegato||0,
             triadLegatoBars:stats.triadLegatoBars||0,
             pikolo:stats.pikolo||0,pikoloLow:stats.pikoloLow||0,
             pikoloOctaves:stats.pikoloOctaves||0,pikoloGranules:stats.pikoloGranules||0,
             motifMatches:stats.pikolo||0,
             piz:stats.piz||0,heart:stats.heart||0,
             rings:stats.rings||0,ringNotes:stats.ringNotes||0,drops:stats.drops||0,
             chordOrderLog:stats.chordOrderLog}
    };
    plan.thesis=analyzeThesisPlan(plan,phaseAudits);
    return plan;
  }

  /* ---- tek bar kurulumu: bas / orta / tiz / süs + SUS planı ---- */
  buildBar(bar,rng,perm,permDeep,perm3,legato,deepOn,thirdOn,phraseHist,stats,poly,events,bars){
    const e=bar.energy;
    const H=bar.handId;
    const reg={
      bass:H==='capraz'?[38,52]:[36,52],
      orta:H==='birlesik'?[50,67]:H==='capraz'?[55,74]:[48,64],
      mel:H==='birlesik'?[55,74]:H==='capraz'?[40,60]:[60,84],
      arp:[72,88]
    };
    /* bölüm karakteri — nota aralığı: gelişme/solo/final geniş, intro/outro dar */
    const wide=(bar.role==='bridge'||bar.role==='solo'||bar.role==='final')?4:
      (bar.role==='intro'||bar.role==='outro')?-3:0;
    if(wide){
      reg.mel=[Math.max(46,reg.mel[0]-Math.ceil(wide/2)),clamp(reg.mel[1]+wide,60,88)];
      reg.orta=[Math.max(44,reg.orta[0]-1),clamp(reg.orta[1]+Math.floor(wide/2),48,78)];
    }
    const potential=[]; // {slot,lane,emit:fn}
    const permOrder=perm.nextOrder(bar.chord.key,bar.chord.pcs.length);
    const tonePcs=permOrder.map(i=>bar.chord.pcs[i]); // ASLA aynı sıra

    /* --- PARALEL ORKESTRA KARARI ---
       Bu bar TUTTİ mi? (üç piyano aynı anda, aynı figürü paralel
       oktavlarda çalar — orkestra çifletmesi). NAKARAT ve GRAND FİNAL
       en yüksek olasılık; outro'nun son 2 barı her zaman grand final. */
    const orchProb=bar.role==='chorus'?0.75
      :bar.role==='final'?0.90
      :bar.role==='lift'?0.55
      :bar.role==='bridge'?0.35
      :bar.role==='outro'?0.50
      :bar.role==='verse'?0.22
      :bar.role==='solo'?0.18 /* solo: orkestra susar, sahne piyanodadır */
      :0.12;
    const grandFinal=(bar.role==='outro'||bar.role==='chorus'||bar.role==='final')&&bar.barInPhase>=bar.bars-2;
    const tuttiBar=grandFinal||rng.chance(orchProb);

    /* --- SOL EL BAS (piano_bass) --- */
    const bassMidi=pcToMidi(bar.chord.rootPc,reg.bass[0],reg.bass[1],46);
    const bassIs5=rng.chance(0.18),bassIs7=rng.chance(0.12);
    let bassPc=bar.chord.rootPc;
    if(bassIs5)bassPc=(bar.chord.rootPc+7)%12;       // 5'li bas
    else if(bassIs7&&bar.chord.extSemi!=null)bassPc=(bar.chord.rootPc+bar.chord.extSemi)%12; // diyatonik 7'li bas
    const bassMidi2=pcToMidi(bassPc,reg.bass[0],reg.bass[1],46);
    potential.push({slot:0,lane:'bass',emit:()=>{
      events.push({slot:bar.slotStart+0,midi:bassMidi2,vel:0.15+e*0.05,dur:Math.min(bar.slots,14),
        lane:'bass',hand:'L',hum:rng.range(-0.012,0.012),kind:'bass'});
      bar._bass=true;
    }});
    if(bar.pulses>=4&&rng.chance(tuttiBar?0.30:0.55)){
      const mid=Math.floor(bar.slots/2);
      potential.push({slot:mid,lane:'bass',emit:()=>{
        const alt=pcToMidi(bassIs5?bar.chord.rootPc:((bar.chord.rootPc+7)%12),reg.bass[0],reg.bass[1],46);
        events.push({slot:bar.slotStart+mid,midi:alt,vel:0.10+e*0.04,dur:8,
          lane:'bass',hand:'L',hum:rng.range(-0.012,0.012),kind:'bass'});
      }});
    }

    /* --- TRİAD → LEGATO DÖNÜŞÜMÜ -------------------------------
       Eski kısa "flow" triadları burada artık üretilmez. Yalnız kontur
       grameri seçilir; akorun bütün gerçek sesleri aşağıdaki LegatoVoicer
       tarafından geniş register'a açılarak, giriş aralığından uzun nota
       süreleriyle üst üste bindirilir. Bu bir ek katman değil, triadın
       çalım biçiminin doğrudan legatoya dönüştürülmesidir. */
    const arpId=this.store.least(ARP_PATTERNS.map(a=>a.id),'arps',3,rng);
    this.store.bump('arps',arpId);
    const AP=ARP_BY_ID[arpId];
    bar.arpId=arpId;bar.arpLabel=AP.label+' · TRIAD LEGATO';

    /* --- SAĞ EL SOLO — ARP EZGİ DOKUMA + PİKOLO KONTRAST NEFESİ ---
       Görev 14: arp solosu dolgun dokunur — uzun motifler (9-10 nota),
       çıpalar arası ölçekli GEÇ SES akışı, yüksek enerjide ÇİFT VURUŞ
       16'lığı. Kontrast bölümlerinde (köprü/ara/solo) arp melodisi
       susar; pikolo söyler: uzak doğu + native amerikan nefes ataklı
       ezgiler — çevirme süsleri ve nefes suslarıyla. */
    const motif=MOTIF_BY_ID[bar.motifId];
    const op=this.devOp(rng,bar.motifId,phraseIdx_safe(bar),phraseHist);
    bar.devOp=op;
    const motifBlueprint=MotifMatcher.blueprint(motif,op,bar,poly);
    const melCenter=(reg.mel[0]+reg.mel[1])/2;
    let prevMidi=null;
    const notes=[],pikoNotes=[];
    if(bar.pikoloMode){
      /* ---- PİKOLO HARMAN SOLOSU ---------------------------------
         Ana nakarat motifi + pentatonik nefes ölçeği + akor yakınlığı
         + dalga konturu tek aday puanında birleşir. Her ana ses tam oktav
         çiftiyle kalınlaşır. Triad renkleri ise ASLA blok basılmaz:
         art arda gelen düşük-gain granüller olarak uzun seslere karışır. */
      const P=bar.pikoloMode;
      bar.pikoloLabel='ANA MOTİF KİLİDİ · '+P.label+' NEFES RENGİ';
      const endSlot=Math.max(6,bar.slots-(bar.phraseEnd?bar.breathLen:1));
      let last=72;
      motifBlueprint.forEach(bp=>{
        if(bp.slot>=endSlot)return;
        const pool=[];for(let m=62;m<=94;m++)if(m%12===bp.pc)pool.push(m);
        const target=74+8*Math.sin(bp.u*Math.PI*2+bar.barInPhase*.52)+3*Math.sin(bp.u*Math.PI);
        pool.sort((a,b)=>(Math.abs(a-target)*.68+Math.abs(a-last)*.32)-
          (Math.abs(b-target)*.68+Math.abs(b-last)*.32));
        const m=pool[0];if(m==null)return;last=m;
        pikoNotes.push({slot:bp.slot,midi:m,low:m-12,strong:bp.strong,i:bp.u,
          motifDegree:bp.degree,phraseLast:bp.index===motifBlueprint[motifBlueprint.length-1].index,
          motifToken:bp.token,motifPc:bp.pc,index:bp.index});
      });
      const principalSlots=new Set(pikoNotes.map(n=>n.slot));
      pikoNotes.forEach((nt,ni)=>{
        potential.push({slot:nt.slot,lane:'pikolo',anchor:nt.strong,syncToken:nt.motifToken,emit:()=>{
          const arch=.78+.48*Math.sin(nt.i*Math.PI),wave=.90+.12*Math.sin(nt.i*Math.PI*4+bar.barInPhase);
          const vv=clamp((.102+e*.056)*arch*wave*(nt.strong?1.08:.94)*rng.range(.95,1.05),.026,.22);
          const longDur=nt.phraseLast?20:nt.strong?16:8;
          const octaveGroup='piko-oct-'+bars.length+'-'+ni;
          events.push({slot:bar.slotStart+nt.slot,midi:nt.midi,vel:vv,dur:longDur,release:7.8+e*1.6,
            lane:'pikolo',hand:'R',hum:rng.range(-.012,.012),pan:clamp(.20+(nt.midi-72)/42,-.08,.70),
            barIndex:bars.length,motifId:bar.motifId,motifDegree:nt.motifDegree,
            motifToken:nt.motifToken,motifMatch:true,fusion:true,
            harmonyGroup:octaveGroup,allowOctavePair:true,kind:'pikolo-wave'});
          events.push({slot:bar.slotStart+nt.slot,midi:nt.low,vel:clamp(vv*.48,.022,.10),dur:longDur+4,
            release:10.2+e*2,lane:'pikoLow',hand:'L2',hum:rng.range(-.014,.014),pan:-.28,
            barIndex:bars.length,motifId:bar.motifId,motifToken:nt.motifToken,motifMatch:true,
            fusion:true,harmonyGroup:octaveGroup,allowOctavePair:true,kind:'pikolo-octave'});
          stats.pikolo=(stats.pikolo||0)+1;stats.pikoloLow=(stats.pikoloLow||0)+1;
          stats.pikoloOctaves=(stats.pikoloOctaves||0)+1;bar._pikolo=true;bar._pikoLow=true;

          /* Akor triadı üç farklı başlangıç granülüne ayrılır. Ana pikolo
             ve başka granüllerle aynı onset kullanılmaz. */
          if(nt.strong){
            const gId='piko-gran-'+bars.length+'-'+ni,used=new Set(principalSlots);
            let cursor=nt.slot+1;
            bar.chord.pcs.slice(0,3).forEach((pc,j)=>{
              while(used.has(cursor)&&cursor<endSlot-1)cursor++;
              if(cursor>=endSlot||cursor>=bar.slots-1)return;
              const center=nt.midi+(j-1)*3;
              const gm=pcToMidi(pc,55,88,center);if(gm==null)return;
              events.push({slot:bar.slotStart+cursor,midi:gm,vel:clamp(vv*(.29-j*.035),.018,.062),
                dur:j===2?12:8,release:7.2+j*.8,lane:gm<62?'pikoLow':'pikolo',hand:gm<62?'L2':'R',
                hum:rng.range(-.012,.012),pan:clamp((gm-70)/44,-.42,.48),barIndex:bars.length,
                motifId:bar.motifId,motifToken:nt.motifToken,parentToken:nt.motifToken,motifMatch:true,
                fusion:true,harmonyGroup:gId,granularIndex:j,kind:'pikolo-granule'});
              used.add(cursor);cursor+=2;stats.pikoloGranules=(stats.pikoloGranules||0)+1;
            });
          }
        }});
      });
    }
    {
      /* ---- AKTİF ANA MELODİ — pikolo varken de kesilmez ------------ */
      const degs=motifBlueprint.map(x=>x.degree);
      motifBlueprint.forEach(bp=>{
        const m=pcToMidi(bp.pc,reg.mel[0],reg.mel[1],prevMidi==null?melCenter:prevMidi);
        if(m==null)return;prevMidi=m;
        notes.push({slot:bp.slot,midi:m,strong:bp.strong,i:bp.u,deg:bp.degree,
          motifToken:bp.token,motifPc:bp.pc,index:bp.index});
      });
      notes.forEach(nt=>{
        potential.push({slot:nt.slot,lane:'tiz',anchor:nt.strong,syncToken:nt.motifToken,emit:()=>{
          const arch=0.75+0.45*Math.sin(nt.i*Math.PI); /* nefes kavisı */
          events.push({slot:bar.slotStart+nt.slot,midi:nt.midi,
            vel:(0.10+e*0.06)*arch*(nt.strong?1.1:0.95)*rng.range(0.85,1.12),
            dur:nt.i>.82?8:(nt.strong?rng.int(4,6):rng.int(2,4)),lane:'tiz',hand:'R',
            hum:rng.range(-0.016,0.016),barIndex:bars.length,motifId:bar.motifId,
            motifDegree:nt.deg,motifToken:nt.motifToken,motifMatch:true,activeMain:true,
            refrain:bar.role==='chorus'||bar.role==='final',kind:'melody'});
          bar._tiz=true;
        }});
      });
      /* --- GEÇ SES DOKUMASI — çıpalar arası ölçekli dolgu: arpın dolgun
             dokusu. Dolgu genel sus dengesiyle birlikte nefes alır.
             Kasis barında dokuma susar. --- */
      if(!tuttiBar&&rng.chance(0.55+0.40*e*(motif.density||0.85))&&notes.length>=2){
        const used=new Set(notes.map(n2=>n2.slot));
        let insN=0;
        for(let i=0;i<notes.length-1&&insN<8;i++){
          const A=notes[i],B=notes[i+1];
          const gapS=B.slot-A.slot,gapD=B.deg-A.deg;
          if(Math.abs(gapD)<2||gapS<2)continue;
          const nIns=Math.min(Math.abs(gapD)-1,3);
          for(let k=1;k<=nIns&&insN<8;k++){
            const dg=A.deg+Math.sign(gapD)*Math.ceil(Math.abs(gapD)*k/(nIns+1));
            const slot=Math.round((A.slot+gapS*k/(nIns+1))*2)/2;
            if(slot<=A.slot||slot>=B.slot||used.has(slot)||slot>=bar.slots)continue;
            used.add(slot);
            const within2=mod7(dg);
            const pc2=(bar.keyPc+bar.modeSteps[within2]+12)%12;
            const m=pcToMidi(pc2,reg.mel[0],reg.mel[1],A.midi);
            if(m==null)continue;
            potential.push({slot,lane:'tiz',emit:()=>{
              events.push({slot:bar.slotStart+slot,midi:m,
                vel:clamp((0.10+e*0.06)*0.70*rng.range(0.85,1.1),0.02,0.34),
                dur:gapS>=3?2:1,lane:'tiz',hand:'R',hum:rng.range(-0.016,0.016),kind:'melody'});
              bar._tiz=true;stats.weave=(stats.weave||0)+1;
            }});
            insN++;
          }
        }
      }
      /* --- ARP ÇİFT VURUŞU — yüksek enerjide çıpa notası 16'lık tekrar --- */
      if(!tuttiBar&&e>0.65){
        let dbN=0;
        const used=new Set(notes.map(n2=>n2.slot));
        for(const nt of notes){
          if(dbN>=3)break;
          if(!nt.strong||rng.chance(0.5))continue;
          const slot=nt.slot+1;
          if(slot>=bar.slots||used.has(slot))continue;
          used.add(slot);
          potential.push({slot,lane:'tiz',emit:()=>{
            events.push({slot:bar.slotStart+slot,midi:nt.midi,
              vel:clamp((0.10+e*0.06)*0.75*rng.range(0.85,1.1),0.02,0.34),
              dur:1,lane:'tiz',hand:'R',hum:rng.range(-0.016,0.016),kind:'melody'});
            bar._tiz=true;stats.weave=(stats.weave||0)+1;
          }});
          dbN++;
        }
      }
    }

    /* --- ARP SÜSLEME (piano_arp) — nefes sonu tatlı tırmanış --- */
    if(bar.phraseEnd&&rng.chance(0.30)){
      const runN=rng.int(3,5);
      for(let k=0;k<runN;k++){
        const slot=bar.slots-2-Math.floor((runN-k)*0.9);
        if(slot<bar.slots*0.6)continue;
        const pc=bar.chord.pcs[k%bar.chord.pcs.length];
        const m=pcToMidi(pc,reg.arp[0],reg.arp[1],76+k*2);
        if(m==null)continue;
        potential.push({slot,lane:'arp',emit:()=>{
          events.push({slot:bar.slotStart+slot,midi:m,vel:0.05+rng.range(0,0.03),
            dur:3,lane:'arp',hand:'R',hum:rng.range(-0.01,0.01),kind:'sparkle'});
          bar._arp=true;
        }});
      }
    }

    /* --- SUS PLANI: %25–50 · bas/orta/tiz senkron nefesler --- */
    const target=Math.round(bar.restDensity*potential.length);
    const breathSet=new Set();
    if(bar.phraseEnd){
      for(let s=bar.slots-bar.breathLen;s<bar.slots;s++)breathSet.add(s);
    }
    if(rng.chance(0.6)){ // senkron sus — grup sınırına
      const gs=bar.groupStarts.slice(1);
      if(gs.length)breathSet.add(rng.pick(gs));
    }
    let marked=0;
    const restMark=new Set();
    const syncBreath=new Set();
    potential.forEach(p=>{if(p.syncToken&&breathSet.has(p.slot))syncBreath.add(p.syncToken);});
    potential.forEach(p=>{
      if(breathSet.has(p.slot)||(p.syncToken&&syncBreath.has(p.syncToken))){restMark.add(p);marked++;}
    });
    const syncGroups=new Map();
    potential.forEach(p=>{if(p.syncToken){if(!syncGroups.has(p.syncToken))syncGroups.set(p.syncToken,[]);syncGroups.get(p.syncToken).push(p);}});
    const shuffled=rng.shuffle(potential.filter(p=>!restMark.has(p)))
      .sort((x,y)=>((x.soft?0:1)-(y.soft?0:1))); /* geç ses/çift vuruş önce susar */
    for(const p of shuffled){
      if(marked>=target)break;
      if(restMark.has(p))continue;
      if(p.lane==='bass'&&p.slot===0&&rng.chance(0.8))continue; // bar başı bas çoğunlukla kalsın
      if(p.anchor&&(p.lane==='pikolo'||p.lane==='tiz'))continue; // motif çıpaları daima yaşar
      if(p.anchor&&rng.chance(0.75))continue; // diğer ezgi çıpaları çoğunlukla yaşar
      if(p.syncToken){
        const g=(syncGroups.get(p.syncToken)||[]).filter(x=>!restMark.has(x));
        if(marked+g.length>target+2)continue;
        g.forEach(x=>restMark.add(x));marked+=g.length; /* ana motif + pikolo birlikte nefes alır */
      }else{restMark.add(p);marked++;}
    }
    stats.potential+=potential.length;
    stats.rests+=marked;
    stats.strikes+=potential.length-marked;
    potential.forEach(p=>{
      if(restMark.has(p)){
        bar.susSlots.add(p.slot);
        if(p.lane==='bass')bar._bass=bar._bass||false;
        return;
      }
      p.emit();
    });

    /* --- AÇIK TRİAD LEGATO ARPEJİ — 4–5 oktavlık atmosferik alan ---
       Blok triad yerine kök/üçlü/beşli/uzantı geniş aralığa yayılır.
       Önceki ölçüyle minimum ses hareketi korunur. Nota süreleri giriş
       aralığından uzundur; kuyruklar üst üste binerek kesintisiz nefes
       oluşturur. Pikolo bölümünde düşük gövde olarak da çalışır. */
    /* Her ölçüde zorunlu: triadın kendisi legatodur. */
    {
      const vo=legato.choose(bar.chord,e,bar.handId);
      const path=legato.path(vo.notes,AP.id);
      const nominal=e>.76?2:e>.42?3:4;
      const endSlot=Math.max(nominal,bar.slots-(bar.phraseEnd?bar.breathLen:0));
      /* En kısa ölçüde bile seslemenin iki ucuna ulaş: açıklık yalnız
         teorik adayda değil, gerçekten duyulan arpej dizisinde bulunur. */
      const step=Math.max(1,Math.min(nominal,Math.floor((endSlot-1)/Math.max(1,vo.notes.length-1))));
      const dur=Math.max(4,step*2);
      for(let s=0,i=0;s<endSlot;s+=step,i++){
        const m=path[i%path.length];if(m==null)continue;
        const u=s/Math.max(1,endSlot),arch=.70+.42*Math.sin(u*Math.PI);
        const low=m<55,high=m>76;
        const balancedDur=Math.max(step+2,dur+((i%3)===0?2:(i%3)===2?1:0));
        events.push({slot:bar.slotStart+s,midi:m,
          vel:clamp((.040+e*.027)*arch*(low?1.08:high?.82:.94)*rng.range(.93,1.07),.022,.105),
          dur:balancedDur,release:6.2+e*2.8,lane:'open',hand:m<60?'L':'R',
          hum:rng.range(-.012,.012),pan:clamp((m-64)/42,-.62,.62),
          barIndex:bars.length,openSpan:vo.span,triadConverted:true,articulation:'legato',
          harmonyGroup:'triad-'+bars.length,granularIndex:i,kind:'triad-legato'});
        stats.openLegato=(stats.openLegato||0)+1;
      }
      bar._open=true;bar._mid=true;bar.openSpan=vo.span;
      stats.triadLegatoBars=(stats.triadLegatoBars||0)+1;
    }

    /* --- DERİN YATAK — arp tellerinin en kalını: uzun yankılı kök yatak ---
       Ana piyanonun en altında (C1–A2), barları aşan uzun süreli kontrast
       legato triadlar: kök + beşli + geç renk tonu, her biri sonraki bara
       taşar → sis gibi bulanan harmonik yatak. Nefes penceresine denk
       gelen YENİ girişler çalınmaz (legato susar, çalan notalar söner). */
    bar.deepCount=0;
    if(deepOn){
      const DR=[24,45];
      const dOrder=permDeep.nextOrder(bar.chord.key,bar.chord.pcs.length);
      const dTones=dOrder.map(i=>bar.chord.pcs[i]);
      const overflow=rng.int(3,9);
      const deepPot=[];
      const bassPc=rng.chance(0.20)?((dTones[0]+7)%12):dTones[0]; // %20 kontrast: beşli bas
      const rootM=pcToMidi(bassPc,DR[0],DR[1],29);
      if(rootM!=null){
        const s0=rng.chance(0.7)?0:rng.int(1,2);
        deepPot.push({slot:s0,midi:rootM,vel:0.045+e*0.02+rng.range(-0.008,0.012),dur:bar.slots-s0+overflow});
        if(rng.chance(0.22)&&rootM-12>=21){ // oktav pedal (A0'a kadar)
          deepPot.push({slot:Math.min(s0+1,bar.slots-1),midi:rootM-12,vel:0.034+e*0.014,dur:bar.slots-s0+overflow+2});
        }
      }
      const fifthM=pcToMidi(dTones[1]!==undefined?dTones[1]:(bar.chord.rootPc+7)%12,DR[0]+6,DR[1],36);
      if(fifthM!=null){
        const s1=rng.int(3,Math.max(4,Math.floor(bar.slots*0.45)));
        deepPot.push({slot:s1,midi:fifthM,vel:0.040+e*0.018+rng.range(-0.006,0.008),dur:bar.slots-s1+overflow});
      }
      if(rng.chance(0.75)&&dTones.length>2){
        const thirdM=pcToMidi(dTones[2],DR[0]+8,DR[1],42);
        if(thirdM!=null){
          const s2=rng.int(Math.floor(bar.slots*0.35),Math.max(5,bar.slots-6));
          deepPot.push({slot:s2,midi:thirdM,vel:0.034+e*0.015,dur:Math.max(6,bar.slots-s2+Math.floor(overflow*0.7))});
        }
      }
      deepPot.forEach(p=>{
        if(breathSet.has(p.slot))return; // nefes penceresi: yeni giriş yok
        events.push({slot:bar.slotStart+p.slot,midi:p.midi,vel:clamp(p.vel,0.02,0.34),
          dur:p.dur,lane:'deep',hand:'L2',hum:rng.range(-0.018,0.018),kind:'deep-flow'});
        bar.deepCount++;bar._deep=true;
        stats.deep=(stats.deep||0)+1;
      });
    }

    /* --- PİZİKATO — vurgulu tık: akor ilerlemesi alttan kök + dbl --- */
    bar.pizCount=0;
    const pizOn=!tuttiBar&&['verse','lift','chorus','solo'].includes(bar.role)&&rng.chance(0.62);
    if(pizOn){
      bar.groupStarts.forEach(s=>{
        if(breathSet.has(s))return;
        const rootM=pcToMidi(bar.chord.rootPc,36,52,45);
        if(rootM==null)return;
        const vA=clamp((0.075+e*0.045)*rng.range(0.9,1.1),0.02,0.34);
        events.push({slot:bar.slotStart+s,midi:rootM,vel:vA,
          dur:rng.chance(0.5)?1:2,lane:'pizikato',hand:'L2',hum:rng.range(-0.01,0.01),kind:'piz'});
        bar.pizCount++;bar._piz=true;stats.piz=(stats.piz||0)+1;
        if(rng.chance(0.5)){ /* dbl: oktav ya da beşli ikinci vurgusu */
          const mm=rootM+(rng.chance(0.6)?12:7);
          const s2=s+(rng.chance(0.6)?1:2);
          if(s2<bar.slots&&!breathSet.has(s2)&&mm<=83){
            events.push({slot:bar.slotStart+s2,midi:mm,
              vel:clamp(vA*0.72*rng.range(0.9,1.1),0.02,0.34),
              dur:1,lane:'pizikato',hand:'L2',hum:rng.range(-0.01,0.01),kind:'piz'});
            bar.pizCount++;bar._piz=true;stats.piz=(stats.piz||0)+1;
          }
        }
      });
    }

    /* --- KALP ATIŞI BAS — akustik bas: lub-dub metronom kimliği --- */
    bar.heartCount=0;
    const heartOn=!tuttiBar&&rng.chance(bar.role==='final'?0.92:
      (['chorus','outro','lift'].includes(bar.role)?0.55:
       (['bridge','verse'].includes(bar.role)?0.25:0)));
    if(heartOn){
      bar.groupStarts.forEach(s=>{
        if(breathSet.has(s))return;
        const rootM=pcToMidi(bar.chord.rootPc,28,43,36); /* E1–G2 kalp kökü */
        if(rootM==null)return;
        /* LUB: güçlü ilk vuruş · DUB: yumuşak takip — kalp ritmi */
        events.push({slot:bar.slotStart+s,midi:rootM,
          vel:clamp((0.09+e*0.04)*rng.range(0.92,1.08),0.02,0.34),
          dur:2,lane:'abass',hand:'L2',hum:rng.range(-0.008,0.008),kind:'heart'});
        bar.heartCount++;bar._heart=true;stats.heart=(stats.heart||0)+1;
        const s2=s+2;
        if(s2<bar.slots&&!breathSet.has(s2)){
          events.push({slot:bar.slotStart+s2,midi:rootM+7,
            vel:clamp((0.09+e*0.04)*0.62*rng.range(0.9,1.1),0.02,0.34),
            dur:2,lane:'abass',hand:'L2',hum:rng.range(-0.008,0.008),kind:'heart'});
          bar.heartCount++;bar._heart=true;stats.heart=(stats.heart||0)+1;
        }
      });
    }

    /* --- YANKI BİLEŞKE — tiz tellerde sinematik eko hücreleri ---
       BİLEŞKE: 1. piyanonun melodi notalarının üst oktav ekosu +
       2. piyanonun harmonisiyle ortak akor tonları → tizlerde kısa
       hücreler halinde AKTİF TEKRARLAR: dramatik ostinato kabarması
       (tekrarlar önce kabarır sonra söner — sinematik dalga). */
    bar.thirdCount=0;bar._cells=0;
    if(thirdOn&&!tuttiBar){ /* tutti barında eko hücreleri susar — orkestral çifletme devrede */
      const TR=[72,95]; /* C5–B6 */
      const melEcho=[],fusionNotes=notes.concat(pikoNotes).sort((a,b)=>a.slot-b.slot);
      for(let k=fusionNotes.length-1;k>=0&&melEcho.length<2;k--){
        const m=fusionNotes[k].midi+12; /* ana melodi + pikolo bileşkesinin üst eko izi */
        if(m>=TR[0]&&m<=TR[1]&&!melEcho.includes(m))melEcho.push(m);
      }
      const ord3=perm3.nextOrder(bar.chord.key,bar.chord.pcs.length);
      const chT=[];
      for(let i=0;i<Math.min(3,ord3.length);i++){
        const m=pcToMidi(bar.chord.pcs[ord3[i]],72,95,84);
        if(m!=null&&!chT.includes(m))chT.push(m);
      }
      const cell=melEcho.concat(chT).slice(0,rng.int(3,4));
      if(cell.length>=2){
        const intense=(bar.role==='chorus'||bar.role==='outro');
        const R=intense?rng.pick([2,3]):rng.pick([3,4]);
        const startSlot=rng.chance(0.5)?0:rng.int(2,5);
        const reps=clamp(Math.floor((bar.slots-startSlot)/R),2,intense?6:4);
        for(let rep=0;rep<reps;rep++){
          const swell=0.8+0.35*Math.sin((rep+0.5)/reps*Math.PI); /* dramatik kabarma */
          for(let i=0;i<cell.length;i++){
            const slot=startSlot+rep*R+i;
            if(slot>=bar.slots)break;
            /* nefeste yeni giriş yok — kesirli slotlar dahil kesin pencere kontrolü */
            const inBreath=bar.phraseEnd?(slot>=bar.slots-bar.breathLen-1e-9):breathSet.has(Math.floor(slot+1e-9));
            if(inBreath)continue;
            events.push({slot:bar.slotStart+slot,midi:cell[i],
              vel:clamp((0.035+e*0.03)*swell*rng.range(0.9,1.1),0.02,0.34),
              dur:rng.int(6,9),release:6.8,lane:'third',hand:'R3',hum:rng.range(-0.014,0.014),
              harmonyGroup:'third-'+bars.length+'-'+rep,granularIndex:i,articulation:'legato',kind:'third-legato'});
            bar.thirdCount++;bar._third=true;
            stats.third=(stats.third||0)+1;
          }
        }
        if(bar.thirdCount>0){bar._cells=1;stats.cells=(stats.cells||0)+1;}
      }
    }

    /* --- KASİS — arp glissandosu: oktav çapası + bastan tepeye 16'lık koşu ---
       Orkestra çifletmesi (doubling): derin kök · bas kök · orta triad
       (perm sırasıyla) · tiz üst ses · bileşke +1 oktav parıltısı.
       Her ses ±8 ms insan sapmasıyla girer (bölüm ensemble hissi —
       orkestra asla milimetrik aynı anda çalmaz). Faz konumuna göre
       orkestral kabarma: korolar açılır, söner. */
    bar.tuttiCount=0;
    if(tuttiBar){
      const phasePos=bar.bars>1?bar.barInPhase/(bar.bars-1):0.5;
      const phaseSwell=0.80+0.30*Math.sin(phasePos*Math.PI);
      const tSlots=[];
      for(let p=0;p<bar.pulses;p++){
        const s=p*4;
        if(grandFinal||bar.groupStarts.includes(s)||rng.chance(0.75))tSlots.push(s);
      }
      const kasisLane=m=>m<48?'deep':m<60?'bass':m<72?'orta':'tiz';
      const kasisHand=m=>m<60?'L2':'R';
      tSlots.forEach((s,ti)=>{
        if(breathSet.has(s))return; /* nefes penceresi: kasis da susar */
        const barSwell=0.85+0.25*Math.sin((ti+0.5)/Math.max(1,tSlots.length)*Math.PI);
        const vel=clamp((0.045+e*0.05)*phaseSwell*barSwell,0.02,0.16);
        const ens=()=>rng.range(-0.008,0.008); /* ensemble sapması ±8 ms */
        if(ti<tSlots.length-1){ /* kasis öncesi: oktav çapası (bas teli) */
          const rb=pcToMidi(bar.chord.rootPc,36,52,45);
          [rb,rb!=null?rb+12:null].forEach((mm,oi)=>{
            if(mm==null||s+oi>=bar.slots)return;
            events.push({slot:bar.slotStart+s+oi,midi:mm,
              vel:clamp(vel*(mm>rb?0.8:1.0)*rng.range(0.92,1.08),0.02,0.34),
              dur:rng.int(8,12),release:6.2,lane:mm<48?'deep':'bass',hand:mm<48?'L2':'L',hum:ens(),
              harmonyGroup:'tutti-'+bars.length+'-'+ti,granularIndex:oi,articulation:'legato',kind:'tutti'});
            bar.tuttiCount++;stats.tutti=(stats.tutti||0)+1;
          });
        }else{ /* KASİS: bastan tepeye 16'lık glissando koşusu + çengel */
          const run=[];
          for(let m=36;m<=84;m++)
            if(bar.chord.pcs.includes(m%12))run.push(m);
          const take=run.slice(rng.int(0,2),rng.int(8,12));
          take.forEach((mm,ki)=>{
            const slot=s+ki;
            if(slot>=bar.slots)return;
            if(bar.phraseEnd&&slot>=bar.slots-bar.breathLen)return;
            events.push({slot:bar.slotStart+slot,midi:mm,
              vel:clamp(vel*(0.75+0.45*(ki/Math.max(1,take.length-1)))*rng.range(0.92,1.08),0.02,0.34),
              dur:3,release:4.8,lane:kasisLane(mm),hand:kasisHand(mm),hum:ens(),
              harmonyGroup:'tutti-run-'+bars.length+'-'+ti,granularIndex:ki,articulation:'legato',kind:'tutti'});
            bar.tuttiCount++;stats.tutti=(stats.tutti||0)+1;
          });
          const top=take.length?take[take.length-1]:null;
          if(top!=null){ /* iniş çengeli: tepe notası bağlanır */
            const slot=Math.min(bar.slots-2,s+take.length);
            events.push({slot:bar.slotStart+slot,midi:top,
              vel:clamp(vel*1.05*rng.range(0.92,1.08),0.02,0.34),
              dur:7,release:6.4,lane:kasisLane(top),hand:kasisHand(top),hum:ens(),articulation:'legato',kind:'tutti'});
            bar.tuttiCount++;stats.tutti=(stats.tutti||0)+1;
          }
        }
      });
      if(bar.tuttiCount>0){bar._tutti=true;stats.tuttiBars=(stats.tuttiBars||0)+1;}
    }
    bar.events=events.filter(ev=>ev.slot>=bar.slotStart&&ev.slot<bar.slotStart+bar.slots);
    bars.push(bar);
    bar.stats={potential:potential.length,rests:marked};
  }

  /* motif geliştirme opı — aynı sunum iki kez gelmez */
  devOp(rng,motifId,phraseIdx,phraseHist){
    const ops=['düz','rot','inv','ret','aug','rot+inv','rot+aug','inv+aug'];
    const used=phraseHist[motifId]||new Set();
    let pool=ops.filter(o=>!used.has(o));
    if(!pool.length){used.clear();pool=ops.slice();}
    const op=pool[Math.floor(rng.f()*pool.length)]||'düz';
    used.add(op);phraseHist[motifId]=used;
    return op;
  }
}
function phraseIdx_safe(bar){return bar.phraseIdx;}

/* =====================================================================
   8. GERÇEK PİYANO ÖRNEK BANKASI — akustik kuyruk piyano MP3 notalar
      (okankaplanedu/emotion-orchestra-assets · A0–C8 · bemol adlandırma)
   ===================================================================== */
const SAMPLE_BASES=[
  'https://raw.githubusercontent.com/okankaplanedu/emotion-orchestra-assets/main/enstruman/acoustic_grand_piano-mp3/',
  'https://cdn.jsdelivr.net/gh/okankaplanedu/emotion-orchestra-assets@main/enstruman/acoustic_grand_piano-mp3/'
];
const ARP_BASES=[ /* ORJİNAL ARP ENSTRÜMANI — 48 gerçek tel (C2–B5) */
  'https://raw.githubusercontent.com/okankaplanedu/emotion-orchestra-assets/main/enstruman/acoustic_grand_piano-mp3/',
  'https://cdn.jsdelivr.net/gh/okankaplanedu/emotion-orchestra-assets@main/enstruman/acoustic_grand_piano-mp3/'
];
const PIKOLO_BASES=[ /* KONTRAST NEFES — 48 pikolo notası (C2–B5) */
  'https://raw.githubusercontent.com/okankaplanedu/emotion-orchestra-assets/main/enstruman/acoustic_grand_piano-mp3/',
  'https://cdn.jsdelivr.net/gh/okankaplanedu/emotion-orchestra-assets@main/enstruman/acoustic_grand_piano-mp3/'
];
const PIZ_BASES=[ /* PİZİKATO — 47 nota (C2–B5 · E5 örneği yok) */
  'https://raw.githubusercontent.com/okankaplanedu/emotion-orchestra-assets/main/enstruman/acoustic_grand_piano-mp3/',
  'https://cdn.jsdelivr.net/gh/okankaplanedu/emotion-orchestra-assets@main/enstruman/acoustic_grand_piano-mp3/'
];
const ABASS_BASES=[ /* KALP ATIŞI AKUSTİK BAS — 88 nota (A0–C8) */
  'https://raw.githubusercontent.com/okankaplanedu/emotion-orchestra-assets/main/enstruman/acoustic_grand_piano-mp3/',
  'https://cdn.jsdelivr.net/gh/okankaplanedu/emotion-orchestra-assets@main/enstruman/acoustic_grand_piano-mp3/'
];
const SAMPLE_NAMES=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
function midiToSampleName(midi){return SAMPLE_NAMES[midi%12]+(Math.floor(midi/12)-1);}

class SampleBank{
  constructor(ctx,bases){this.ctx=ctx;this.bases=bases||SAMPLE_BASES;this.map=new Map();this.missing=new Set();this.loadedRange=false;}
  get(midi){return this.map.get(midi)||null;}
  nearest(midi,maxDist){
    const exact=this.map.get(midi);if(exact)return exact;
    let key=null,dist=Infinity;for(const k of this.map.keys()){const d=Math.abs(k-midi);if(d<dist){dist=d;key=k;}}
    if(key==null||dist>(maxDist==null?3:maxDist))return null;
    const x=this.map.get(key);return{buf:x.buf,comp:x.comp,rate:(x.rate||1)*Math.pow(2,(midi-key)/12),anchor:key};
  }
  count(){return this.map.size;}
  async load(midi,fetchFn){
    if(this.map.has(midi)||this.missing.has(midi))return this.map.has(midi);
    let ab=null;
    for(const base of this.bases||SAMPLE_BASES){
      try{
        const r=await fetchFn(base+midiToSampleName(midi)+'.mp3');
        if(r&&r.ok){ab=await r.arrayBuffer();if(ab)break;}
      }catch(e){}
    }
    if(!ab){this.missing.add(midi);return false;}
    try{
      const buf=await this.ctx.decodeAudioData(ab);
      /* RMS normalizasyonu — notalar arası seviye eşitlenir */
      const d0=buf.getChannelData(0);
      let s=0,n=0;
      for(let i=0;i<d0.length;i+=16){s+=d0[i]*d0[i];n++;}
      const rms=Math.sqrt(s/Math.max(1,n))||0.001;
      this.map.set(midi,{buf,comp:clamp(0.016/rms,0.4,4.5)});
      return true;
    }catch(e){this.missing.add(midi);return false;}
  }
  async preload(lo,hi,concurrency,onProgress,fetchFn,step){
    const list=[],inc=Math.max(1,step||1);for(let m=lo;m<=hi;m+=inc)list.push(m);
    if(list[list.length-1]!==hi)list.push(hi);
    let done=0,okCount=0,idx=0;
    const worker=async()=>{
      while(idx<list.length){
        const m=list[idx++];
        if(await this.load(m,fetchFn))okCount++;
        done++;
        if(onProgress)onProgress(done,list.length,okCount);
      }
    };
    const ws=[];const k=Math.min(concurrency||6,list.length);
    for(let i=0;i<k;i++)ws.push(worker());
    await Promise.all(ws);
    this.loadedRange=true;
    return okCount;
  }
}

/* =====================================================================
   9. SES MOTORU — arp + piyano örnekleri · atmosfer/halka osilatörsüz + reverb
   ===================================================================== */
class Piano{
  constructor(){
    this.ctx=null;this.active=new Set();this.timbre=null;this.bus=null;
    this.filter=null;this.wet=null;this.dry=null;this.comp=null;this.master=null;
    this.bank=null;this.arpBank=null;this.pikoloBank=null;this.pizBank=null;this.bassBank=null;
    this.sampleNotes=0;this.synthNotes=0;this.arpNotes=0;this.breathNotes=0;
  }
  ensure(){
    if(this.ctx)return true;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return false;
      this.ctx=new AC();
      const c=this.ctx;
      this.bus=c.createGain();this.bus.gain.value=0.9;
      this.filter=c.createBiquadFilter();this.filter.type='lowpass';this.filter.frequency.value=2800;this.filter.Q.value=0.2;
      this.dry=c.createGain();this.dry.gain.value=0.85;
      this.wet=c.createGain();this.wet.gain.value=0.30;
      this.comp=c.createDynamicsCompressor();
      this.comp.threshold.value=-20;this.comp.knee.value=18;this.comp.ratio.value=2.5;
      this.comp.attack.value=0.02;this.comp.release.value=0.5;
      this.master=c.createGain();this.master.gain.value=1;
      this.reverb=c.createConvolver();this.reverb.buffer=this.makeIR(3.2);
      this.bus.connect(this.filter);
      this.filter.connect(this.dry);this.dry.connect(this.comp);
      this.filter.connect(this.reverb);this.reverb.connect(this.wet);this.wet.connect(this.comp);
      /* ---- MASTERING ZİNCİRİ — 3D dengeli stereo, canlı yayın için ----
         yapıştırıcı comp → 28 Hz rumble HP → 90 Hz sıcaklık (lowshelf +1 dB)
         → 2.6 kHz evcik kısma (−1.5 dB) → 8 kHz hava (highshelf +1.2 dB)
         → M/S STEREO GENİŞLETME (side ×1.22) → yumuşak LİMİTÖR (−4 dB,
         12:1) → master gain (dB kaydırıcı) → ANALYSER (canlı görsel)
         → çıkış. Haas gecikmeleri (bus2 16 ms, bus3 9 ms) üçüncü boyutu
         (ön-arka derinliği) kurar: derin piyano geride, tiz piyano yukarıda. */
      this.hp28=c.createBiquadFilter();this.hp28.type='highpass';this.hp28.frequency.value=28;
      this.eqWarm=c.createBiquadFilter();this.eqWarm.type='lowshelf';this.eqWarm.frequency.value=90;this.eqWarm.gain.value=1.0;
      this.eqTame=c.createBiquadFilter();this.eqTame.type='peaking';this.eqTame.frequency.value=2600;this.eqTame.Q.value=0.8;this.eqTame.gain.value=-1.5;
      this.eqAir=c.createBiquadFilter();this.eqAir.type='highshelf';this.eqAir.frequency.value=8000;this.eqAir.gain.value=1.2;
      const spl=c.createChannelSplitter(2);
      const mrg=c.createChannelMerger(2);
      const midG=c.createGain();midG.gain.value=0.5;         /* mid = (L+R)/2 */
      const sideG=c.createGain();sideG.gain.value=0.5;       /* side = (L-R)/2 */
      const invR=c.createGain();invR.gain.value=-1;
      const width=c.createGain();width.gain.value=1.22;      /* stereo sahne genişliği */
      const invSide=c.createGain();invSide.gain.value=-1;
      spl.connect(midG,0);spl.connect(midG,1);
      spl.connect(sideG,0);spl.connect(invR,1);invR.connect(sideG);
      midG.connect(mrg,0,0);midG.connect(mrg,0,1);
      sideG.connect(width);
      width.connect(mrg,0,0);                                /* L += side*W  */
      width.connect(invSide);invSide.connect(mrg,0,1);       /* R -= side*W  */
      this.msSplit=spl;this.msMerge=mrg;this.msWidth=width;
      this.limiter=c.createDynamicsCompressor();
      this.limiter.threshold.value=-4;this.limiter.knee.value=3;this.limiter.ratio.value=12;
      this.limiter.attack.value=0.002;this.limiter.release.value=0.12;
      this.analyser=c.createAnalyser();
      this.analyser.fftSize=512;this.analyser.smoothingTimeConstant=0.82;
      this.comp.connect(this.hp28);
      this.hp28.connect(this.eqWarm);this.eqWarm.connect(this.eqTame);this.eqTame.connect(this.eqAir);
      this.eqAir.connect(spl);
      mrg.connect(this.limiter);
      this.limiter.connect(this.master);
      this.master.connect(this.analyser);
      this.analyser.connect(c.destination);
      /* ---- 2. PİYANO ZİNCİRİ: daha koyu filtre + daha uzun/uzak reverb ---- */
      this.bus2=c.createGain();this.bus2.gain.value=0.85;
      this.deepFilter=c.createBiquadFilter();
      this.deepFilter.type='lowpass';this.deepFilter.frequency.value=1050;this.deepFilter.Q.value=0.3;
      this.dry2=c.createGain();this.dry2.gain.value=0.55;
      this.wet2=c.createGain();this.wet2.gain.value=0.5;
      this.reverb2=c.createConvolver();this.reverb2.buffer=this.makeIR(3.8);
      this.delay2=c.createDelay(0.06);this.delay2.delayTime.value=0.016; /* 3D: derin piyano 16 ms geride */
      this.bus2.connect(this.delay2);this.delay2.connect(this.deepFilter);
      this.deepFilter.connect(this.dry2);this.dry2.connect(this.comp);
      this.deepFilter.connect(this.reverb2);this.reverb2.connect(this.wet2);this.wet2.connect(this.comp);
      /* ---- 3. PİYANO ZİNCİRİ: parlak tiz + havadar uzun reverb (sağ-arka) ---- */
      this.bus3=c.createGain();this.bus3.gain.value=0.75;
      this.trebFilter=c.createBiquadFilter();
      this.trebFilter.type='lowpass';this.trebFilter.frequency.value=7000;this.trebFilter.Q.value=0.2;
      this.dry3=c.createGain();this.dry3.gain.value=0.5;
      this.wet3=c.createGain();this.wet3.gain.value=0.5;
      this.reverb3=c.createConvolver();this.reverb3.buffer=this.makeIR(3.4);
      this.delay3=c.createDelay(0.06);this.delay3.delayTime.value=0.009; /* 3D: tiz piyano 9 ms yukarıda */
      this.bus3.connect(this.delay3);this.delay3.connect(this.trebFilter);
      this.trebFilter.connect(this.dry3);this.dry3.connect(this.comp);
      this.trebFilter.connect(this.reverb3);this.reverb3.connect(this.wet3);this.wet3.connect(this.comp);
      /* ---- TRİAD LEGATO + PİKOLO GÖVDE BUS'I: geniş, sıcak, uzun ---- */
      this.openBus=c.createGain();this.openBus.gain.value=.78;
      this.openHP=c.createBiquadFilter();this.openHP.type='highpass';this.openHP.frequency.value=42;
      this.openLP=c.createBiquadFilter();this.openLP.type='lowpass';this.openLP.frequency.value=5200;this.openLP.Q.value=.18;
      this.openDry=c.createGain();this.openDry.gain.value=.46;
      this.openWet=c.createGain();this.openWet.gain.value=.58;
      this.reverbOpen=c.createConvolver();this.reverbOpen.buffer=this.makeIR(4.8);
      this.openDelay=c.createDelay(.05);this.openDelay.delayTime.value=.012;
      this.openBus.connect(this.openDelay);this.openDelay.connect(this.openHP);this.openHP.connect(this.openLP);
      this.openLP.connect(this.openDry);this.openDry.connect(this.comp);
      this.openLP.connect(this.reverbOpen);this.reverbOpen.connect(this.openWet);this.openWet.connect(this.comp);
      /* ---- SU HALKALARI ZİNCİRİ: koyu filtre + 7.5 sn reverb — uzayda yankı ---- */
      this.ringBus=c.createGain();this.ringBus.gain.value=0.9;
      this.ringFilter=c.createBiquadFilter();this.ringFilter.type='lowpass';
      this.ringFilter.frequency.value=3400;this.ringFilter.Q.value=0.1;
      this.ringDry=c.createGain();this.ringDry.gain.value=0.34;
      this.ringWet=c.createGain();this.ringWet.gain.value=0.78;
      this.reverbR=c.createConvolver();this.reverbR.buffer=this.makeIR(6.0);
      this.ringBus.connect(this.ringFilter);
      this.ringFilter.connect(this.ringDry);this.ringDry.connect(this.comp);
      this.ringFilter.connect(this.reverbR);this.reverbR.connect(this.ringWet);this.ringWet.connect(this.comp);
      /* Fog ağı: 0.41 sn gecikme, güvenli %24 feedback, 1.15 kHz'de
         buğulanan uzak tekrar. Feedback < 1 olduğundan enerji kararlıdır. */
      this.fogInput=c.createGain();this.fogInput.gain.value=1;
      this.fogDelay=c.createDelay(1.2);this.fogDelay.delayTime.value=.41;
      this.fogFilter=c.createBiquadFilter();this.fogFilter.type='lowpass';this.fogFilter.frequency.value=1150;this.fogFilter.Q.value=.12;
      this.fogFeedback=c.createGain();this.fogFeedback.gain.value=.24;
      this.fogWet=c.createGain();this.fogWet.gain.value=.34;
      this.fogInput.connect(this.fogDelay);this.fogDelay.connect(this.fogFilter);
      this.fogFilter.connect(this.fogFeedback);this.fogFeedback.connect(this.fogDelay);
      this.fogFilter.connect(this.fogWet);this.fogWet.connect(this.comp);
      return true;
    }catch(e){return false;}
  }
  makeIR(seconds){
    const c=this.ctx,sr=c.sampleRate,len=Math.floor(sr*seconds);
    const buf=c.createBuffer(2,len,sr);
    for(let ch=0;ch<2;ch++){
      const d=buf.getChannelData(ch);
      let lp=0;
      for(let i=0;i<len;i++){
        const t=i/len;
        const env=Math.pow(1-t,2.3)*(1-Math.exp(-i/80));
        const x=(Math.random()*2-1)*env;
        lp+=0.62*(x-lp); // yumuşak kuyruk
        d[i]=lp*0.8;
      }
    }
    return buf;
  }
  setTimbre(tb){
    this.timbre=tb;
    if(!this.ctx)return;
    const now=this.ctx.currentTime;
    this.filter.frequency.setTargetAtTime(clamp(tb.filterHz,1200,8000),now,0.4);
    this.wet.gain.setTargetAtTime(clamp(tb.reverbWet,0.1,0.55),now,0.4);
    this.deepFilter.frequency.setTargetAtTime(clamp(tb.filterHz*0.38,600,1500),now,0.4);
    this.wet2.gain.setTargetAtTime(clamp(0.15+tb.reverbWet*1.3,0.2,0.6),now,0.4);
    this.trebFilter.frequency.setTargetAtTime(clamp(tb.filterHz*2.1,3000,9000),now,0.4);
    this.wet3.gain.setTargetAtTime(clamp(0.10+tb.reverbWet*1.25,0.2,0.6),now,0.4);
    this.openLP.frequency.setTargetAtTime(clamp(tb.filterHz*1.45,2600,7200),now,.4);
    this.openWet.gain.setTargetAtTime(clamp(.22+tb.reverbWet,0.38,.68),now,.4);
  }
  setVolumeDb(db){
    if(!this.ctx)return;
    const g=db<=-12?0:Math.pow(10,db/20);
    this.master.gain.setTargetAtTime(g,this.ctx.currentTime,0.05);
  }
  /* KONTRAST NEFESLİLER — pikolo · pizikato · akustik bas: her lane
     kendi bankasından çalar; aralık dışı notalar oktav kaydırmayla
     aynı örnekten gelir (enstrüman kimliği korunur). */
  laneSample(lane,midi){
    const map={pikolo:[this.pikoloBank,36,83],pikoLow:[this.pikoloBank,36,83],pizikato:[this.pizBank,36,83],abass:[this.bassBank,21,108]};
    const t=map[lane];
    if(t&&t[0]){
      let m=midi,k=0;
      while(m<t[1]){m+=12;k--;}
      while(m>t[2]){m-=12;k++;}
      const sm=t[0].nearest(m,3);
      if(sm){const rate=(sm.rate||1)*Math.pow(2,k);return{buf:sm.buf,comp:sm.comp,rate};}
    }
    return null;
  }
  /* ARP (harp) — orjinal enstrüman: 48 gerçek tel (C2–B5). Dışındaki
     notalar oktav kaydırmayla AYNI telden çalar (arp timbresi korunur). */
  arpGet(midi){
    const b=this.arpBank;
    if(!b)return null;
    let m=midi,k=0;
    while(m<36){m+=12;k--;}
    while(m>83){m-=12;k++;}
    const s=b.nearest(m,3);
    if(!s)return null;
    return{buf:s.buf,comp:s.comp,rate:(s.rate||1)*Math.pow(2,k)};
  }
  /* Çalım düzeni: önce LANE'İN KENDİ ENSTRÜMANI → ARP TELİ → piyano
     örneği → (yalnız ana seslerde) sentez yedeği. ATMOSFER (derin/üçüncü),
     SU HALKASI ve KONTRAST NEFESLİLERİ asla osilatör çalmaz — gerçek
     örnek yoksa sessizce söner. */
  voiceBudget(lane,vel){
    const caps={open:16,pikolo:12,pikoLow:12,third:10,deep:10,bass:10,tiz:14,arp:8,pizikato:8,abass:6,ring:8};
    const cap=caps[lane]||12,all=[...this.active],same=all.filter(r=>r.lane===lane);
    if(same.length<cap&&all.length<64)return true;
    const floor={open:.052,pikolo:.074,pikoLow:.050,third:.050,deep:.044,ring:.010}[lane]||.04;
    if(vel<floor)return false; /* doygunlukta yalnız duyulmayacak arka granülü atla */
    /* En eski/düşük öncelikli arka sesi 35 ms'de söndür; yeni motif
       çıpasını atlamak yerine kontrollü voice stealing kullanılır. */
    const pool=same.length>=cap?same:all.filter(r=>!['pikolo','tiz'].includes(r.lane));
    const victim=pool.sort((a,b)=>(a.priority||0)-(b.priority||0)||(a.stopAt||0)-(b.stopAt||0))[0];
    if(!victim)return vel>.09;
    const now=this.ctx.currentTime;
    try{victim.g.gain.cancelScheduledValues(now);victim.g.gain.setTargetAtTime(.0001,now,.012);
      victim.oscs.forEach(o=>{try{o.stop(now+.05);}catch(e){}});}catch(e){}
    this.active.delete(victim);return true;
  }
  playNote(t,midi,vel,durSec,pan,lane,relOverride){
    const c=this.ctx;if(!c||!this.voiceBudget(lane,vel))return;
    const own=this.laneSample(lane,midi);
    if(own){this.playSample(t,midi,vel,durSec,pan,lane,own,relOverride,own.rate||1);this.breathNotes++;return;}
    const a=this.arpGet(midi);
    if(a){this.playSample(t,midi,vel,durSec,pan,lane,a,relOverride,a.rate||1);this.arpNotes++;}
    else{
      const s=this.bank?this.bank.nearest(midi,3):null;
      if(s){this.playSample(t,midi,vel,durSec,pan,lane,s,relOverride,s.rate||1);this.sampleNotes++;}
      else if(lane!=='deep'&&lane!=='third'&&lane!=='ring'&&
              lane!=='pikolo'&&lane!=='pikoLow'&&lane!=='pizikato'&&lane!=='abass'){
        this.playSynth(t,midi,vel,durSec,pan,lane,relOverride);this.synthNotes++;
      }
    }
  }
  /* ---- GERÇEK PİYANO MP3 çalımı ---- */
  playSample(t,midi,vel,durSec,pan,lane,s,relOverride,rateMul){
    const c=this.ctx;
    const tb=this.timbre||{detuneCents:0,deepDetune:0,trebDetune:0,stretchCents:.4,release:3.4,filterHz:2800};
    const deep=lane==='deep',third=lane==='third',open=lane==='open',piko=lane==='pikolo',pikoLow=lane==='pikoLow';
    const atmospheric=open||piko||pikoLow;
    const src=c.createBufferSource();src.buffer=s.buf;
    const ownCents=deep?(tb.deepDetune||0):third?(tb.trebDetune||0):(tb.detuneCents||0);
    const cents=ownCents+(tb.stretchCents||0)*(midi-60)/12;
    src.playbackRate.value=Math.pow(2,clamp(cents,-25,25)/1200)*(rateMul||1);
    const g=c.createGain(),human=.96+Math.random()*.08;
    const atk=deep ? .018+(1-vel)*.034 : third ? .008+(1-vel)*.022 :
      pikoLow ? .034+(1-vel)*.05 : open ? .022+(1-vel)*.04 : piko ? .012+(1-vel)*.025 : .005+(1-vel)*.014;
    const peak=clamp(vel*3.05*s.comp*human,.012,1.08);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(peak,t+atk);
    g.gain.setTargetAtTime(peak*(atmospheric ? .88 : deep ? .85 : .78),t+atk,atmospheric ? .44 : .30);
    const off=t+Math.max(durSec,atk+.12),relBase=relOverride||(tb.release||3.4);
    const relMul=pikoLow?1.65:open?1.38:piko?1.26:deep?1.3:third?1.45:1;
    g.gain.setTargetAtTime(.0001,off,relBase*relMul/3.2);
    const flt=c.createBiquadFilter();flt.type='lowpass';flt.Q.value=.18;
    flt.frequency.value=deep?clamp(520+vel*2600,450,2600):third?clamp(1800+vel*8500,1200,9500):
      pikoLow?clamp(620+vel*4100,520,4300):open?clamp(900+vel*6800,780,6500):
      piko?clamp(2100+vel*7600,1700,9000):clamp((750+vel*11000)*(tb.filterHz?tb.filterHz/2800:1),650,11000);
    src.connect(flt);flt.connect(g);let out=g;
    try{const p=c.createStereoPanner();p.pan.value=clamp(pan,-1,1);g.connect(p);out=p;}catch(e){}
    out.connect(deep?this.bus2:third?this.bus3:atmospheric?this.openBus:this.bus);
    const rel=relBase*relMul,stopAt=Math.min(off+rel+.25,t+s.buf.duration+.05);
    src.start(t);src.stop(stopAt);
    const ref={g,oscs:[src],stopAt,lane,priority:vel};this.active.add(ref);
    src.onended=()=>{this.active.delete(ref);try{g.disconnect();flt.disconnect();out.disconnect();}catch(e){}};
  }
  /* ---- SENTEZ YEDEĞİ (örnek yüklenemezse) ---- */
  playSynth(t,midi,vel,durSec,pan,lane,relOverride){
    const c=this.ctx;if(!c)return;
    const tb=this.timbre||{detuneCents:0,stretchCents:0.4,partial2:0.32,partial3:0.09,release:3.4,attack:0.01,panSpread:0.25};
    const cents=tb.detuneCents+tb.stretchCents*(midi-60)/12;
    const f=mtof(midi)*Math.pow(2,cents/1200);
    const end=t+durSec;
    const g=c.createGain();
    const flt=c.createBiquadFilter();
    flt.type='lowpass';flt.Q.value=0.15;
    flt.frequency.value=clamp(f*(4.5+vel*10),600,(tb.filterHz||2800)*1.7);
    const atk=tb.attack+(1-vel)*0.02;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vel,t+atk);
    g.gain.setTargetAtTime(vel*0.55,t+atk,0.32);
    const relS=relOverride||tb.release;
    g.gain.setTargetAtTime(0.0001,end,relS/3.2);
    const stopAt=end+relS+0.25;
    const oscs=[];
    const mk=(type,freq,gain,det)=>{
      const o=c.createOscillator();o.type=type;o.frequency.value=freq;
      if(det)o.detune.value=det;
      const og=c.createGain();og.gain.value=gain;
      o.connect(og);og.connect(flt);
      o.start(t);o.stop(stopAt);
      oscs.push(o);
      return o;
    };
    mk('triangle',f,1.0);
    mk('sine',f*2.0007,tb.partial2*(0.4+vel*0.6));
    mk('sine',f*3.003,tb.partial3*(0.4+vel*0.6));
    if(lane==='bass'||lane==='final')mk('sine',f*0.5,0.20);
    flt.connect(g);
    let out=g;
    try{
      const p=c.createStereoPanner();
      p.pan.value=clamp(pan,-1,1);
      g.connect(p);out=p;
    }catch(e){}
    out.connect(lane==='deep'?this.bus2:lane==='third'?this.bus3:(lane==='open'||lane==='pikolo'||lane==='pikoLow')?this.openBus:this.bus);
    const ref={g,oscs,stopAt,lane,priority:vel};
    this.active.add(ref);
    oscs[0].onended=()=>{this.active.delete(ref);try{g.disconnect();flt.disconnect();out.disconnect();}catch(e){}};
  }
  /* ---- SU HALKASI ÇALIMI — koyulaşan, uzayan, uzakta sönen yankı ----
     Her halka bir öncekinden daha karanlık filtreyle (mesafe hissi),
     daha yumuşak atakla ve daha uzun kuyrukla çalar; pan halka çapıyla
     dışa açılır. Örnek varsa gerçek piyano, yoksa sentez. */
  playRing(t,midi,vel,durSec,pan,ring,relOverride,fogAmount){
    /* Gerçek tel damlası → geometrik gain kaybı → koyulaşan uzak dalga.
       Ayrı fog-send büyürken doğrudan enerji azalır; %24 feedback ağı
       yalnız atmosferi taşır ve matematiksel olarak kararlıdır. */
    const c=this.ctx;if(!c||!this.voiceBudget('ring',vel))return;
    const lane='ring';
    const r=clamp(ring===undefined?1:ring,0,6),fog=clamp(fogAmount==null?r/6:fogAmount,0,1);
    const s=this.arpGet(midi)||(this.bank?this.bank.nearest(midi,3):null);if(!s)return;
    const tb=this.timbre||{detuneCents:0,stretchCents:.4};
    const dark=Math.exp(-.34*r),rel=(relOverride||5)*(1+.10*r);
    const g=c.createGain(),flt=c.createBiquadFilter();flt.type='lowpass';flt.Q.value=.10;
    flt.frequency.value=clamp(480+4300*dark+vel*1800,430,5600);
    const src=c.createBufferSource();src.buffer=s.buf;
    src.playbackRate.value=Math.pow(2,clamp((tb.stretchCents||.4)*(midi-60)/12,-25,25)/1200)*(s.rate||1);
    const peak=clamp(vel*3.05*s.comp,.0015,.48),atk=r===0?.007:.035+.038*r;
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(peak,t+atk);
    g.gain.setTargetAtTime(peak*(.68-.22*fog),t+atk,.45+.35*fog);
    g.gain.setTargetAtTime(.0001,t+Math.max(durSec,atk+.15),rel/3);
    const stopAt=Math.min(t+durSec+rel+.4,t+s.buf.duration+.05);
    src.connect(flt);src.start(t);src.stop(stopAt);this.arpNotes++;
    flt.connect(g);let out=g;
    try{const p=c.createStereoPanner();p.pan.value=clamp(pan,-1,1);g.connect(p);out=p;}catch(e){}
    out.connect(this.ringBus||this.bus);
    let fogSend=null;
    if(this.fogInput&&fog>0){fogSend=c.createGain();fogSend.gain.value=.08+.64*fog;out.connect(fogSend);fogSend.connect(this.fogInput);}
    const ref={g,oscs:[src],stopAt,lane:'ring',priority:vel};this.active.add(ref);
    src.onended=()=>{this.active.delete(ref);try{g.disconnect();flt.disconnect();out.disconnect();if(fogSend)fogSend.disconnect();}catch(e){}};
  }

  stopAll(fadeSec){
    const c=this.ctx;if(!c)return;
    const now=c.currentTime,fs=fadeSec||0.6;
    this.active.forEach(ref=>{
      try{
        ref.g.gain.cancelScheduledValues(now);
        ref.g.gain.setTargetAtTime(0.0001,now,fs/4);
        ref.oscs.forEach(o=>{try{o.stop(now+fs);}catch(e){}});
      }catch(e){}
    });
  }
}

/* =====================================================================
   9. TAŞIYICI (Transport) — bakımlı ileri-bakış çalıcısı
   ===================================================================== */
class Transport{
  constructor(piano){
    this.piano=piano;this.plan=null;this.timer=null;this.ptr=0;
    this.bpm=72;this.t0=0;this.playing=false;this.onended=null;
    this.lastReportSlot=-1;
    this.onSchedule=null; /* UI kancası: nota çalınacağı anda klavye flash'i */
    this.onPlan=null;     /* UI kancası: nota akışı — olay çalınmadan ruloya düşer */
    this.flowPtr=0;       /* akış işaretçisi: ses ufkundan geniş ön-bakış */
    this.gen=0;           /* nesil sayacı: durdurunca eski flash'ler iptal */
  }
  slotDur(){return 60/(this.bpm*4);}
  evTime(ev){return this.t0+ev.slot*this.slotDur()+ev.hum;}
  start(plan,bpm){
    this.plan=plan;this.bpm=bpm;this.ptr=0;this.flowPtr=0;
    this.t0=this.piano.ctx.currentTime+0.35;
    this.playing=true;this.gen++;
    this.timer=setInterval(()=>this.tick(),140);
    this.tick();
  }
  tick(){
    if(!this.playing)return;
    const c=this.piano.ctx,now=c.currentTime,horizon=now+1.8;
    const evs=this.plan.events;
    while(this.ptr<evs.length&&this.evTime(evs[this.ptr])<horizon){
      const ev=evs[this.ptr++];
      const sd=this.slotDur();
      const when=Math.max(this.evTime(ev),now+0.02);
      if(ev.lane==='ring'){ /* SU DAMLASI/DALGASI: koyu, uzakta sönen yankı */
        this.piano.playRing(when,ev.midi,ev.vel,ev.dur*sd*0.92,
          ev.pan!==undefined?ev.pan:0,ev.ring,ev.release,ev.fog);
      }else{
        this.piano.playNote(when,ev.midi,ev.vel,
          ev.dur*sd*0.92,ev.pan!==undefined?ev.pan:this.panFor(ev),ev.lane,ev.release);
      }
      if(this.onSchedule){ /* nota tam çalacağı anda klavyeyi yak */
        const dt=when-now,g=this.gen;
        if(dt>0)setTimeout(()=>{if(g===this.gen)this.onSchedule(ev);},dt*1000);
        else this.onSchedule(ev);
      }
    }
    if(this.onPlan){ /* NOTA AKIŞI: piyano rulosu ses ufkundan önce beslenir */
      const vh=now+this.slotDur()*15;
      while(this.flowPtr<evs.length&&this.evTime(evs[this.flowPtr])<vh)
        this.onPlan(evs[this.flowPtr++]);
    }
    const endT=this.t0+this.plan.totalSlots*this.slotDur();
    if(this.ptr>=evs.length&&now>endT){
      clearInterval(this.timer);this.playing=false;
      if(this.onended)this.onended();
    }
  }
  panFor(ev){
    const tb=this.piano.timbre;const sp=tb?tb.panSpread:0.25;
    if(ev.lane==='pikolo')return sp*1.35; /* ana pikolo sağ-önde dalgalanır */
    if(ev.lane==='pikoLow')return -sp*.92; /* alt gölge sol-derinde tamamlar */
    if(ev.lane==='open')return clamp((ev.midi-64)/28*sp*1.8,-.72,.72);
    if(ev.lane==='pizikato')return -sp*1.1; /* pizikato sol-altta tıkır */
    if(ev.lane==='abass')return -sp*0.45;  /* kalp bası sol-merkez atar */
    if(ev.lane==='deep')return -sp*1.35; /* 2. piyano sol-arkada durur */
    if(ev.lane==='third')return sp*1.35;  /* 3. piyano sağ-arkada parlar */
    if(ev.hand==='L')return -sp;if(ev.hand==='R')return sp;
    return (ev.lane==='arp'?sp*1.4:0);
  }
  setBpm(b){
    if(!this.piano.ctx||!this.t0){this.bpm=b;return;}
    const now=this.piano.ctx.currentTime;
    const curSlot=(now-this.t0)/this.slotDur();
    this.bpm=b;
    this.t0=now-curSlot*this.slotDur();
  }
  curSlot(){
    if(!this.piano.ctx||!this.playing)return 0;
    return (this.piano.ctx.currentTime-this.t0)/this.slotDur();
  }
  stop(){
    this.playing=false;this.gen++;
    if(this.timer){clearInterval(this.timer);this.timer=null;}
    this.piano.stopAll(0.7);
  }
}

/* ---------- OPTİMİZE SES BANKASI (orijinal yükleme dizisi) ---------- */
async function ensureSamples(){
  if(state.samplesReady)return true;
  if(state.loadingSamples)return false;
  state.loadingSamples=true;
  ui.btnMain.disabled=true;
  if(!piano.arpBank)piano.arpBank=new SampleBank(piano.ctx,ARP_BASES);
  if(!piano.bank)piano.bank=new SampleBank(piano.ctx);
  if(!piano.pikoloBank)piano.pikoloBank=new SampleBank(piano.ctx,PIKOLO_BASES);
  if(!piano.pizBank)piano.pizBank=new SampleBank(piano.ctx,PIZ_BASES);
  if(!piano.bassBank)piano.bassBank=new SampleBank(piano.ctx,ABASS_BASES);
  /* 307 tam örnek yerine ±1–2 yarım ses transpoze edilen 78 çekirdek örnek */
  const spanCount=(lo,hi,st)=>Math.floor((hi-lo)/st)+1+(((hi-lo)%st)?1:0);
  const TOT=spanCount(36,83,4)+spanCount(21,96,4)+spanCount(36,83,4)+
    spanCount(36,83,4)+spanCount(21,108,5);let done=0;
  const label=t=>{ui.btnMain.querySelector('span').textContent=t;};
  const okA=await piano.arpBank.preload(36,83,4,(d,t)=>{
    label('♪ %'+Math.round(100*(done+d)/TOT));},u=>fetch(u),4);
  done+=okA;
  const okP=await piano.bank.preload(21,96,4,(d,t)=>{
    label('♪ %'+Math.round(100*(done+d)/TOT));},u=>fetch(u),4);
  done+=okP;
  const okKi=await piano.pikoloBank.preload(36,83,4,(d,t)=>{
    label('♪ %'+Math.round(100*(done+d)/TOT));},u=>fetch(u),4);
  done+=okKi;
  const okZ=await piano.pizBank.preload(36,83,4,(d,t)=>{
    label('♪ %'+Math.round(100*(done+d)/TOT));},u=>fetch(u),4);
  done+=okZ;
  const okB=await piano.bassBank.preload(21,108,4,(d,t)=>{
    label('♪ %'+Math.round(100*(done+d)/TOT));},u=>fetch(u),5);
  done+=okB;
  state.samplesReady=true;state.loadingSamples=false;
  ui.btnMain.disabled=false;
  return true;
}

/* ---------- TEK HAFİF ZAMANLAYICI — 200 ms · yalnızca çalarken iş yapar ---------- */
function uiTick(){
  if(!transport.playing||!transport.plan)return;
  updateScore();
  const plan=transport.plan,cs=transport.curSlot();
  while(state.barPtr<plan.bars.length-1&&cs>=plan.bars[state.barPtr+1].slotStart)state.barPtr++;
  const bar=plan.bars[state.barPtr];if(!bar)return;
  if(ui.heroChord.textContent!==bar.chordLabel)ui.heroChord.textContent=bar.chordLabel;
  const keyLine=bar.key+' · '+plan.mode+' · '+ROLE_LABEL[bar.role];
  if(ui.heroKey.textContent!==keyLine)ui.heroKey.textContent=keyLine;
  /* BÖLÜM TEMPOSU — sonat geleneği: coda yavaşlar, klimaks hızlanır (orijinal) */
  if(bar.phaseIndex!==state.lastPhaseIdx){
    state.lastPhaseIdx=bar.phaseIndex;
    transport.setBpm(plan.performanceBpm*(bar.tempoMul||1));
  }
  ui.prog.style.width=(clamp(cs/plan.totalSlots,0,1)*100).toFixed(1)+'%';
}
setInterval(uiTick,200);

/* ---------- KOMPOZİSYON AKIŞI (orijinal döngü — günlük/kayıt çağrıları ayıklandı) ---------- */
function setStatus(txt,playing){
  ui.status.textContent=txt;
  ui.statusBox.classList.toggle('play',!!playing);
}
function setPlayBtn(playing){
  ui.btnMain.classList.toggle('on',playing);
  ui.btnMain.querySelector('span').textContent=playing?'DURDUR':'BAŞLAT';
}
function startComposition(){
  const plan=state.composer.newComposition(state.requestedBpm,Date.now()&0xffff);
  const bpm=plan.performanceBpm;
  state.requestedBpm=bpm; /* orijinal davranış: sonsuz modda sonraki eser son tempoyu ister */
  piano.setTimbre(plan.timbre);
  transport.onended=()=>{
    store.save();
    const wait=1800+Math.random()*2200; /* sonsuz mod: eserler arası nefes */
    state.timeout=setTimeout(()=>{if(state.started)startComposition();},wait);
  };
  transport.start(plan,bpm);
  state.barPtr=0;state.lastPhaseIdx=-1;
  ui.heroKey.textContent=plan.root+' · '+plan.mode+' · '+plan.form;
  ui.heroSub.textContent='♪ '+bpm.toFixed(1)+' BPM · '+plan.bars.length+' ölçü · 2:00 form · imza '+plan.signature;
  setStatus('ÇALIYOR',true);
}
function stopAll(){
  state.started=false;
  if(state.timeout){clearTimeout(state.timeout);state.timeout=null;}
  transport.stop();
  setPlayBtn(false);
  ui.btnNew.disabled=true;
  setStatus('DURDU',false);
  ui.heroChord.textContent='—';
  ui.heroKey.textContent='DURDU';
  ui.heroSub.textContent='▶ BAŞLAT ile konseri yeniden başlatın';
  ui.prog.style.width='0%';
}

/* ---------- düğmeler ---------- */
ui.btnMain.addEventListener('click',async()=>{
  if(!state.started){
    if(!piano.ensure()){setStatus('SES MOTORU YOK',false);return;}
    if(piano.ctx.state==='suspended'){try{await piano.ctx.resume();}catch(e){}}
    piano.setVolumeDb(parseInt(ui.rngVol.value,10));
    if(!state.samplesReady){
      setStatus('ÖRNEKLER YÜKLENİYOR',false);
      ui.btnMain.querySelector('span').textContent='♪ YÜKLENİYOR';
      await ensureSamples();
    }
    state.started=true;
    setPlayBtn(true);
    ui.btnNew.disabled=false;
    startComposition();
  }else{
    stopAll();
  }
});
ui.btnNew.addEventListener('click',()=>{
  if(!state.started)return;
  if(state.timeout){clearTimeout(state.timeout);state.timeout=null;}
  transport.stop();
  startComposition();
});
ui.rngVol.addEventListener('input',()=>{
  piano.setVolumeDb(parseInt(ui.rngVol.value,10));
});
if(typeof window!=='undefined'&&window.addEventListener)
  window.addEventListener('beforeunload',()=>{transport.stop();store.save();});
})();
