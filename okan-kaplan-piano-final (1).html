OKAN KAPLAN / FINAL MINIMAL PIANO / CHECKED LEDGER / 11
INTRO 0–20 / VERSE1 20–60 / CHOIR1 60–90 / VERSE2 90–130 / CHOIR2 130–160 / OUTRO 160–180.
Composition: 180 seconds. Intermission: 180–185 seconds, NO NEW GENERATED ATTACKS.
Natural sample/reverb tails may remain audible during the five-second breath; no global fade or forced cut.
Next composition starts at 185 seconds. Verse 2 develops the theme in repeating two-bar sequences.
Choir 2 reprises Choir 1 with a slightly fuller dynamic contour.
Consecutive equal pitches of each voice are tied into ONE attack and combined duration.
Rests and intervening pitches break ties. Continuations have timed semantic counters, not extra attacks.
Long real samples decay naturally; no sample looping or second hammer strike is added.
One eight-bar question/answer melody is harmonized BEFORE either hand is rendered.
Both hands share a quarter-beat lattice and the same phrase envelope and harmonic plan.
No autonomous right-hand background arpeggio or delayed canon.
Composition tempo targets: 50,56,62,68,74,80 BPM; successive targets differ by at least 12 BPM.
Harmony and rhythm plans balance stored usage among functionally compatible alternatives.
No six-second silent slot. No phase/composition master fades. No echo/reverb duck at boundaries.
One independent sampled voice and envelope per attack; real sample tails overlap.
An entire verified 180-second score and one score ahead are queued on the AudioWorklet audio thread.
Rendering is not driven by requestAnimationFrame, Tone.Draw or per-note main-thread timers.
Only sounding notes are processed; future notes do not allocate thousands of active audio nodes.
Actual counters are acknowledged at quantized native attack frames, with idempotent IDs.
Every reader batch is validated and written to an atomic synchronous local journal, then strict IndexedDB.
Monotonic revisions reconcile an interrupted IDB commit with the journal on restart.
Measured musical durations use integer microseconds and exclude unplayed future notes.
A hardware crash between a rendered frame and its main-thread acknowledgement cannot be recovered exactly.
The opening chord is random among consonant, least-used compatible roots.
Counted left/right/motif/voicing/rhythm/harmony patterns actually affect the performed score.
Actual counters are acknowledged by the audio clock; a separate predictive copy plans the next score.
One-hand rests are interleaved; continuity, MIDI range, tone, polyphony and finite event times are checked.
Complete score fingerprints remain in IndexedDB. This is a local-history repeat check, not a global
or infinite uniqueness guarantee. Counter and audio checks cannot guarantee subjective artistic quality
or perfect playback under every operating-system/hardware failure.
Backgrounding does not deliberately stop the score. If the OS suspends audio, tap to resume its clock.
Click name / space: start or deliberate stop. Arrows: volume. C / name context menu: counter and audit panel.
Library: Salamander Grand Piano / Alexander Holm / CC BY 3.0.
https://github.com/Tonejs/audio/tree/master/salamander
https://creativecommons.org/licenses/by/3.0/
Tone.js and long sampled notes require internet. Run in a regular browser or on HTTPS.

 if(now-runtime.lastMeter>.25){runtime.lastMeter=now;control('monitorSamples');if(graph){const rms=graph.meter.getValue(),samples=graph.waveform.getValue();let peak=0;for(const v of samples)peak=Math.max(peak,Math.abs(v));runtime.rmsDb=Number.isFinite(rms)?rms:-120;const db=peak>0?20*Math.log10(peak):-120;runtime.peakDb=Math.max(runtime.peakDb,db);if(peak>.999)control('peakWarnings');}if(runtime.activeVoices>128)control('polyphonyWarnings');if(runtime.activeVoices>=3&&runtime.rmsDb<-95&&!pieces.some(p=>now>=audioOrigin+p.start+C.DURATION&&now<audioOrigin+p.start+C.CYCLE_DURATION)&&now>audioOrigin+2&&!pausedBySystem){if(runtime.silentSince===null)runtime.silentSince=now;else if(now-runtime.silentSince>2){control('silentOutputWarnings');stop('Nota planı var ama ses çıkışı ölçülemiyor. Ses motorunu yeniden başlatın.',true);return;}}else runtime.silentSince=null;}
 const position=now-audioOrigin;for(const piece of pieces)if(piece.started&&C.advanceTime(memory,piece,position-piece.start))saveSoon();
 if(dirtyLedger)save();
 if(position>=runtime.scheduledThrough&&runtime.activeVoices===0){control('naturalStops');finishNatural();return;}
 pieces=pieces.filter(piece=>piece.start+188>position);
}
function tick(){if(!running)return;paintKeys(Tone.immediate());raf=requestAnimationFrame(tick);}
async function start(){
 if(running||loading)return;
 if(typeof Tone==='undefined'){state('Tone.js yüklenemedi. İnternet bağlantısıyla normal tarayıcıda açın.','error');alert(signature.title);return;}
 const token=++session;loading=true;draining=false;state('Piyano ve partisyon doğrulanıyor. İptal için tekrar dokunun.','loading');
 try{
  await Tone.start();if(token!==session)return;await cleanupPromise;await pendingPersistence;if(token!==session)return;
  const release=await acquirePlaybackLock();if(token!==session){release();return;}unlockPlayback=release;
  if(!await preparePersistence(token))return;
  const library=await loadSampleLibrary();if(token!==session)return;
  const bus=makeGraph();await bus.reverb.ready;if(token!==session)return;
  const engine=await WorkletVoiceRenderer.create(library,bus.comp,control,error=>{if(token===session)stop(error.message,true);});if(token!==session){engine.dispose();return;}renderer=engine;
  const piece=await reserveValidated(memory,token);if(!piece||token!==session)return;
  const plan=renderer.prepare(piece),lead=Math.max(1,piece.events.length*.0008);
  audioOrigin=Tone.immediate()+lead;pieces=[];ackQueue=[];ackIndex=0;preparing.clear();activePiece=null;activePhase='';runtime.scheduledThrough=0;runtime.lastError='';runtime.audit=[];runtime.lastMeter=0;runtime.silentSince=null;runtime.peakDb=-120;runtime.maxAckLag=0;runtime.maxVoices=0;runtime.predictedPeak=0;runtime.maxScoreGap=0;
  running=true;loading=false;install(piece,plan,0,token);clockId=setInterval(processClock,60);raf=requestAnimationFrame(tick);
  state('Kesintisiz çalıyor. Durdur: dokun / boşluk. Ses: ↑ / ↓. Denetim: C veya adın üzerinde uzun bas.','playing');
  void prepareAfter(piece,token);
  const raw=Tone.getContext().rawContext;
  contextListener=()=>{if(!running)return;if(raw.state==='suspended'||raw.state==='interrupted'){if(!pausedBySystem)control('contextSuspensions');pausedBySystem=true;state('Cihaz sesi askıya aldı. Kaldığı yerden sürdürmek için dokunun.','loading');}else if(raw.state==='running'){pausedBySystem=false;if(!draining)state('Kesintisiz çalıyor. Durdur: dokun / boşluk. Denetim: C.','playing');processClock();}else if(raw.state==='closed')stop('Ses sistemi kapandı.',true);};
  raw.addEventListener('statechange',contextListener);
 }catch(error){if(token===session){control('scheduleFailures');stop(error.message,true);}}
}
function releaseLock(){const release=unlockPlayback;unlockPlayback=null;if(release)cleanupPromise=Promise.resolve(cleanupPromise).then(()=>save()).finally(release);}
function finishNatural(){
 if(!running)return;running=false;session++;if(contextListener){Tone.getContext().rawContext.removeEventListener('statechange',contextListener);contextListener=null;}clearInterval(clockId);clockId=0;cancelAnimationFrame(raf);save();releaseLock();
 const oldRenderer=renderer,oldGraph=graph;renderer=null;graph=null;oldRenderer?.dispose();if(oldGraph)for(const node of Object.values(oldGraph))try{node.dispose();}catch(_){}
 clearKeys();state(runtime.lastError||'Eser doğal sonuna ulaştı. Başlatmak için dokunun.',runtime.lastError?'error':'idle');
}
function stop(message='',error=false){
 if(running&&!error)processClock();const hadAudio=running;running=false;loading=false;session++;clearInterval(clockId);clockId=0;cancelAnimationFrame(raf);
 if(typeof Tone!=='undefined'&&contextListener){Tone.getContext().rawContext.removeEventListener('statechange',contextListener);contextListener=null;}
 const oldRenderer=renderer,oldGraph=graph;renderer=null;graph=null;oldRenderer?.cancelFuture();
 const cleanup=()=>{oldRenderer?.dispose();if(oldGraph)for(const node of Object.values(oldGraph))try{node.dispose();}catch(_){}};
 if(hadAudio&&oldGraph&&!error){
  // The ONLY automatic master ramp in this app is a deliberate USER stop.
  oldGraph.master.volume.rampTo(-90,1.15);cleanupPromise=new Promise(resolve=>setTimeout(()=>{cleanup();resolve();},1350));control('userStops');
 }else{cleanup();cleanupPromise=Promise.resolve();}
 ackQueue=[];ackIndex=0;pieces=[];preparing.clear();activePhase='';delete document.body.dataset.phase;delete signature.dataset.phase;pausedBySystem=false;clearKeys();save();releaseLock();
 state(error?message:'Başlat: dokun / boşluk. Denetim ve sayaçlar: C veya uzun bas.',error?'error':'idle');if(error)alert(message);
}
async function toggle(){if(running&&pausedBySystem){try{await Tone.start();control('nativeResumes');pausedBySystem=false;processClock();state('Kaldığı yerden devam ediyor.','playing');}catch(error){logControl(error.message);}return;}if(running||loading)stop();else await start();}
function manualDown(event,midi){event.preventDefault();if(!renderer?.loaded||!running){if(!loading)void start();return;}try{event.currentTarget.setPointerCapture(event.pointerId);}catch(_){}manualUp(event.pointerId);if(renderer.activeCount()>128){control('polyphonyWarnings');return;}const voice=renderer.manualAttack(midi,.45);control('manualAttacks');touches.set(event.pointerId,{midi,voice});keyOn(midi,'right',Infinity,event.pointerId);paintKeys(Tone.immediate());}
function manualUp(id){const touch=touches.get(id);if(!touch)return;touches.delete(id);control('manualReleases');renderer?.manualRelease(touch.voice);const voices=visuals.get(touch.midi)||[];visuals.set(touch.midi,voices.filter(v=>v.manual!==id));if(typeof Tone!=='undefined')paintKeys(Tone.immediate());}
function toggleStats(){const panel=$('counters');panel.hidden=!panel.hidden;if(!panel.hidden)renderCounters();}
function renderCounters(){
 const panel=$('counters');if(!panel||panel.hidden)return;const root=$('counterBody');root.replaceChildren();
 const row=(title,text)=>{const box=document.createElement('section'),h=document.createElement('h2'),p=document.createElement('p');h.textContent=title;p.textContent=text;box.append(h,p);root.append(box);};
 const p=memory.performance;
 row('Kesintisiz ses denetimi','Aktif ses: '+runtime.activeVoices+' / 128 · ölçülen en yüksek: '+runtime.maxVoices+' · planlanan tepe: '+runtime.predictedPeak+' · çıkış RMS: '+runtime.rmsDb.toFixed(1)+' dB · ölçülen örnek tepe: '+runtime.peakDb.toFixed(1)+' dB · en büyük notalar arası mesafe: '+runtime.maxScoreGap.toFixed(3)+' sn');
 row('Sayaç bütünlüğü',(lastAudit.ok?'DENETİM GEÇTİ':'DENETİM HATASI')+' · kayıt sürümü '+memory.revision+' · senkron yerel günlük + IndexedDB. Hazırlanan notalar çalınmış sayılmaz. Ani donanım/tarayıcı kapanmasının henüz işlenmemiş ses olayları ölçülemez.');
 const elapsed=p.elapsed;row('Ölçülen süreler — bu sürümden beri','Müzik: '+(elapsed.musicUs/1000000).toFixed(3)+' sn · dinlenme: '+(elapsed.restUs/1000000).toFixed(3)+' sn · nota süreleri toplamı: '+(elapsed.noteUs/1000000).toFixed(3)+' sn (eşzamanlı notalar ayrı). Yarıda durdurma hesaba katılır; doğal kuyrukların akustik duyulma süresi değildir.');
 row('Beste formu','Intro 0–20 · Verse 1 20–60 · Choir 1 60–90 · Verse 2 90–130 · Choir 2 130–160 · Outro 160–180 · Dinlenme 180–185 sn. Toplam çevrim 185 saniye. Dinlenmede yeni nota üretilmez; son tınılar kesilmez.');
 row('Zamanlama','Tam partisyon ses başlamadan AudioWorklet ses iş parçacığına aktarılır; yalnızca çalan sesler işlenir. Hazır ses ufku: '+Math.max(0,runtime.scheduledThrough-(running?Tone.immediate()-audioOrigin:runtime.scheduledThrough)).toFixed(1)+' sn. Sayaç / ekran işleme gecikmesi ses gecikmesi değildir.');
 row('Bağlı uzun notalar',(activePiece?.tieReport?.tiedGroups||0)+' bağ grubu · '+(activePiece?.tieReport?.removedAttacks||0)+' gereksiz tekrar vuruşu kaldırıldı. Aynı sesin devamı nota sayacını artırmaz; devam işaretleri kendi zamanı gelince sayılır.');
 row('Çalınan olaylar',memory.serial+' başlayan eser · '+p.attacks+' nota · '+p.chordChanges+' armonik ölçü · '+p.restEvents+' tek-el sus');
 row('Birebir tekrar hafızası',(historyStore?.total||0)+' ayrılmış partisyon. Planlar ana sayaçları artırmaz. Sonraki eser, mevcut eserin tamamlanması halinde oluşacak özel bir sayaç kopyasından hazırlanır.');
 if(activePiece){const v=activePiece.parameters;row('Şimdiki eser',activePhase+' · '+v.tonicName+' · '+v.mode.name+' · '+v.pentatonic.name+' · '+v.meter.name+' · '+v.bpm+' BPM hedef · açılış: '+v.openingChord+' · ortak el vurguları: %'+Math.round((activePiece.validation.handSynchronization||0)*100)+' · sekiz ölçülük soru–cevap teması');}
 row('Kontrol sayaçları',Object.entries(p.controls).map(([k,n])=>k+': '+n).join(' / '));
 for(const family of Object.keys(C.BANK))row(C.CATS[family],C.BANK[family].map(([name],i)=>name+': '+memory.counts[family][i]).join(' / '));
 const mapRow=(label,map,format=k=>k)=>row(label,Object.entries(map).map(([k,n])=>format(k)+': '+n).join(' / ')||'Henüz kayıt yok.');
 mapRow('Nota sayaçları',p.notes,k=>{const [hand,m]=k.split(':');return (hand==='left'?'Sol ':'Sağ ')+noteName(Number(m));});
 mapRow('Tonik seçimleri',memory.params.counts.tonic,k=>C.TONICS[k]||k);mapRow('Mod seçimleri',memory.params.counts.tonality,k=>C.MODES[k]?.name||k);mapRow('Pentatonik seçimleri',memory.params.pent,k=>C.PENTAS[k]?.name||k);mapRow('Ölçü seçimleri',memory.params.counts.meter,k=>C.METERS[k]?.name||k);mapRow('Tempo seçimleri',memory.params.counts.tempo,k=>C.TEMPOS[k]+' BPM');mapRow('Sus hedefi seçimleri',memory.params.counts.rest,k=>'%'+Math.round(C.REST_RATIOS[k]*100));mapRow('Duygu seçimleri',memory.styles);
 mapRow('Akor sayaçları',p.chords);mapRow('Süre sayaçları',p.durations);mapRow('Tek-el sus süreleri',p.rests,k=>(Number(k)/960)+' vuruş');
 const labels={phases:'Fazlar',directions:'Kontur yönleri',registers:'Ses bölgeleri',articulations:'Artikülasyon',dynamics:'Dinamik bölgeleri',pedals:'Pedal bölgeleri',intervals:'Ses yürüyüşü aralıkları',voicings:'Akor çevrimleri',restHands:'Sus uygulanan el',phraseFunctions:'Müzikal cümleler',themeSections:'Tema ve dönüşler',harmonies:'Cümle armonileri',rhythms:'Tekrarlanan ezgi ritimleri',openingChords:'Başlangıç akorları',harmonicPatterns:'Akor örüntüleri',melodyPatterns:'Ezgi örüntüleri',tiedNotes:'Tek vuruşa bağlanan devam notaları'};
 for(const family of C.EXTRA_FAMILIES)mapRow(labels[family],p.extras[family]);
 row('Denetim günlüğü',runtime.audit.join(' / ')||'Kayıtlı hata yok.');
 row('Kapsam','Altı bölüm arasında otomatik fade-out yoktur. Her 180 saniyelik bestenin ardından 5 saniye yeni notasız dinlenme vardır; doğal tınılar sürebilir. Ekran veya sayaç zamanlayıcısı ses vuruşlarını yönetmez. Tek tek piyano sesleri doğal örnek ve bağımsız damper zarfıyla söner. Mobil işletim sistemi sesi askıya alabilir; dokunarak aynı noktadan sürdürülür. Geçmiş silinirse / cihaz değişirse eski benzersizlik denetimi devam edemez. Yazılım her donanım koşulunda hatasızlık veya insan besteci düzeyi garanti etmez.');
}
let signatureHoldTimer=0;
signature.addEventListener('pointerdown',e=>{if(e.button>0)return;clearTimeout(signatureHoldTimer);signatureHoldTimer=setTimeout(()=>{ignoreSignatureClickUntil=Date.now()+1000;toggleStats();},650);});
for(const name of ['pointerup','pointercancel','pointerleave'])signature.addEventListener(name,()=>clearTimeout(signatureHoldTimer));
signature.addEventListener('click',()=>{if(Date.now()>=ignoreSignatureClickUntil)void toggle();});signature.addEventListener('contextmenu',event=>{event.preventDefault();clearTimeout(signatureHoldTimer);if(Date.now()<ignoreSignatureClickUntil)return;ignoreSignatureClickUntil=Date.now()+700;toggleStats();});$('closeCounters').addEventListener('click',()=>{$('counters').hidden=true;});window.addEventListener('pointerup',e=>manualUp(e.pointerId));
document.addEventListener('keydown',e=>{if(e.altKey||e.metaKey||e.ctrlKey)return;if(e.code==='KeyC'&&!e.repeat){e.preventDefault();toggleStats();return;}if(e.code==='Escape'&&!$('counters').hidden){$('counters').hidden=true;return;}if(e.code==='Space'&&e.target!==signature){e.preventDefault();if(!e.repeat)void toggle();}if(['ArrowUp','ArrowDown'].includes(e.code)){e.preventDefault();volume=Math.max(-24,Math.min(8,volume+(e.code==='ArrowUp'?1:-1)));graph?.master.volume.rampTo(volume,.15);}if(e.code==='Escape')stop();});
document.addEventListener('visibilitychange',()=>{if(running){control('backgroundTransitions');processClock();}});
window.addEventListener('pagehide',()=>{if(running||loading)stop();});
buildKeyboard();save();
