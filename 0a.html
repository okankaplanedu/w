    <script>
const canvas = document.getElementById('sketchCanvas');
const ctx = canvas.getContext('2d');
const drawButton = document.getElementById('draw');
const fongizleButton = document.getElementById('fongizle');
const fongosterButton = document.getElementById('fongoster');
const clearButton = document.getElementById('clear');
const undoButton = document.getElementById('undo');
const playButton = document.getElementById('play');
const pauseButton = document.getElementById('pause');
const replayButton = document.getElementById('replay');
const prevFrameButton = document.getElementById('prevFrame');
const nextFrameButton = document.getElementById('nextFrame');
const fileInput = document.getElementById('fileInput');
const backgroundImage = document.getElementById('backgroundImage');
// Yeni kontrol elemanları
const brushSize = document.getElementById('brushSize');
const brushColor = document.getElementById('brushColor');

        let isPlaying = false; // Track the play/pause state
        let playInterval;
        let currentFrame = 0;
        let canvasHistory = [];
		let currentBrushSize = brushSize.value;
let currentBrushColor = brushColor.value;
let isPaintMode = false;
const paintBucketButton = document.getElementById('paintBucket');
const fillColorPicker = document.getElementById('fillColor');

paintBucketButton.addEventListener('click', () => {
    isPaintMode = !isPaintMode;
    paintBucketButton.textContent = isPaintMode ? 'Kova (Açık)' : 'Boya Kova';

    if (isPaintMode) {
        brushColor.value = fillColorPicker.value;
        currentBrushColor = fillColorPicker.value;
        console.log('Kova açıldı, fırça rengi eşitlendi:', currentBrushColor);
    }
});

// Eğer kova açıksa, fırça rengi otomatik olarak kova rengi ile eşitlenir
fillColorPicker.addEventListener('input', function () {
    if (isPaintMode) {
        brushColor.value = fillColorPicker.value;
        currentBrushColor = fillColorPicker.value;
        console.log('Paint mode aktif: Fırça rengi kova rengine eşitlendi ->', currentBrushColor);
    }
});
function colorsMatch(a, b) {
    return a[0] === b[0] && a[1] === b[1] && a[2] === b[2] && a[3] === b[3];
}

function floodFill(x, y, fillColor) {
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;
    const width = imageData.width;

    const targetOffset = (y * width + x) * 4;
    const targetColor = data.slice(targetOffset, targetOffset + 4);

    const fillR = parseInt(fillColor.slice(1, 3), 16);
    const fillG = parseInt(fillColor.slice(3, 5), 16);
    const fillB = parseInt(fillColor.slice(5, 7), 16);
    const fillA = 201; // Opak

    // Eğer başlangıç renginden farklıysa, dolgu işlemini başlat
    if (targetColor[0] === fillR && targetColor[1] === fillG && targetColor[2] === fillB) {
        return; // Aynı renk olduğu için işlem yapma
    }

    // Yığın (stack) kullanarak komşulara geçiş
    const stack = [[x, y]];

    while (stack.length) {
        const [currX, currY] = stack.pop();
        const currOffset = (currY * width + currX) * 4;

        // Eğer bu pikselin rengi hedef renk ile uyumluysa, doldur
        if (
            data[currOffset] === targetColor[0] &&
            data[currOffset + 1] === targetColor[1] &&
            data[currOffset + 2] === targetColor[2] &&
            data[currOffset + 3] === targetColor[3] // Alpha kanalına dikkat edin
        ) {
            // Dolguyu uygula
            data[currOffset] = fillR;
            data[currOffset + 1] = fillG;
            data[currOffset + 2] = fillB;
            data[currOffset + 3] = fillA;

            // Komşu piksellere geçiş (up, down, left, right)
            if (currX > 0) stack.push([currX - 1, currY]); // Sol
            if (currX < width - 1) stack.push([currX + 1, currY]); // Sağ
            if (currY > 0) stack.push([currX, currY - 1]); // Üst
            if (currY < canvas.height - 1) stack.push([currX, currY + 1]); // Alt
        }
    }

    // Canvas'a yeni verileri yansıt
    ctx.putImageData(imageData, 0, 0);
}



canvas.addEventListener('click', (event) => {
    if (!isPaintMode) return;

    const rect = canvas.getBoundingClientRect();
    const x = Math.floor(event.clientX - rect.left);
    const y = Math.floor(event.clientY - rect.top);
    const fillColor = fillColorPicker.value;

    saveCanvasState(); // Boyamadan önceki durumu kaydet
    floodFill(x, y, fillColor);
});

 function fongizle() {	 backgroundImage.style.display = 'none'; };
function fongoster() {	 backgroundImage.style.display = 'block'; };

        // Function to play the animation
        function playCanvas() {
			 backgroundImage.style.display = 'none'; 
            if (isPlaying) return; // Prevent multiple intervals
            isPlaying = true;
            playButton.disabled = true;  // Disable play button while playing
            pauseButton.disabled = false;  // Enable pause button while playing
            
            playInterval = setInterval(() => {
                if (currentFrame < canvasHistory.length) {
                    const img = new Image();
                    img.onload = function() {
                        ctx.clearRect(0, 0, canvas.width, canvas.height); 
                        ctx.drawImage(img, 0, 0); 
                    };
                    img.src = canvasHistory[currentFrame];
                    currentFrame++;
                } else {
                    clearInterval(playInterval); 
                    isPlaying = false; 
                    playButton.disabled = false;  // Re-enable play button when finished
                    pauseButton.disabled = true;  // Disable pause button when finished
                }
            },20); // 50ms interval for frame rate
        }

        // Function to pause the animation
        function pauseCanvas() {
            clearInterval(playInterval);
            isPlaying = false;
            playButton.disabled = false;  // Re-enable play button
            pauseButton.disabled = true;  // Disable pause button
        }

        // Function to reset and replay the animation
        function replayCanvas() {
            currentFrame = 0; // Reset to the first frame
			     backgroundImage.style.display = 'none'; 
            playCanvas(); // Start playing from the beginning
        }

        // Event listeners for play, pause, and replay buttons
        playButton.addEventListener('click', playCanvas);
        pauseButton.addEventListener('click', pauseCanvas);
        replayButton.addEventListener('click', replayCanvas);
		fongizleButton.addEventListener('click', fongizle);
	fongosterButton.addEventListener('click', fongoster);
        // Draw random sketches
        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }
// Fırça kalınlığı ve rengini kontrol eden event listener'lar
brushSize.addEventListener('input', function() {
    currentBrushSize = brushSize.value;
    console.log('Brush size changed to:', currentBrushSize);
});

brushColor.addEventListener('input', function() {
    currentBrushColor = brushColor.value;
    console.log('Brush color changed to:', currentBrushColor);
});

function drawRandomCluster(startX, startY) {
    let x = startX;
    let y = startY;

    let lineWidth = 5; // Başlangıç kalınlığı
    let speedFactor = 0.01; // Hız faktörü, hız arttıkça incelme oranı

    for (let i = 0; i < 200; i++) {
        const controlX = x + getRandomInt(-50, 50);
        const controlY = y + getRandomInt(-50, 50);
        const endX = controlX + getRandomInt(-30, 30);
        const endY = controlY + getRandomInt(-30, 30);

        // Çizgi kalınlığını hızla çizim yaparken incelt
        lineWidth = Math.max(0.5, lineWidth - speedFactor);  // Minimum çizgi kalınlığına ulaşmasını engelle

        ctx.lineWidth = lineWidth;
        ctx.strokeStyle = currentBrushColor;

        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.quadraticCurveTo(controlX, controlY, endX, endY);
        ctx.stroke();  // Çizim
        ctx.closePath();

        x = endX;
        y = endY;
    }
}


        function drawRandomSketch() {
            for (let i = 0; i < 50; i++) {
                const startX = getRandomInt(0, canvas.width);
                const startY = getRandomInt(0, canvas.height);
                drawRandomCluster(startX, startY);
            }
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawRandomSketch(); 
        }

        function saveCanvasState() {
            canvasHistory.push(canvas.toDataURL());
        }

        function undoLastAction() {
            if (canvasHistory.length > 0) {
                const previousState = canvasHistory.pop();
                const img = new Image();
                img.onload = function() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                };
                img.src = previousState;
            }
        }

        function prevFrame() {
            if (currentFrame > 0) {
                currentFrame--;
                const img = new Image();
                img.onload = function() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                };
                img.src = canvasHistory[currentFrame];
            }
        }

        function nextFrame() {
            if (currentFrame < canvasHistory.length - 1) {
                currentFrame++;
                const img = new Image();
                img.onload = function() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                };
                img.src = canvasHistory[currentFrame];
            }
        }

        // Event listeners for controls
        drawButton.addEventListener('click', drawRandomSketch);
        clearButton.addEventListener('click', clearCanvas);
        undoButton.addEventListener('click', undoLastAction);
        prevFrameButton.addEventListener('click', prevFrame);
        nextFrameButton.addEventListener('click', nextFrame);

        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    backgroundImage.src = e.target.result;
                    backgroundImage.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });
let drawing = false; // Mouse ile çizim yapılabilir hale getiren değişken
let lastX, lastY;

// Mouse ile çizim için
canvas.addEventListener('mousedown', (event) => {
    drawing = true; // Çizim başlat
    const rect = canvas.getBoundingClientRect();
    lastX = event.clientX - rect.left;
    lastY = event.clientY - rect.top;

    // Fırça kalınlığı ve rengini ayarla
   ctx.lineWidth = currentBrushSize;
ctx.strokeStyle = currentBrushColor;
});

canvas.addEventListener('mousemove', (event) => {
    if (drawing) { // Mouse ile çizim yapılıyorsa
        const rect = canvas.getBoundingClientRect();
        const mouseX = event.clientX - rect.left;
        const mouseY = event.clientY - rect.top;

        saveCanvasState(); // Her hareketi kaydet

        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(mouseX, mouseY);
        ctx.stroke();

        lastX = mouseX;
        lastY = mouseY;
    }
});
canvas.addEventListener('mouseup', () => {
    drawing = false; // Çizim bitirildi
});

canvas.addEventListener('mouseleave', () => {
    drawing = false; // Mouse canvas dışına çıktığında çizimi durdur
});

// Touch ile çizim için
canvas.addEventListener('touchstart', (event) => {
    event.preventDefault();
    drawing = true;

    const rect = canvas.getBoundingClientRect();
    lastX = event.touches[0].clientX - rect.left;
    lastY = event.touches[0].clientY - rect.top;

    // Fırça kalınlığı ve rengini ayarla
    ctx.lineWidth = currentBrushSize;
  ctx.strokeStyle = hexToRgba(currentBrushColor, 1);
});

function hexToRgba(hex, alpha) {
    hex = hex.replace('#', '');
    if (hex.length === 3) {
        hex = hex.split('').map(char => char + char).join('');
    }
    const bigint = parseInt(hex, 16);
    const r = (bigint >> 16) & 255;
    const g = (bigint >> 8) & 255;
    const b = bigint & 255;
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}


canvas.addEventListener('touchmove', (event) => {
    event.preventDefault();
    if (drawing) { // Touch ile çizim yapılıyorsa
        const rect = canvas.getBoundingClientRect();
        const touchX = event.touches[0].clientX - rect.left;
        const touchY = event.touches[0].clientY - rect.top;

        saveCanvasState(); // Her hareketi kaydet

        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(touchX, touchY);
        ctx.stroke();

        lastX = touchX;
        lastY = touchY;
    }
});

canvas.addEventListener('touchend', () => {
    drawing = false; // Touch ile çizim bitirildi
});
canvas.addEventListener('touchcancel', () => {
drawing = false; // Touch cancel durumunda çizimi durdur
});
</script>
