 <!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLIDER × CODER PRO — OKAN KAPLAN</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<!-- CodeMirror 5 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">
<style>
/* ======================================================
   ROOT & RESET
====================================================== */
:root {
  --yellow: #FFE600;
  --pink:   #FF6B9D;
  --cyan:   #00D9FF;
  --green:  #00FF88;
  --black:  #000000;
  --white:  #FFFFFF;
  --gray:   #F5F5F5;
  --shadow: 4px 4px 0 #000;
  --shadow-lg: 8px 8px 0 #000;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body, html { width:100%; height:100%; font-family:'Space Grotesk',sans-serif; background:#F1F1F1; overflow:hidden; }

/* ======================================================
   CAROUSEL
====================================================== */
.carousel-container {
  position:relative; width:100%; max-width:1420px; margin:0 auto;
  background:#fff; border:5px solid #000; box-shadow:var(--shadow-lg); overflow:hidden;
}
.slider { display:flex; transition:transform 0.45s cubic-bezier(0.4,0,0.2,1); }
.slide { flex:0 0 100%; box-sizing:border-box; padding:20px; position:relative; overflow:hidden; }
.slide canvas { width:100% !important; display:block; height:700px !important; border:4px solid #000; box-shadow:var(--shadow); }

/* ======================================================
   SLIDER BUTTONS
====================================================== */
.slider-btn {
  position:absolute; top:40%; transform:translateY(-50%);
  z-index:10; width:40px; height:40px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; border:4px solid #000; background:var(--yellow); color:#000;
  box-shadow:5px 5px 0 #000; font-weight:800; font-size:22px; transition:all 0.12s ease;
}
.slider-btn:hover { background:var(--pink); transform:translateY(-50%) translate(2px,2px); box-shadow:3px 3px 0 #000; }
.slider-btn:active { transform:translateY(-50%) translate(4px,4px); box-shadow:none; }
.prev-btn { left:15px; } .next-btn { right:15px; }

/* ======================================================
   RIGHT CONTROLS
====================================================== */
.controls {
  width:68px; display:flex; flex-direction:column; gap:8px;
  position:fixed; top:50%; right:5px; transform:translateY(-50%);
  background:#fff; padding:10px 11px; border:4px solid #000;
  box-shadow:var(--shadow-lg); z-index:999;
}
.controls .ctrl-btn {
  width:34px; height:30px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; border:3px solid #000; background:var(--gray);
  box-shadow:3px 3px 0 #000; transition:all 0.12s ease; font-size:18px; font-weight:700;
}
.controls .ctrl-btn:hover { background:var(--cyan); transform:translate(1px,1px); box-shadow:2px 2px 0 #000; }
.controls .ctrl-btn:active { transform:translate(3px,3px); box-shadow:none; }
.controls .ctrl-btn.active { background:var(--yellow); box-shadow:none; transform:translate(3px,3px); }
.mini-range {
  width:44px; height:8px; -webkit-appearance:none; appearance:none;
  background:var(--gray); border:3px solid #000; outline:none; cursor:pointer; box-shadow:2px 2px 0 #000;
}
.mini-range::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; background:var(--cyan); border:3px solid #000; cursor:pointer; }
.controls input[type="number"] {
  width:44px; height:34px; border:3px solid #000; text-align:center;
  font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:700;
  background:var(--gray); outline:none; box-shadow:2px 2px 0 #000;
}
.color-container { width:44px; height:40px; border:3px solid #000; overflow:hidden; box-shadow:3px 3px 0 #000; }
.color-container input[type="color"] { width:100%; height:100%; border:none; padding:0; cursor:pointer; }

/* ======================================================
   EMBED WRAPPERS
====================================================== */
.embed-wrapper { position:absolute; overflow:hidden; display:none; pointer-events:none; }
.embed-wrapper.active { display:block; pointer-events:auto; }
.embed-wrapper.fullscreen-embed {
  inset:0; width:100% !important; height:100% !important;
  left:0 !important; top:0 !important; z-index:400; border:none;
}
.embed-wrapper iframe, .embed-wrapper video { position:absolute; inset:0; width:100%; height:100%; border:none; }

/* ======================================================
   CODER PANEL
====================================================== */
.coder-panel {
  position:absolute; bottom:-100%; left:20px; right:20px; height:95vh;
  background:#fff; border:4px solid #000; box-shadow:0 -6px 0 #000;
  z-index:800; display:flex; flex-direction:column;
  transition:bottom 0.4s cubic-bezier(0.4,0,0.2,1);
}
.coder-panel.open { bottom:20px; }

/* Topbar */
.coder-topbar {
  display:flex; align-items:center; background:var(--yellow);
  border-bottom:4px solid #000; height:44px; flex-shrink:0;
  overflow-x:auto; overflow-y:hidden; gap:0;
}
.coder-topbar::-webkit-scrollbar { height:0; }
.coder-topbar .c-tabs { display:flex; height:100%; flex-shrink:0; }
.coder-topbar .c-tab {
  padding:0 14px; font-weight:800; font-size:12px; text-transform:uppercase;
  cursor:pointer; border:none; border-right:3px solid #000; background:transparent;
  height:100%; display:flex; align-items:center; transition:background 0.1s;
  font-family:'Space Grotesk',sans-serif; letter-spacing:0.3px; white-space:nowrap;
}
.coder-topbar .c-tab:hover { background:rgba(0,0,0,0.07); }
.coder-topbar .c-tab.active { background:#000; color:#fff; }

/* Font size slider */
.c-fontsize-wrap {
  display:flex; align-items:center; gap:6px;
  padding:0 10px; border-right:3px solid #000; height:100%;
  white-space:nowrap; flex-shrink:0;
}
.c-fontsize-wrap label { font-size:10px; font-weight:800; text-transform:uppercase; color:#000; }
.c-fontsize-slider {
  width:70px; height:6px; -webkit-appearance:none; appearance:none;
  background:#000; border:2px solid #000; outline:none; cursor:pointer;
}
.c-fontsize-slider::-webkit-slider-thumb {
  -webkit-appearance:none; width:14px; height:20px;
  background:var(--pink); border:3px solid #000; cursor:pointer;
}
.c-fontsize-val { font-size:11px; font-weight:800; font-family:'JetBrains Mono',monospace; min-width:26px; color:#000; }

.coder-topbar .c-actions { display:flex; gap:0; margin-left:auto; flex-shrink:0; }
.coder-topbar .c-action {
  width:44px; height:44px; border:none; border-left:3px solid #000;
  background:transparent; cursor:pointer; display:flex; align-items:center;
  justify-content:center; font-size:16px; font-weight:800; transition:background 0.1s;
  font-family:'Space Grotesk',sans-serif; flex-shrink:0;
}
.coder-topbar .c-action:hover { background:rgba(0,0,0,0.1); }
.coder-topbar .c-action.green { background:var(--green); }
.coder-topbar .c-action.green:hover { background:#00cc6a; }
.coder-topbar .c-action.blue { background:var(--cyan); }
.coder-topbar .c-action.close-btn { background:var(--pink); }
.coder-topbar .c-filename {
  border:none; border-left:3px solid #000; border-right:3px solid #000;
  padding:0 10px; height:44px; font-family:'JetBrains Mono',monospace;
  font-size:12px; font-weight:700; background:var(--white); outline:none; width:130px; flex-shrink:0;
}

/* Coder body */
.coder-body { display:grid; grid-template-columns:1fr 1fr; flex:1; overflow:hidden; }
.coder-body.layout-editor { grid-template-columns:1fr 0; }
.coder-body.layout-preview { grid-template-columns:0 1fr; }
.coder-editor-wrap { display:flex; flex-direction:column; border-right:4px solid #000; overflow:hidden; position:relative; }
.coder-preview { flex:1; overflow:hidden; background:#fff; }
.coder-preview iframe { width:100%; height:100%; border:none; background:#fff; }

/* Slide label */
.slide-coder-tag {
  position:absolute; top:25px; left:66px; z-index:900;
  background:var(--yellow); border:3px solid #000; box-shadow:3px 3px 0 #000;
  padding:5px 12px; font-size:11px; font-weight:800; text-transform:uppercase;
  letter-spacing:0.5px; pointer-events:none; opacity:0; transition:opacity 0.3s;
}
.slide-coder-tag.visible { opacity:1; }

/* ======================================================
   CODEMIRROR CUSTOM THEME
====================================================== */
.cm-s-slider-dark.CodeMirror {
  background: #0d0d0d !important;
  color: #e8e8e8 !important;
  font-family: 'JetBrains Mono', monospace !important;
  height: 100% !important;
  border: none !important;
}
.cm-s-slider-dark .CodeMirror-gutters {
  background: #111 !important;
  border-right: 2px solid #333 !important;
}
.cm-s-slider-dark .CodeMirror-linenumber { color: #444 !important; }
.cm-s-slider-dark .CodeMirror-cursor { border-left: 2px solid #FFE600 !important; }
.cm-s-slider-dark .CodeMirror-selected { background: #FFE60022 !important; }
.cm-s-slider-dark .CodeMirror-activeline-background { background: #1a1a1a !important; }
/* Tokens */
.cm-s-slider-dark span.cm-keyword   { color: #FFE600 !important; font-weight:bold; }
.cm-s-slider-dark span.cm-def       { color: #00D9FF !important; }
.cm-s-slider-dark span.cm-variable  { color: #e8e8e8 !important; }
.cm-s-slider-dark span.cm-variable-2{ color: #00FF88 !important; }
.cm-s-slider-dark span.cm-property  { color: #00D9FF !important; }
.cm-s-slider-dark span.cm-operator  { color: #FF6B9D !important; }
.cm-s-slider-dark span.cm-string    { color: #00FF88 !important; }
.cm-s-slider-dark span.cm-string-2  { color: #00cc6a !important; }
.cm-s-slider-dark span.cm-number    { color: #00D9FF !important; }
.cm-s-slider-dark span.cm-atom      { color: #FF6B9D !important; }
.cm-s-slider-dark span.cm-comment   { color: #555 !important; font-style:italic; }
.cm-s-slider-dark span.cm-tag       { color: #FF6B9D !important; font-weight:bold; }
.cm-s-slider-dark span.cm-attribute { color: #00D9FF !important; }
.cm-s-slider-dark span.cm-qualifier { color: #FFE600 !important; }
.cm-s-slider-dark span.cm-builtin   { color: #00FF88 !important; }
.cm-s-slider-dark span.cm-bracket   { color: #FF6B9D !important; }
.cm-s-slider-dark span.cm-error     { color: #ff4444 !important; text-decoration:underline; }
.cm-s-slider-dark .CodeMirror-matchingbracket { background:#FFE60033 !important; color:#FFE600 !important; outline:1px solid #FFE600; }
/* Scrollbar */
.cm-s-slider-dark .CodeMirror-scroll::-webkit-scrollbar { width:8px; height:8px; }
.cm-s-slider-dark .CodeMirror-scroll::-webkit-scrollbar-track { background:#1a1a1a; }
.cm-s-slider-dark .CodeMirror-scroll::-webkit-scrollbar-thumb { background:#FFE600; }
/* Fold gutter */
.cm-s-slider-dark .CodeMirror-foldgutter-open, .cm-s-slider-dark .CodeMirror-foldgutter-folded { color:#FFE600 !important; cursor:pointer; }
/* Hint */
.CodeMirror-hints { background:#1a1a1a !important; border:2px solid #FFE600 !important; font-family:'JetBrains Mono',monospace !important; }
.CodeMirror-hint { color:#e8e8e8 !important; }
.CodeMirror-hint-active { background:#FFE60033 !important; color:#FFE600 !important; }
/* Make CM fill container */
.coder-editor-wrap .CodeMirror { flex:1; min-height:0; }

/* ======================================================
   OVERLAY CANVAS
====================================================== */
#overlayWrapper { position:fixed; inset:0; z-index:1500; pointer-events:none; display:none; }
#overlayWrapper.active { display:block; pointer-events:auto; }
#overlayCanvas { position:absolute; inset:0; cursor:crosshair; touch-action:none; }
#overlayToolbar {
  position:fixed; bottom:-80px; left:50%; transform:translateX(-50%);
  z-index:1600; display:flex; align-items:center; gap:8px;
  background:#fff; border:4px solid #000; box-shadow:var(--shadow-lg);
  padding:8px 14px; transition:bottom 0.35s ease; pointer-events:none;
}
#overlayToolbar.active { bottom:12px; pointer-events:auto; }
.ov-label { font-weight:800; font-size:11px; text-transform:uppercase; color:#000; padding:0 4px; }
.ov-btn {
  width:38px; height:38px; border:3px solid #000; background:var(--gray);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; box-shadow:3px 3px 0 #000; transition:all 0.1s;
}
.ov-btn:hover { background:var(--cyan); transform:translate(1px,1px); box-shadow:2px 2px 0 #000; }
.ov-btn.active { background:var(--yellow); box-shadow:none; transform:translate(3px,3px); }
#overlayToolbar select {
  height:38px; border:3px solid #000; background:var(--gray);
  font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12px;
  padding:0 6px; cursor:pointer; box-shadow:3px 3px 0 #000; outline:none;
}
.ov-range {
  width:80px; height:8px; -webkit-appearance:none; appearance:none;
  background:var(--gray); border:3px solid #000; outline:none; cursor:pointer; box-shadow:2px 2px 0 #000;
}
.ov-range::-webkit-slider-thumb { -webkit-appearance:none; width:16px; height:16px; background:var(--pink); border:3px solid #000; cursor:pointer; }
#ovColor { width:38px; height:38px; border:3px solid #000; padding:0; cursor:pointer; box-shadow:3px 3px 0 #000; }
.ov-sep { width:3px; height:34px; background:#000; }

/* ======================================================
   TOP OVERLAY
====================================================== */
#topOverlay {
  position:fixed; top:-110px; left:50px; width:1420px; height:70px;
  background:var(--yellow); z-index:9999;
  display:flex; justify-content:center; align-items:center;
  box-shadow:5px 5px 0 #000; transition:top 0.45s ease;
}
#topOverlay.show { top:0; }
#lessonName { color:#000; font-size:2rem; font-weight:800; padding:10px 30px; cursor:pointer; }
#slidePageNo {
  position:absolute; right:30px; font-size:1.2rem; font-weight:800;
  background:#000; color:var(--yellow); padding:6px 16px;
  border:3px solid #000; box-shadow:3px 3px 0 var(--yellow); letter-spacing:1px;
}

/* ======================================================
   OFFCANVAS (cut)
====================================================== */
#offcanvas {
  position:fixed; top:0; left:-100%; width:100%; height:100%;
  background:#fff; z-index:2000; transition:left 0.35s ease;
  overflow:auto; border-right:5px solid #000;
}
#offcanvas.show { left:0; }
#offcanvasControls { padding:10px; display:flex; gap:8px; flex-wrap:wrap; background:var(--yellow); border-bottom:4px solid #000; }
#cutCanvas { border:4px solid #000; touch-action:none; width:100%; box-shadow:var(--shadow); }

/* ======================================================
   SPEECH OFFCANVAS
====================================================== */
#speechOffcanvas {
  position:fixed; top:0; right:-420px; width:420px; height:100%;
  background:#fff; z-index:2000; transition:right 0.35s ease;
  padding:20px; overflow:auto; border-left:5px solid #000;
}
#speechOffcanvas.show { right:0; }
#speechOffcanvas h5 { font-weight:800; border-bottom:3px solid #000; padding-bottom:8px; margin-bottom:12px; }
#speechText { width:100%; height:180px; font-size:14px; border:3px solid #000; padding:8px; font-family:'JetBrains Mono',monospace; resize:none; }
#mediaURL { width:100%; margin-bottom:5px; border:3px solid #000; padding:6px 8px; font-family:'JetBrains Mono',monospace; font-size:12px; outline:none; }

/* Scrollbars */
::-webkit-scrollbar { width:10px; height:10px; }
::-webkit-scrollbar-track { background:var(--gray); border:2px solid #000; }
::-webkit-scrollbar-thumb { background:var(--yellow); border:2px solid #000; }
::-webkit-scrollbar-thumb:hover { background:var(--pink); }
</style>
</head>
<body>

<!-- CAROUSEL -->
<div class="carousel-container">
  <button class="slider-btn prev-btn" id="prev">&#10094;</button>
  <div class="slider" id="slider">
    <div class="slide" id="slide0">
      <canvas id="canvas1"></canvas>
      <div class="coder-panel" id="coder0"></div>
      <div class="slide-coder-tag" id="tag0" style="display:none">CODER</div>
    </div>
  </div>
  <button class="slider-btn next-btn" id="next">&#10095;</button>
</div>

<!-- OVERLAY -->
<div id="overlayWrapper"><canvas id="overlayCanvas"></canvas></div>
<div id="overlayToolbar">
  <button class="ov-btn active" id="ovDrawBtn"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path d="M12.854.146a.5.5 0 0 0-.707 0L10.5 1.793 14.207 5.5l1.647-1.646a.5.5 0 0 0 0-.708zm.646 6.061L9.793 2.5 3.293 9H3.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.207zm-7.468 7.468A.5.5 0 0 1 6 13.5V13h-.5a.5.5 0 0 1-.5-.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.5-.5V10h-.5a.5.5 0 0 1-.175-.032l-.179.178a.5.5 0 0 0-.11.168l-2 5a.5.5 0 0 0 .65.65l5-2a.5.5 0 0 0 .168-.11z"/></svg></button>
  <button class="ov-btn" id="ovEraseBtn"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path d="M8.086 2.207a2 2 0 0 1 2.828 0l3.879 3.879a2 2 0 0 1 0 2.828l-5.5 5.5A2 2 0 0 1 7.879 15H5.12a2 2 0 0 1-1.414-.586l-2.5-2.5a2 2 0 0 1 0-2.828zm2.121.707a1 1 0 0 0-1.414 0L4.16 7.547l5.293 5.293 4.633-4.633a1 1 0 0 0 0-1.414zM8.746 13.547 3.453 8.254 1.914 9.793a1 1 0 0 0 0 1.414l2.5 2.5a1 1 0 0 0 .707.293H7.88a1 1 0 0 0 .707-.293z"/></svg></button>
  <div class="ov-sep"></div>
  <span class="ov-label">ÇİZGİ</span>
  <select id="ovStrokeType"><option value="normal">Normal</option><option value="rough">Rough</option><option value="dashed">Dashed</option><option value="dotted">Dotted</option></select>
  <div class="ov-sep"></div>
  <span class="ov-label">KALNLK</span>
  <input type="range" id="ovThickness" class="ov-range" min="1" max="40" value="5">
  <div class="ov-sep"></div>
  <input type="color" id="ovColor" value="#FF0000">
  <div class="ov-sep"></div>
  <span class="ov-label">OPAK</span>
  <input type="range" id="ovOpacity" class="ov-range" min="0" max="100" value="100">
  <div class="ov-sep"></div>
  <button class="ov-btn" id="ovUndoBtn"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M8 3a5 5 0 1 1-4.546 2.914.5.5 0 0 0-.908-.417A6 6 0 1 0 8 2z"/><path d="M8 4.466V.534a.25.25 0 0 0-.41-.192L5.23 2.308a.25.25 0 0 0 0 .384l2.36 1.966A.25.25 0 0 0 8 4.466"/></svg></button>
  <button class="ov-btn" id="ovRedoBtn"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2z"/><path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466"/></svg></button>
  <button class="ov-btn" id="ovClearBtn"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0z"/><path d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4zM2.5 3h11V2h-11z"/></svg></button>
  <button class="ov-btn" id="ovCloseBtn" style="background:#FF6B9D;">✕</button>
</div>

<!-- RIGHT CONTROLS -->
<div class="controls">
  <button class="ctrl-btn" id="coderToggleBtn" title="Kod Editörü">
    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16"><path d="M5.854 4.854a.5.5 0 1 0-.708-.708l-3.5 3.5a.5.5 0 0 0 0 .708l3.5 3.5a.5.5 0 0 0 .708-.708L2.707 8zm4.292 0a.5.5 0 0 1 .708-.708l3.5 3.5a.5.5 0 0 1 0 .708l-3.5 3.5a.5.5 0 0 1-.708-.708L13.293 8z"/></svg>
  </button>
  <button class="ctrl-btn active" id="normalMode" title="Normal">
    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M1 8a7 7 0 1 0 14 0A7 7 0 0 0 1 8m15 0A8 8 0 1 1 0 8a8 8 0 0 1 16 0M5.854 10.803a.5.5 0 1 1-.708-.707L9.243 6H6.475a.5.5 0 1 1 0-1h3.975a.5.5 0 0 1 .5.5v3.975a.5.5 0 1 1-1 0V6.707z"/></svg>

<script>
'use strict';
/* ================================================================
   GLOBALS
================================================================ */
const sliderEl     = document.getElementById('slider');
let currentSlide   = 0;
let canvases       = [];
let undoStacks     = [[]];
let redoStacks     = [[]];
let slideSpeeches  = [''];
let slideTitles    = ['Ders Adı Buraya'];
let slideAudios    = [null];
let slideMediaObjs = {};
let bgImageURL     = null;
let currentMode    = 'normal';
let shapeMode      = null;
window.currentAudio = null;
window.voices = [];
window.preferredVoice = null;

/* ================================================================
   CODEMIRROR INSTANCES  { slideIdx -> { full, html, css, js } }
================================================================ */
const cmInstances = {};

/* ================================================================
   PER-SLIDE CODER STATE
================================================================ */
let coderStates = [];
function defaultCoderState() {
  return { fullCode:'', htmlCode:'', cssCode:'', jsCode:'', activeTab:'full', layout:'split', fontSize:13 };
}

/* ================================================================
   CM COMMON OPTIONS
================================================================ */
function cmOptions(mode, fontSize) {
  return {
    mode: mode,
    theme: 'slider-dark',
    lineNumbers: true,
    lineWrapping: true,
    matchBrackets: true,
    autoCloseBrackets: true,
    autoCloseTags: true,
    foldGutter: true,
    gutters: ['CodeMirror-linenumbers','CodeMirror-foldgutter'],
    styleActiveLine: true,
    tabSize: 2,
    indentWithTabs: false,
    indentUnit: 2,
    extraKeys: {
      'Ctrl-Space': 'autocomplete',
      'Ctrl-/': 'toggleComment',
      Tab: function(cm) {
        if (cm.somethingSelected()) cm.indentSelection('add');
        else cm.replaceSelection('  ', 'end');
      }
    }
  };
}

/* ================================================================
   BUILD CODER PANEL
================================================================ */
function buildCoderPanel(slideIdx) {
  const panel = document.getElementById(`coder${slideIdx}`);
  if (!panel) return;
  const st = coderStates[slideIdx];

  panel.innerHTML = `
    <div class="coder-topbar">
      <div class="c-tabs">
        <button class="c-tab active" data-tab="full">FULL</button>
        <button class="c-tab" data-tab="html">HTML</button>
        <button class="c-tab" data-tab="css">CSS</button>
        <button class="c-tab" data-tab="js">JS</button>
      </div>
      <div class="c-fontsize-wrap">
        <label>FONT</label>
        <input type="range" class="c-fontsize-slider" min="8" max="28" value="${st.fontSize}">
        <span class="c-fontsize-val">${st.fontSize}px</span>
      </div>
      <div class="c-actions">
        <button class="c-action blue" data-layout="split" title="Split">⇔</button>
        <button class="c-action" data-layout="editor" title="Editör">&#60;/&#62;</button>
        <button class="c-action" data-layout="preview" title="Önizleme">⊙</button>
        <label class="c-action" title="HTML Dosya İçe Aktar" style="cursor:pointer;background:var(--yellow);">
          📂<input type="file" accept=".html,.htm,.txt,.css,.js" style="display:none;" class="c-import-file">
        </label>
        <input class="c-filename" type="text" value="slide${slideIdx+1}.html">
        <button class="c-action green" data-action="run" title="Çalıştır (Ctrl+Enter)">▶</button>
        <button class="c-action green" data-action="save" title="Kaydet">💾</button>
        <button class="c-action close-btn" data-action="close" title="Kapat">✕</button>
      </div>
    </div>
    <div class="coder-body">
      <div class="coder-editor-wrap" id="editor-wrap-${slideIdx}">
        <textarea class="cm-host" id="cm-full-${slideIdx}"></textarea>
        <textarea class="cm-host" id="cm-html-${slideIdx}" hidden></textarea>
        <textarea class="cm-host" id="cm-css-${slideIdx}" hidden></textarea>
        <textarea class="cm-host" id="cm-js-${slideIdx}" hidden></textarea>
      </div>
      <div class="coder-preview">
        <iframe id="preview-${slideIdx}" sandbox="allow-scripts allow-same-origin allow-forms allow-modals"></iframe>
      </div>
    </div>`;

  applyCoderLayout(panel, st.layout);
  attachCoderEvents(panel, slideIdx);

  // Init CodeMirror after DOM is ready
  requestAnimationFrame(() => initCMForSlide(slideIdx));
}

function initCMForSlide(slideIdx) {
  const st = coderStates[slideIdx];
  const makeEditor = (id, mode, value) => {
    const ta = document.getElementById(id);
    if (!ta) return null;
    const cm = CodeMirror.fromTextArea(ta, cmOptions(mode, st.fontSize));
    cm.setValue(value || '');
    cm.getWrapperElement().style.height = '100%';
    cm.getWrapperElement().style.fontSize = st.fontSize + 'px';
    cm.getWrapperElement().style.flex = '1';
    cm.getWrapperElement().style.minHeight = '0';
    cm.refresh();
    return cm;
  };

  const eds = {
    full: makeEditor(`cm-full-${slideIdx}`, 'htmlmixed', st.fullCode),
    html: makeEditor(`cm-html-${slideIdx}`, 'htmlmixed', st.htmlCode),
    css:  makeEditor(`cm-css-${slideIdx}`,  'css',       st.cssCode),
    js:   makeEditor(`cm-js-${slideIdx}`,   'javascript',st.jsCode),
  };
  cmInstances[slideIdx] = eds;

  // Show/hide based on active tab
  setCMVisible(slideIdx, st.activeTab);

  // Wire changes
  const wireChange = (ed, area) => {
    if (!ed) return;
    ed.on('change', () => {
      const val = ed.getValue();
      if (area === 'full') {
        st.fullCode = val;
        syncPartsToCoder(slideIdx);
      } else {
        st[area + 'Code'] = val;
      }
      updateCoderPreview(slideIdx);
    });
    // Ctrl+Enter = run
    ed.setOption('extraKeys', Object.assign({}, ed.getOption('extraKeys'), {
      'Ctrl-Enter': () => updateCoderPreview(slideIdx),
      'Ctrl-Space': 'autocomplete',
      'Ctrl-/': 'toggleComment',
      Tab: function(cm) {
        if (cm.somethingSelected()) cm.indentSelection('add');
        else cm.replaceSelection('  ', 'end');
      }
    }));
  };
  wireChange(eds.full, 'full');
  wireChange(eds.html, 'html');
  wireChange(eds.css,  'css');
  wireChange(eds.js,   'js');

  updateCoderPreview(slideIdx);
}

function setCMVisible(slideIdx, activeTab) {
  const eds = cmInstances[slideIdx];
  if (!eds) return;
  ['full','html','css','js'].forEach(area => {
    const wrapper = eds[area]?.getWrapperElement();
    if (!wrapper) return;
    wrapper.style.display = (area === activeTab) ? 'flex' : 'none';
    wrapper.style.flexDirection = 'column';
    wrapper.style.height = '100%';
    if (area === activeTab) setTimeout(() => eds[area].refresh(), 50);
  });
}

function applyCoderLayout(panel, layout) {
  const body = panel.querySelector('.coder-body');
  if (!body) return;
  body.className = 'coder-body';
  if (layout === 'editor')  body.classList.add('layout-editor');
  if (layout === 'preview') body.classList.add('layout-preview');
  panel.querySelectorAll('[data-layout]').forEach(b => {
    b.style.background = (b.dataset.layout === layout) ? '#000' : '';
    b.style.color = (b.dataset.layout === layout) ? '#FFE600' : '';
  });
  // Refresh CM
  const slideIdx = parseInt(panel.id.replace('coder',''));
  const eds = cmInstances[slideIdx];
  if (eds) setTimeout(() => Object.values(eds).forEach(ed => ed && ed.refresh()), 100);
}

function updateCoderPreview(slideIdx) {
  const panel = document.getElementById(`coder${slideIdx}`);
  if (!panel) return;
  const st = coderStates[slideIdx];
  const iframe = document.getElementById(`preview-${slideIdx}`);
  if (!iframe) return;
  let src = '';
  if (st.activeTab === 'full') {
    src = st.fullCode;
  } else {
    src = `<!DOCTYPE html><html><head><style>${st.cssCode}</style></head><body>${st.htmlCode}<script>${st.jsCode}<\/script></body></html>`;
    st.fullCode = src;
    const eds = cmInstances[slideIdx];
    if (eds?.full) {
      const cur = eds.full.getValue();
      if (cur !== src) { eds.full.setValue(src); }
    }
  }
  iframe.srcdoc = src;
}

function syncPartsToCoder(slideIdx) {
  const st = coderStates[slideIdx];
  const parser = new DOMParser();
  const doc = parser.parseFromString(st.fullCode, 'text/html');
  st.htmlCode = doc.body.innerHTML.replace(/<script[\s\S]*?<\/script>/gi,'').trim();
  st.cssCode  = Array.from(doc.querySelectorAll('style')).map(s=>s.innerHTML).join('\n');
  st.jsCode   = Array.from(doc.querySelectorAll('script:not([src])')).map(s=>s.innerHTML).join('\n');
  const eds = cmInstances[slideIdx];
  if (eds) {
    const setVal = (ed, val) => { if (ed && ed.getValue() !== val) ed.setValue(val); };
    setVal(eds.html, st.htmlCode);
    setVal(eds.css,  st.cssCode);
    setVal(eds.js,   st.jsCode);
  }
}

function attachCoderEvents(panel, slideIdx) {
  const st = coderStates[slideIdx];

  // TABS
  panel.querySelectorAll('.c-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      panel.querySelectorAll('.c-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      st.activeTab = btn.dataset.tab;
      setCMVisible(slideIdx, st.activeTab);
    });
  });

  // LAYOUT
  panel.querySelectorAll('[data-layout]').forEach(btn => {
    btn.addEventListener('click', () => {
      st.layout = btn.dataset.layout;
      applyCoderLayout(panel, st.layout);
    });
  });

  // FONT SIZE
  const fsSlider = panel.querySelector('.c-fontsize-slider');
  const fsVal    = panel.querySelector('.c-fontsize-val');
  if (fsSlider) {
    fsSlider.addEventListener('input', () => {
      const sz = parseInt(fsSlider.value);
      st.fontSize = sz;
      fsVal.textContent = sz + 'px';
      const eds = cmInstances[slideIdx];
      if (eds) Object.values(eds).forEach(ed => {
        if (ed) { ed.getWrapperElement().style.fontSize = sz + 'px'; ed.refresh(); }
      });
    });
  }

  // FILE IMPORT
  const importInput = panel.querySelector('.c-import-file');
  if (importInput) {
    importInput.addEventListener('change', e => {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        const content = ev.target.result;
        st.fullCode = content;
        st.activeTab = 'full';
        panel.querySelectorAll('.c-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === 'full'));
        setCMVisible(slideIdx, 'full');
        const eds = cmInstances[slideIdx];
        if (eds?.full) eds.full.setValue(content);
        syncPartsToCoder(slideIdx);
        updateCoderPreview(slideIdx);
        // Set filename
        const fnInput = panel.querySelector('.c-filename');
        if (fnInput) fnInput.value = file.name;
      };
      reader.readAsText(file);
      importInput.value = '';
    });
  }

  // ACTIONS
  panel.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      const action = btn.dataset.action;
      if (action === 'run') {
        updateCoderPreview(slideIdx);
      } else if (action === 'save') {
        const fname = panel.querySelector('.c-filename').value || `slide${slideIdx+1}.html`;
        const blob = new Blob([st.fullCode || ''], { type:'text/html' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = fname; a.click();
      } else if (action === 'close') {
        toggleCoder(slideIdx, false);
      }
    });
  });
}

/* ================================================================
   CODER TOGGLE
================================================================ */
let coderOpenState = [];

function toggleCoder(slideIdx, forceOpen) {
  const panel = document.getElementById(`coder${slideIdx}`);
  const tag   = document.getElementById(`tag${slideIdx}`);
  if (!panel) return;
  const shouldOpen = (forceOpen !== undefined) ? forceOpen : !panel.classList.contains('open');
  coderOpenState[slideIdx] = shouldOpen;
  if (shouldOpen) {
    panel.classList.add('open');
    if (tag) tag.classList.add('visible');
    document.getElementById('coderToggleBtn').classList.add('active');
    setTimeout(() => {
      const eds = cmInstances[slideIdx];
      if (eds) Object.values(eds).forEach(ed => ed && ed.refresh());
    }, 450);
  } else {
    panel.classList.remove('open');
    if (tag) tag.classList.remove('visible');
    document.getElementById('coderToggleBtn').classList.remove('active');
  }
}

/* ================================================================
   CANVAS EVENTS
================================================================ */
function attachCanvasEvents(canvas) {
  let _drawing=false, _startX, _startY, _tempObj;

  canvas.on('mouse:down', opt => {
    const e=opt.e, pointer=canvas.getPointer(e);
    if (currentMode==='erase') {
      const obj=canvas.findTarget(e,true);
      if (obj) {
        removeObjAndWrapper(obj); canvas.remove(obj);
        canvas.discardActiveObject(); canvas.requestRenderAll(); saveState();
        setMode('normal'); activateBtn(document.getElementById('normalMode'));
      }
      return;
    }
    if (shapeMode) {
      _drawing=true; _startX=pointer.x; _startY=pointer.y;
      const col=document.getElementById('brushColor').value;
      if (shapeMode==='rect') _tempObj=new fabric.Rect({left:_startX,top:_startY,width:0,height:0,fill:col+'33',stroke:col,strokeWidth:2,rx:6,ry:6});
      else if (shapeMode==='circle') _tempObj=new fabric.Ellipse({left:_startX,top:_startY,originX:'left',originY:'top',rx:0,ry:0,fill:col+'33',stroke:col,strokeWidth:2});
      else if (shapeMode==='arrow') _tempObj=new fabric.Line([_startX,_startY,_startX,_startY],{stroke:col,strokeWidth:4,selectable:false});
      if (_tempObj) canvas.add(_tempObj);
      return;
    }
    if (currentMode==='draw') {
      if (!canvas.freeDrawingBrush) canvas.freeDrawingBrush=new fabric.PencilBrush(canvas);
      canvas.freeDrawingBrush.color=document.getElementById('brushColor').value;
      canvas.freeDrawingBrush.width=parseInt(document.getElementById('brushWidth').value)||5;
      return;
    }
    if (opt.target) { opt.target.bringToFront(); canvas.setActiveObject(opt.target); canvas.requestRenderAll(); }
  });
  canvas.on('mouse:move', opt => {
    if (!_drawing||!_tempObj) return;
    const p=canvas.getPointer(opt.e);
    if (shapeMode==='rect') _tempObj.set({width:Math.abs(p.x-_startX),height:Math.abs(p.y-_startY),left:Math.min(p.x,_startX),top:Math.min(p.y,_startY)});
    else if (shapeMode==='circle') _tempObj.set({rx:Math.abs(p.x-_startX)/2,ry:Math.abs(p.y-_startY)/2,left:Math.min(p.x,_startX),top:Math.min(p.y,_startY)});
    else if (shapeMode==='arrow') _tempObj.set({x2:p.x,y2:p.y});
    canvas.requestRenderAll();
  });
  canvas.on('mouse:up', () => {
    if (_drawing) { _drawing=false; _tempObj=null; shapeMode=null; setMode('normal'); activateBtn(document.getElementById('normalMode')); saveState(); }
  });
  canvas.on('path:created', () => saveState());
  canvas.on('selection:created', updateOpacitySlider);
  canvas.on('selection:updated', updateOpacitySlider);
  canvas.on('selection:cleared', () => { document.getElementById('opacityRange').value=100; });
}

function removeObjAndWrapper(obj) {
  const list = slideMediaObjs[currentSlide]||[];
  for (let i=list.length-1;i>=0;i--) {
    if (list[i] && list[i].rect===obj) {
      if (list[i].wrapper?.parentNode) list[i].wrapper.parentNode.removeChild(list[i].wrapper);
      list.splice(i,1);
    }
  }
}

/* ================================================================
   MODE
================================================================ */
function setMode(mode) {
  currentMode=mode;
  currentCanvas.isDrawingMode=false;
  currentCanvas.selection=(mode==='normal');
  currentCanvas.forEachObject(o=>{o.selectable=(mode==='normal');});
  if (mode==='draw') {
    if (!currentCanvas.freeDrawingBrush) currentCanvas.freeDrawingBrush=new fabric.PencilBrush(currentCanvas);
    currentCanvas.freeDrawingBrush.color=document.getElementById('brushColor').value;
    currentCanvas.freeDrawingBrush.width=parseInt(document.getElementById('brushWidth').value)||5;
    currentCanvas.isDrawingMode=true;
  }
}

/* ================================================================
   UNDO / REDO
================================================================ */
function saveState() {
  const idx=currentSlide;
  if (!undoStacks[idx]) undoStacks[idx]=[];
  if (!redoStacks[idx]) redoStacks[idx]=[];
  undoStacks[idx].push(currentCanvas.toJSON()); redoStacks[idx]=[];
}
function undo() {
  const idx=currentSlide;
  if (!undoStacks[idx]?.length) return;
  if (!redoStacks[idx]) redoStacks[idx]=[];
  redoStacks[idx].push(currentCanvas.toJSON());
  currentCanvas.loadFromJSON(undoStacks[idx].pop(),()=>{currentCanvas.discardActiveObject();currentCanvas.renderAll();});
}
function redo() {
  const idx=currentSlide;
  if (!redoStacks[idx]?.length) return;
  if (!undoStacks[idx]) undoStacks[idx]=[];
  undoStacks[idx].push(currentCanvas.toJSON());
  currentCanvas.loadFromJSON(redoStacks[idx].pop(),()=>{currentCanvas.discardActiveObject();currentCanvas.renderAll();});
}

function addSlide() {
  const idx=sliderEl.children.length;
  const div=document.createElement('div');
  div.className='slide'; div.id=`slide${idx}`;
  div.innerHTML=`
    <canvas id="canvas${idx+1}"></canvas>
    <div class="coder-panel" id="coder${idx}"></div>
    <div class="slide-coder-tag" id="tag${idx}" style="display:none">CODER</div>`;
  sliderEl.appendChild(div);
  coderStates[idx]=defaultCoderState();
  coderOpenState[idx]=false;
  undoStacks[idx]=[]; redoStacks[idx]=[];
  slideSpeeches[idx]=''; slideAudios[idx]=null;
  slideTitles[idx]='Ders Adı Buraya'; slideMediaObjs[idx]=[];
  buildCoderPanel(idx);
  const nc=createCanvas(`canvas${idx+1}`);
  canvases.push(nc);
  if(bgImageURL) applyBg(nc,bgImageURL);

}

    el.classList.remove('active'); el.style.display='none'; el.style.pointerEvents='none';

  (slideMediaObjs[currentSlide]||[]).forEach(o=>{
    if(o.wrapper){o.wrapper.style.display='block';o.wrapper.classList.add('active');o.wrapper.style.pointerEvents='auto';}

function addMediaToSlide(url){
  if(!url) return;
  const idx=currentSlide;
  if(!slideMediaObjs[idx]) slideMediaObjs[idx]=[];
  const slideEl=document.getElementById(`slide${idx}`);
  slideEl.style.position='relative';
  const wrapper=document.createElement('div');
  wrapper.className='embed-wrapper fullscreen-embed active';
  Object.assign(wrapper.style,{
    position:'absolute',inset:'0',width:'100%',height:'100%',
    left:'0',top:'0',zIndex:'500',display:'block',
    pointerEvents:'auto',border:'none',overflow:'hidden'
  });
  let el;
  if(url.match(/\.(mp4|webm|ogg)($|\?)/i)){
    el=document.createElement('video');
    el.src=url;el.autoplay=true;el.loop=true;el.playsInline=true;el.controls=true;
    Object.assign(el.style,{width:'100%',height:'100%',objectFit:'cover',border:'none',display:'block'});
  } else {
    el=document.createElement('iframe');
    el.src=url;el.allow='autoplay;fullscreen;camera;microphone';el.allowFullscreen=true;
    Object.assign(el.style,{width:'100%',height:'100%',border:'none',display:'block'});
  }
  wrapper.appendChild(el);
  slideEl.appendChild(wrapper);
  slideMediaObjs[idx].push({rect:null,wrapper,fullscreen:true});
}

/* ================================================================
   CUT TOOL
================================================================ */
const offcanvas=document.getElementById('offcanvas');
const cutCanvas=document.getElementById('cutCanvas');
const cutCtx=cutCanvas.getContext('2d');
let imgCut=null,cutPts=[],cutDraw=false,cutDrag=false;
let cutZoom=1,cutPanX=0,cutPanY=0,cutLX,cutLY;

function resizeCut(){cutCanvas.width=window.innerWidth;cutCanvas.height=window.innerHeight-60;drawCut();}
window.addEventListener('resize',resizeCut);

function drawCut(){
  cutCtx.clearRect(0,0,cutCanvas.width,cutCanvas.height);
  if(!imgCut) return;
  const w=imgCut.width*cutZoom,h=imgCut.height*cutZoom;
  cutCtx.drawImage(imgCut,0,0,imgCut.width,imgCut.height,(cutCanvas.width-w)/2+cutPanX,(cutCanvas.height-h)/2+cutPanY,w,h);
  if(cutPts.length>0){
    cutCtx.strokeStyle='red';cutCtx.lineWidth=2;cutCtx.fillStyle='rgba(255,0,0,0.3)';
    cutCtx.beginPath();cutCtx.moveTo(cutPts[0].x,cutPts[0].y);
    cutPts.forEach(p=>cutCtx.lineTo(p.x,p.y));
    cutCtx.closePath();cutCtx.fill();cutCtx.stroke();
  }
}
function cutPtr(e){const r=cutCanvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
cutCanvas.addEventListener('mousedown',e=>{if(e.shiftKey){cutDrag=true;cutLX=e.clientX;cutLY=e.clientY;}else{cutDraw=true;cutPts.push(cutPtr(e));drawCut();}});
cutCanvas.addEventListener('mousemove',e=>{if(cutDrag){cutPanX+=e.clientX-cutLX;cutPanY+=e.clientY-cutLY;cutLX=e.clientX;cutLY=e.clientY;drawCut();}else if(cutDraw){cutPts.push(cutPtr(e));drawCut();}});
cutCanvas.addEventListener('mouseup',()=>{cutDraw=false;cutDrag=false;});
cutCanvas.addEventListener('mouseleave',()=>{cutDraw=false;cutDrag=false;});
cutCanvas.addEventListener('wheel',e=>{
  if(!imgCut)return;
  const r=cutCanvas.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top,prev=cutZoom;
  cutZoom=Math.min(Math.max(0.2,cutZoom*(e.deltaY<0?1.1:0.9)),5);
  cutPanX-=(mx-cutCanvas.width/2-cutPanX)*(cutZoom/prev-1);
  cutPanY-=(my-cutCanvas.height/2-cutPanY)*(cutZoom/prev-1);
  drawCut();e.preventDefault();
},{passive:false});
document.getElementById('cutBtn').addEventListener('click',()=>{offcanvas.classList.add('show');resizeCut();});
document.getElementById('clearCutButton').addEventListener('click',()=>{cutPts=[];drawCut();});
document.getElementById('closeOffcanvas').addEventListener('click',()=>offcanvas.classList.remove('show'));
document.getElementById('fileInput').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=ev=>{imgCut=new Image();imgCut.onload=()=>{cutPts=[];cutZoom=1;cutPanX=0;cutPanY=0;drawCut();};imgCut.src=ev.target.result;};r.readAsDataURL(f);
});
document.getElementById('addCutButton').addEventListener('click',()=>{
  if(!imgCut||cutPts.length<3)return alert('En az 3 nokta');
  const xs=cutPts.map(p=>p.x),ys=cutPts.map(p=>p.y);
  const minX=Math.min(...xs),minY=Math.min(...ys),maxX=Math.max(...xs),maxY=Math.max(...ys);
  const W=maxX-minX,H=maxY-minY,pad=30;
  const tmp=document.createElement('canvas');tmp.width=W+pad;tmp.height=H+pad;
  const tc=tmp.getContext('2d');
  tc.save();tc.beginPath();cutPts.forEach((p,i)=>{const x=p.x-minX,y=p.y-minY;i===0?tc.moveTo(x,y):tc.lineTo(x,y);});tc.closePath();
  tc.shadowColor='rgba(0,0,0,0.5)';tc.shadowBlur=14;tc.shadowOffsetX=9;tc.shadowOffsetY=11;tc.fillStyle='rgba(0,0,0,0.01)';tc.fill();tc.restore();
  tc.save();tc.beginPath();cutPts.forEach((p,i)=>{const x=p.x-minX,y=p.y-minY;i===0?tc.moveTo(x,y):tc.lineTo(x,y);});tc.closePath();tc.clip();tc.shadowColor='transparent';
  tc.drawImage(imgCut,(minX-(cutCanvas.width-imgCut.width*cutZoom)/2-cutPanX)/cutZoom,(minY-(cutCanvas.height-imgCut.height*cutZoom)/2-cutPanY)/cutZoom,W/cutZoom,H/cutZoom,0,0,W,H);tc.restore();
  fabric.Image.fromURL(tmp.toDataURL('image/png',1),img=>{
    img.set({left:currentCanvas.width/2,top:currentCanvas.height/2,originX:'center',originY:'center',selectable:true,angle:(Math.random()-0.5)*4});
    const sh=new fabric.Image.filters.Convolute({matrix:new Float32Array([0,-1,0,-1,5,-1,0,-1,0])});
    img.filters.push(sh);img.applyFilters();
    currentCanvas.add(img);currentCanvas.setActiveObject(img);img.bringToFront();currentCanvas.requestRenderAll();saveState();
  });
  cutPts=[];drawCut();offcanvas.classList.remove('show');
});

   PASTE FROM CLIPBOARD
================================================================ */
document.addEventListener('paste',e=>{
  if(offcanvas.classList.contains('show'))return;
  if(document.activeElement.closest('.CodeMirror'))return;
  const items=e.clipboardData?.items; if(!items) return;
  for(let i=0;i<items.length;i++){
    if(items[i].type.indexOf('image')!==-1){
      const blob=items[i].getAsFile();
      createImageBitmap(blob,{resizeQuality:'high'}).then(bm=>{
        const tmp=document.createElement('canvas');tmp.width=bm.width;tmp.height=bm.height;
        const tc=tmp.getContext('2d',{alpha:true});tc.imageSmoothingEnabled=true;tc.imageSmoothingQuality='high';tc.drawImage(bm,0,0);
        fabric.Image.fromURL(tmp.toDataURL('image/png',1),img=>{
          const cw=currentCanvas.getWidth(),ch=currentCanvas.getHeight();
          const sc=Math.min(cw/img.width,ch/img.height,1);
          img.set({left:cw/2,top:ch/2,originX:'center',originY:'center',scaleX:sc,scaleY:sc,selectable:true,evented:true});
          const sh=new fabric.Image.filters.Convolute({matrix:new Float32Array([0,-0.5,0,-0.5,3,-0.5,0,-0.5,0])});
          img.filters.push(sh);img.applyFilters();
          currentCanvas.add(img);currentCanvas.setActiveObject(img);currentCanvas.requestRenderAll();saveState();
        });
      });
      e.preventDefault();break;
    }
  }
});

/* ================================================================
   TOP OVERLAY
================================================================ */
const topOverlay=document.getElementById('topOverlay');
const lessonNameEl=document.getElementById('lessonName');
document.getElementById('hideStack').addEventListener('click',()=>topOverlay.classList.toggle('show'));
topOverlay.addEventListener('click',e=>{if(e.target.id!=='lessonName'&&e.target.id!=='lessonInput')topOverlay.classList.remove('show');});
lessonNameEl.addEventListener('dblclick',e=>{
  e.stopPropagation();
  const inp=document.createElement('input');inp.type='text';inp.id='lessonInput';
  inp.value=slideTitles[currentSlide]||lessonNameEl.textContent;
  Object.assign(inp.style,{fontSize:'2rem',fontWeight:'800',padding:'10px 30px',border:'none',outline:'none',fontFamily:"'Space Grotesk',sans-serif"});
  lessonNameEl.replaceWith(inp);inp.focus();
  function save(){const v=inp.value.trim()||'Ders Adı Buraya';slideTitles[currentSlide]=v;lessonNameEl.textContent=v;inp.replaceWith(lessonNameEl);}
  inp.addEventListener('blur',save);inp.addEventListener('keydown',ev=>{if(ev.key==='Enter')inp.blur();});
});

/* ================================================================
   SPEECH / AUDIO
================================================================ */
const speechOffcanvas=document.getElementById('speechOffcanvas');
const speechTextEl=document.getElementById('speechText');
const audioPlayer=document.getElementById('slideAudioPlayer');

window.speechSynthesis.onvoiceschanged=()=>{
  window.voices=window.speechSynthesis.getVoices();
  window.preferredVoice=window.voices.find(v=>v.name.includes('Google UK English Male'))||window.voices.find(v=>v.lang==='tr-TR')||window.voices[0];
};

function speakSlide(idx){const txt=slideSpeeches[idx];if(!txt)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);if(window.preferredVoice)u.voice=window.preferredVoice;u.lang='tr-TR';u.rate=0.95;u.pitch=1.0;window.speechSynthesis.speak(u);}
function playSlideAudio(idx){if(window.currentAudio){window.currentAudio.pause();window.currentAudio.currentTime=0;window.currentAudio=null;}const url=slideAudios[idx];if(!url)return;clearTimeout(window._at);window._at=setTimeout(()=>{window.currentAudio=new Audio(url);window.currentAudio.play().catch(()=>{});},650);}

document.getElementById('speechAudioInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const url=URL.createObjectURL(f);slideAudios[currentSlide]=url;audioPlayer.src=url;audioPlayer.load();});
document.getElementById('speechBtn').addEventListener('click',()=>{speechOffcanvas.classList.add('show');speechTextEl.value=slideSpeeches[currentSlide]||'';const url=slideAudios[currentSlide];if(url){audioPlayer.src=url;audioPlayer.load();}});
document.getElementById('closeSpeech').addEventListener('click',()=>{slideSpeeches[currentSlide]=speechTextEl.value;speechOffcanvas.classList.remove('show');window.speechSynthesis.cancel();});
document.getElementById('playSpeech').addEventListener('click',()=>{slideSpeeches[currentSlide]=speechTextEl.value;speakSlide(currentSlide);});

/* ================================================================
   OVERLAY CANVAS (GLASS LAYER)
================================================================ */
(function(){
  const wrap=document.getElementById('overlayWrapper');
  const oc=document.getElementById('overlayCanvas');
  const tb=document.getElementById('overlayToolbar');
  const tog=document.getElementById('overlayToggleBtn');
  let ctx,active=false,mode='draw',painting=false,lx=0,ly=0,hist=[],rhist=[];

  function resize(){
    const old=hist.length>0?hist[hist.length-1]:null;
    oc.width=window.innerWidth;oc.height=window.innerHeight;
    oc.style.width=window.innerWidth+'px';oc.style.height=window.innerHeight+'px';
    ctx=oc.getContext('2d');
    if(old){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0,window.innerWidth,window.innerHeight);img.src=old;}
  }
  function open(){active=true;wrap.classList.add('active');tb.classList.add('active');tog.classList.add('active');resize();save();}
  function close(){if(ctx)ctx.clearRect(0,0,oc.width,oc.height);hist=[];rhist=[];active=false;wrap.classList.remove('active');tb.classList.remove('active');tog.classList.remove('active');}
  function save(){hist.push(oc.toDataURL());rhist=[];}
  function restore(url){return new Promise(res=>{ctx.clearRect(0,0,oc.width,oc.height);const img=new Image();img.onload=()=>{ctx.drawImage(img,0,0,window.innerWidth,window.innerHeight);res();};img.src=url;});}

  tog.addEventListener('click',()=>active?close():open());
  document.getElementById('ovCloseBtn').addEventListener('click',close);
  window.addEventListener('resize',()=>{if(active)resize();});

  function setOvMode(m){mode=m;document.getElementById('ovDrawBtn').classList.toggle('active',m==='draw');document.getElementById('ovEraseBtn').classList.toggle('active',m==='erase');oc.style.cursor=m==='erase'?'cell':'crosshair';}
  document.getElementById('ovDrawBtn').addEventListener('click',()=>setOvMode('draw'));
  document.getElementById('ovEraseBtn').addEventListener('click',()=>setOvMode('erase'));
  document.getElementById('ovUndoBtn').addEventListener('click',async()=>{if(hist.length<=1)return;rhist.push(hist.pop());await restore(hist[hist.length-1]);});
  document.getElementById('ovRedoBtn').addEventListener('click',async()=>{if(!rhist.length)return;const n=rhist.pop();hist.push(n);await restore(n);});
  document.getElementById('ovClearBtn').addEventListener('click',()=>{ctx.clearRect(0,0,oc.width,oc.height);save();});

  function pos(e){
    const r=oc.getBoundingClientRect();
    if(e.touches&&e.touches.length>0)return{x:(e.touches[0].clientX-r.left)*(oc.width/r.width),y:(e.touches[0].clientY-r.top)*(oc.height/r.height)};
    return{x:(e.clientX-r.left)*(oc.width/r.width),y:(e.clientY-r.top)*(oc.height/r.height)};
  }
  function ro(){return(Math.random()-0.5)*3;}
  function startDraw(e){if(!active)return;painting=true;const p=pos(e);lx=p.x;ly=p.y;ctx.globalCompositeOperation=mode==='erase'?'destination-out':'source-over';}
  function draw(e){
    if(!painting||!active)return;
    const p=pos(e),nx=p.x,ny=p.y;
    const type=document.getElementById('ovStrokeType').value;
    const col=document.getElementById('ovColor').value;
    const op=parseInt(document.getElementById('ovOpacity').value)/100;
    const thick=parseInt(document.getElementById('ovThickness').value);
    const h2r=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
    const[r,g,b]=h2r(col);
    ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
    if(mode==='erase'){ctx.globalCompositeOperation='destination-out';ctx.globalAlpha=1;ctx.lineWidth=thick*3;ctx.strokeStyle='rgba(0,0,0,1)';ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(nx,ny);ctx.stroke();}
    else if(type==='rough'){ctx.globalCompositeOperation='source-over';for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(lx+ro(),ly+ro());ctx.lineTo(nx+ro(),ny+ro());ctx.strokeStyle=`rgba(${r},${g},${b},${op})`;ctx.globalAlpha=op*(0.5+Math.random()*0.5);ctx.lineWidth=thick*(0.7+Math.random()*0.6);ctx.stroke();}}
    else if(type==='dashed'){ctx.globalCompositeOperation='source-over';ctx.globalAlpha=op;ctx.strokeStyle=`rgb(${r},${g},${b})`;ctx.lineWidth=thick;ctx.setLineDash([thick*3,thick*2]);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(nx,ny);ctx.stroke();ctx.setLineDash([]);}
    else if(type==='dotted'){ctx.globalCompositeOperation='source-over';ctx.globalAlpha=op;ctx.strokeStyle=`rgb(${r},${g},${b})`;ctx.lineWidth=thick;ctx.lineCap='round';ctx.setLineDash([2,thick*2]);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(nx,ny);ctx.stroke();ctx.setLineDash([]);}
    else{ctx.globalCompositeOperation='source-over';ctx.globalAlpha=op;ctx.strokeStyle=`rgb(${r},${g},${b})`;ctx.lineWidth=thick;ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(nx,ny);ctx.stroke();}
    ctx.restore();lx=nx;ly=ny;
  }
  function endDraw(){if(painting){painting=false;ctx.globalCompositeOperation='source-over';save();}}

  oc.addEventListener('mousedown',startDraw);oc.addEventListener('mousemove',draw);oc.addEventListener('mouseup',endDraw);oc.addEventListener('mouseleave',endDraw);
  oc.addEventListener('touchstart',e=>{e.preventDefault();startDraw(e);},{passive:false});
  oc.addEventListener('touchmove',e=>{e.preventDefault();draw(e);},{passive:false});
  oc.addEventListener('touchend',endDraw);
  document.addEventListener('keydown',e=>{
    if(!active)return;
    if(e.ctrlKey&&e.key==='z'){e.preventDefault();document.getElementById('ovUndoBtn').click();}
    if(e.ctrlKey&&e.key==='y'){e.preventDefault();document.getElementById('ovRedoBtn').click();}
    if(e.key==='Escape')close();
  });
})();
</script>
</body>
</html>
