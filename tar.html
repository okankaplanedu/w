    <title>Tarot Card Reading</title>
    <link href="https://fonts.googleapis.com/css2?family=Luxurious+Roman&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #eeeeee;
			background-image:url(tarot/zemin31.jpg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: "Luxurious Roman", serif;
        }
        #tarot-container {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .card {
            width: 270px;
            height: 490px;
            background-color: #fff;
            border: 2px solid #333;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            position: relative;
            perspective: 1000px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: transform 1s ease;
			margin-top:-50px;
			 transform-style: preserve-3d;
    transform-origin: center center;
    transition: transform 1s ease; /* Animasyonun hızı burada ayarlanır */
        }
        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: rotateZ(0deg);
            transition: transform 1s ease;
        }
        .card.reversed img {
            transform: rotateZ(180deg);
        }
        #controls {
            margin-top: 20px;
        }
        textarea {
            margin-top: 20px;
            width: 500px;
            height: 80px;
            border: 1px solid #333;
            padding: 10px;
            background-color: #fff;
            font-family: "Luxurious Roman", serif;
            font-size: 16px;
            display: block;
        }
        select, input[type="range"] {
            margin: 5px;
        }
        #speech-controls {
            display: none;
        }
        .hidden {
            display: none;
        }
		
		
.card.flip-180 {
    transform: rotateY(180deg);
}

.card.flip-360 {
    transform: rotateY(360deg);
}
    </style>

        const isReversed = Math.random() > 0.5;
        const cardImage = card.querySelector('img');

        cardImage.src = randomCard.image;
        card.classList.toggle('reversed', isReversed);

        const cardText = isReversed ? randomCard.reversed : randomCard.upright;
        selectedCards.push({ card: randomCard, isReversed });

        // Kimlik numarası için kombinasyon oluşturma (deste sıra numarası ve duruş)
        const position = isReversed ? 'R' : 'U';
        combination += `${originalIndex + 1}${position}`;
        
        // Details kısmı için sırayı 1, 2, 3 şeklinde ekleyin
        details.push(`${index + 1}. ${randomCard.name} (${isReversed ? 'Reversed' : 'Upright'})`);
        interpretations.push(`${index + 1}. ${cardText}`);
    });

    const fullText = [
	`id: ${combination}`,
        ...details,
        '',
        ...interpretations,
        '',
        'Final Interpretation:',
        `This combination suggests that ${interpretations.join(', ')}.`
    ].join('\n');

    // Kimlik numarasını div içine ekleme
    document.getElementById('kimlik').textContent = combination;

    // Details kısmına kimlik numarasını ekleme
    document.getElementById('details').value = fullText;
}




        function showReady() {
            document.querySelectorAll('.card').forEach(card => {
                const cardImage = card.querySelector('img');
                cardImage.src = '';  
            });
            document.getElementById('details').classList.add('hidden');  
            document.getElementById('tarot-container').classList.add('hidden');  
            document.getElementById('speech-controls').classList.remove('hidden');  
        }

        function startReading() {
            if (!isReading) {
                document.getElementById('tarot-container').classList.remove('hidden'); 
                document.getElementById('details').classList.remove('hidden');  
                document.getElementById('speech-controls').classList.remove('hidden');  
                
                const cardElements = document.querySelectorAll('.card');
                
                cardElements.forEach((card, index) => {
                    setTimeout(() => {
                        const selectedCard = selectedCards[index];
                        const cardImage = card.querySelector('img');
                        cardImage.src = selectedCard.card.image;
                        card.classList.toggle('reversed', selectedCard.isReversed);
                    }, 500 * index);  
                });

                isReading = true;
                const textContent = document.getElementById('details').value;
                speak(textContent, () => isReading = false);
            }
        }

        function speak(description, callback) {
            const languageSelect = document.getElementById('language');
            const selectedVoice = languageSelect.selectedOptions[0]?.value || null;
            const baseRate = parseFloat(document.getElementById('rate').value);
            const basePitch = parseFloat(document.getElementById('pitch').value);
            const chunkSize = 200; // Adjust this as needed
            const chunks = description.match(new RegExp(`.{1,${chunkSize}}(\\s|$)`, 'g')) || [];

            if (chunks.length === 0) {
                alert('Description is empty.');
                return;
            }

            let currentIndex = 0;

            const speakChunk = () => {
                if (currentIndex >= chunks.length) {
                    callback();
                    return;
                }

                utterance = new SpeechSynthesisUtterance(chunks[currentIndex]);
                const voices = speechSynthesis.getVoices();
                const voice = voices.find(voice => voice.name === selectedVoice);

                if (voice) utterance.voice = voice;
                utterance.volume = 1;
                utterance.rate = getRandomVariation(baseRate, 0.8, 1.1);
                utterance.pitch = getRandomVariation(basePitch, 0.3, 0.5);

                utterance.onend = () => {
                    currentIndex++;
                    setTimeout(speakChunk, Math.random() * 1100 + 900);
                };

                speechSynthesis.speak(utterance);
            };

            speakChunk();
        }

        function getRandomVariation(baseValue, min, max) {
            return baseValue * (Math.random() * (max - min) + min);
        }

        function populateVoices() {
            const synth = window.speechSynthesis;
            const voices = synth.getVoices();
            const languageSelect = document.getElementById('language');
            languageSelect.innerHTML = '';

            voices.forEach(voice => {
                if (voice.lang.startsWith('en')) {
                    const option = document.createElement('option');
                    option.value = voice.name;
                    option.textContent = `${voice.name} (${voice.lang})`;
                    languageSelect.appendChild(option);
                }
            });

            const enGbMaleVoice = voices.find(voice => voice.name.includes('Male') && voice.lang.includes('en-GB'));
            if (enGbMaleVoice) {
                languageSelect.value = enGbMaleVoice.name;
            } else if (languageSelect.options.length > 0) {
                languageSelect.selectedIndex = 0;
            }
        }

        function initSpeech() {
            populateVoices();
            speechSynthesis.onvoiceschanged = populateVoices;
        }

        function stopReading() {
            isReading = false;
            if (utterance) {
                speechSynthesis.cancel();
            }
        }

        window.onload = initSpeech;
    </script>
