<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Storyboard Pro | Studio 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=Unbounded:wght@900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --brutal-border: 4px solid #000; }
        
        * { box-sizing: border-box; }

        body {
            font-family: 'IBM Plex Mono', monospace;
            background-color: #000;
            color: #fff;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .b-border { border: var(--brutal-border); }
        .b-shadow { box-shadow: 6px 6px 0px #000; }
        .unbounded { font-family: 'Unbounded', sans-serif; text-transform: uppercase; }
        .hidden { display: none !important; }

        /* ── HEADER ── */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #000;
            border-bottom: 4px solid #facc15;
            padding: 0 20px;
            height: 60px;
            flex-shrink: 0;
            z-index: 200;
        }

        /* ── LAYOUT ── */
        #app-body {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ── OFF-CANVAS ── */
        .off-panel {
            width: 340px;
            height: 100%;
            transition: transform 0.3s, margin 0.3s;
            z-index: 100;
            flex-shrink: 0;
            overflow-y: auto;
            background: #0d0d0d;
            color: #fff;
        }
        #offcanvas-left  { border-right: 4px solid #facc15; }
        #offcanvas-right { border-left:  4px solid #facc15; }
        .off-panel.closed-l { transform: translateX(-340px); margin-right: -340px; }
        .off-panel.closed-r { transform: translateX(340px);  margin-left: -340px; }

        /* ── MAIN CONTENT ── */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background: #000;
            border-bottom: 4px solid #facc15;
            flex-shrink: 0;
            gap: 10px;
        }

        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .workspace-left {
            flex: 1;
            overflow-y: auto;
            background: #1a1a1a;
            padding: 16px;
        }

        /* ── PREVIEW PANEL ── */
        #preview-panel {
            width: 380px;
            flex-shrink: 0;
            background: #0d0d0d;
            border-left: 4px solid #facc15;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            gap: 12px;
        }

        #scene-panel {
            width: 100%;
            aspect-ratio: 9/16;
            border: 4px solid #facc15;
            box-shadow: -6px 6px 0px #333;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            background: #000;
        }

        #music-progress {
            position: absolute;
            bottom: 0; left: 0;
            height: 8px;
            background: #facc15;
            width: 0%;
            z-index: 40;
            border-top: 2px solid black;
            transition: width 0.1s linear;
        }

        /* ── TABS ── */
        .nav-tab {
            padding: 10px 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
            border: 2px solid transparent;
            font-family: 'IBM Plex Mono', monospace;
            background: #111;
            color: #999;
            transition: 0.15s;
        }
        .nav-tab.active {
            background: #facc15;
            color: #000;
            border-color: #000;
            box-shadow: 3px 3px 0 #000;
        }
        .tab-panel { height: 100%; width: 100%; }

        /* ── GRID ── */
        #album-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            padding: 4px;
        }

        .grid-item {
            background: #111;
            border: 2px solid #333;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: all 0.15s;
            aspect-ratio: 1;
        }
        .grid-item:hover {
            border-color: #facc15;
            box-shadow: 4px 4px 0 #facc15;
            transform: translate(-2px, -2px);
            z-index: 5;
        }
        .grid-item img { width: 100%; height: 100%; object-fit: cover; }
        .grid-num {
            position: absolute; top: 4px; left: 4px;
            background: #facc15; color: #000;
            font-weight: 900; font-size: 9px;
            padding: 2px 5px; z-index: 5;
            border: 1px solid #000;
        }

        /* ── EDITABLE TITLE ── */
        #editable-title {
            background: #facc15; color: #000;
            padding: 6px 20px; font-weight: 900;
            font-size: clamp(10px, 1.1vw, 16px);
            font-family: 'Unbounded', sans-serif;
            text-transform: uppercase;
            clip-path: polygon(3% 0%, 100% 0%, 97% 100%, 0% 100%);
            white-space: nowrap; overflow: hidden;
            outline: none; caret-color: #000;
            min-width: 200px; text-align: center;
        }

        /* ── CONTENTEDITABLE DERS / UYGULAMA ── */
        .plain-editor {
            width: 100%; min-height: 300px;
            background: #111; color: #fff;
            border: 2px solid #333;
            padding: 16px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px; line-height: 1.8;
            outline: none; resize: none;
            white-space: pre-wrap;
        }
        .plain-editor:focus { border-color: #facc15; }
        .plain-editor[placeholder]:empty::before {
            content: attr(placeholder);
            color: #555;
        }

        /* ── TOGGLE SWITCH ── */
        .switch { position: relative; display: inline-block; width: 50px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top:0; left:0; right:0; bottom:0; background:#333; transition:.3s; border: 2px solid #555; }
        .slider:before { position:absolute; content:""; height:16px; width:16px; left:2px; bottom:2px; background:#fff; transition:.3s; }
        input:checked + .slider { background: #facc15; border-color: #facc15; }
        input:checked + .slider:before { transform: translateX(24px); background:#000; }

        /* ── ARCHIVE CARDS ── */
        .archive-card {
            border: 2px solid #333; padding: 14px; margin-bottom: 10px;
            cursor: pointer; position: relative; transition: 0.2s;
            background: #111;
        }
        .archive-card:hover { border-color: #facc15; transform: translate(-3px,-3px); box-shadow: 5px 5px 0 #facc15; }
        .archive-card h4 { font-weight: 900; font-size: 12px; text-transform: uppercase; margin: 0 0 4px; color: #facc15; }
        .archive-card p { font-size: 10px; color: #888; margin: 0; }
        .del-btn {
            position: absolute; top: 8px; right: 8px;
            background: transparent; border: none; color: #f87171;
            cursor: pointer; padding: 2px;
        }
        .del-btn:hover { color: #ef4444; }

        /* ── NAMES SECTION ── */
        #names-section {
            margin-top: 16px; padding: 12px;
            background: #111; border: 3px solid #facc15;
            box-shadow: 4px 4px 0 #facc15;
        }
        .section-label {
            font-family: 'Unbounded', sans-serif; font-size: 9px;
            font-weight: 900; color: #facc15; text-transform: uppercase;
            letter-spacing: 2px; margin-bottom: 8px;
            display: flex; align-items: center; justify-content: space-between;
        }
        #image-names-textarea {
            width: 100%; background: #000; color: #facc15;
            border: 2px solid #333; font-family: 'IBM Plex Mono', monospace;
            font-size: 9px; line-height: 1.6; padding: 8px;
            resize: none; height: 90px; outline: none; overflow-y: auto; word-break: break-all;
        }
        #image-names-textarea:focus { border-color: #facc15; }
        #copy-names-btn {
            width: 100%; margin-top: 8px; background: #000; color: #facc15;
            border: 2px solid #facc15; font-family: 'IBM Plex Mono', monospace;
            font-size: 10px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1px; padding: 8px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 6px; transition: all 0.15s;
        }
        #copy-names-btn:hover { background: #facc15; color: #000; box-shadow: 3px 3px 0 #fff; }
        #copy-names-btn.copied { background: #22c55e; color: #000; border-color: #22c55e; }

        /* ── KEN BURNS ── */
        @keyframes kb1 { 0%{transform:scale(1.0) translate(0%,0%)}   100%{transform:scale(1.3) translate(4%,4%)} }
        @keyframes kb2 { 0%{transform:scale(1.3) translate(0%,0%)}   100%{transform:scale(1.0) translate(-4%,-4%)} }
        @keyframes kb3 { 0%{transform:scale(1.1) translate(-3%,2%)}  100%{transform:scale(1.25) translate(3%,-2%)} }
        @keyframes kb4 { 0%{transform:scale(1.2) translate(5%,0%)}   100%{transform:scale(1.1) translate(-5%,0%)} }
        @keyframes kb5 { 0%{transform:scale(1.0) translate(0%,3%)}   100%{transform:scale(1.2) translate(0%,-3%)} }
        .kb1 { animation: kb1 14s ease-in-out infinite alternate; }
        .kb2 { animation: kb2 16s ease-in-out infinite alternate; }
        .kb3 { animation: kb3 11s ease-in-out infinite alternate; }
        .kb4 { animation: kb4 19s ease-in-out infinite alternate; }
        .kb5 { animation: kb5 13s ease-in-out infinite alternate; }

        .swiper-slide { background:#000; overflow:hidden; position:relative; }
        .kb-img {
            position: absolute; inset: -15%;
            width: 130%; height: 130%;
            background-size: cover; background-position: center;
            will-change: transform;
        }

        /* ── SUBTITLE ── */
        #subtitle-bar {
            width: 100%;
            background: #facc15; color: #000;
            font-family: 'Unbounded', sans-serif;
            font-weight: 900; font-size: clamp(9px, 1vw, 14px);
            text-transform: uppercase; text-align: center;
            padding: 8px 16px; outline: none; caret-color: #000;
            clip-path: polygon(2% 0%, 100% 0%, 98% 100%, 0% 100%);
            white-space: nowrap; overflow: hidden;
        }

        /* ── BUTTONS ── */
        .btn-primary {
            width: 100%; padding: 12px; font-weight: 900;
            font-family: 'IBM Plex Mono', monospace;
            text-transform: uppercase; font-size: 12px;
            border: 3px solid #000; cursor: pointer; transition: 0.1s;
        }
        .btn-primary:active { transform: translate(2px,2px); box-shadow: none !important; }

        /* ── NOTIFICATION ── */
        #notif {
            position: fixed; bottom: 20px; right: 20px;
            background: #22c55e; color: #000;
            font-family: 'IBM Plex Mono', monospace; font-weight: 700;
            font-size: 12px; padding: 12px 20px;
            border: 3px solid #000; box-shadow: 4px 4px 0 #000;
            z-index: 9999; display: none;
        }
        #notif.error { background: #ef4444; color: #fff; }
    </style>
</head>
<body>

<!-- ═══════════════════════════ APP BODY ═══════════════════════════ -->
<div id="app-body">

<script>
// ═══════════════════════════════════════════
//   GLOBALS
// ═══════════════════════════════════════════
lucide.createIcons();

let db        = null;
let sMain     = null;
let allFiles  = new Map();
let currentImageBlobs = [];
let currentImageNames = [];
let isPlaying = false;

const player            = document.getElementById('audio-player');
const autoScrollToggle  = document.getElementById('auto-scroll-toggle');

// ─── BUILD INITIAL GRID ───
(function buildGrid() {
    const g = document.getElementById('album-grid');
    for (let i = 1; i <= 36; i++) {
        const d = document.createElement('div');
        d.className = 'grid-item';
        d.innerHTML = `<span class="grid-num">${i}</span>`;
        d.onclick = () => jumpToSlide(i - 1);
        g.appendChild(d);
    }
})();

// ═══════════════════════════════════════════
//   INDEXEDDB  —  robust open + CRUD
// ═══════════════════════════════════════════
function openDB() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open('StudioArchiveDB', 2);

        req.onupgradeneeded = (e) => {
            const database = e.target.result;
            if (!database.objectStoreNames.contains('projects')) {
                database.createObjectStore('projects', { keyPath: 'id', autoIncrement: true });
            }
        };

        req.onsuccess = (e) => {
            resolve(e.target.result);
        };

        req.onerror = (e) => {
            console.error('IndexedDB open error:', e.target.error);
            reject(e.target.error);
        };

        req.onblocked = () => {
            console.warn('IndexedDB blocked — please close other tabs');
        };
    });
}

async function dbAdd(record) {
    return new Promise((resolve, reject) => {
        const tx    = db.transaction('projects', 'readwrite');
        const store = tx.objectStore('projects');
        const req   = store.add(record);
        req.onsuccess = () => resolve(req.result);
        req.onerror   = (e) => reject(e.target.error);
        tx.onerror    = (e) => reject(e.target.error);
    });
}

async function dbGetAll() {
    return new Promise((resolve, reject) => {
        const tx      = db.transaction('projects', 'readonly');
        const store   = tx.objectStore('projects');
        const results = [];
        const cursor  = store.openCursor(null, 'prev');

        cursor.onsuccess = (e) => {
            const c = e.target.result;
            if (c) { results.push(c.value); c.continue(); }
            else   { resolve(results); }
        };
        cursor.onerror = (e) => reject(e.target.error);
    });
}

async function dbDelete(id) {
    return new Promise((resolve, reject) => {
        const tx  = db.transaction('projects', 'readwrite');
        const req = tx.objectStore('projects').delete(id);
        req.onsuccess = () => resolve();
        req.onerror   = (e) => reject(e.target.error);
    });
}

// ─── INIT ───
(async () => {
    try {
        db = await openDB();
        notify('Veritabanı hazır ✓', 'success');
        loadArchive();
    } catch (err) {
        notify('DB Hatası: ' + err.message, 'error');
    }
})();

// ═══════════════════════════════════════════
//   SAVE
// ═══════════════════════════════════════════
async function saveToIndexedDB() {
    if (!db)                           return notify('Veritabanı hazır değil!', 'error');
    if (currentImageBlobs.length < 36) return notify('Hata: Önce 36 görsel yükleyin!', 'error');

    const titleEl = document.getElementById('editable-title');
    let projectName = prompt('Proje Adı Giriniz:', titleEl.innerText.trim() || 'Yeni Proje');
    if (!projectName || !projectName.trim()) return;

    // Blob'ları ArrayBuffer'a çevir (serializable)
    notify('Kaydediliyor...', 'info');

    try {
        const imageBuffers = await Promise.all(
            currentImageBlobs.map(b => b.arrayBuffer())
        );
        const imageMimes = currentImageBlobs.map(b => b.type || 'image/jpeg');

        const record = {
            title      : projectName.trim(),
            date       : new Date().toLocaleString('tr-TR'),
            imageBuffers,
            imageMimes,
            imageNames : currentImageNames,
            senaryo    : document.getElementById('editor-senaryo').innerText,
            hikaye     : document.getElementById('editor-hikaye').innerText,
            subtitle   : document.getElementById('subtitle-bar').innerText,
        };

        await dbAdd(record);
        notify('Arşive Kaydedildi! ✓', 'success');
        loadArchive();
    } catch (err) {
        console.error(err);
        notify('Kayıt Hatası: ' + err.message, 'error');
    }
}

// ═══════════════════════════════════════════
//   LOAD ARCHIVE LIST
// ═══════════════════════════════════════════
async function loadArchive() {
    if (!db) return;
    const list = document.getElementById('db-list');
    list.innerHTML = '';

    try {
        const records = await dbGetAll();

        if (records.length === 0) {
            list.innerHTML = '<p style="color:#555; font-size:11px; text-align:center; margin-top:20px;">Henüz kayıtlı proje yok.</p>';
            return;
        }

        records.forEach(data => {
            const card = document.createElement('div');
            card.className = 'archive-card';
            card.innerHTML = `
                <h4>${escapeHTML(data.title)}</h4>
                <p>${escapeHTML(data.date)} &nbsp;·&nbsp; ${(data.imageBuffers || []).length} görsel</p>
                <button class="del-btn" title="Sil">
                    <i data-lucide="trash-2" style="width:14px;height:14px;"></i>
                </button>
            `;
            card.querySelector('.del-btn').addEventListener('click', async (e) => {
                e.stopPropagation();
                if (confirm(`"${data.title}" silinsin mi?`)) {
                    try {
                        await dbDelete(data.id);
                        notify('Silindi ✓', 'success');
                        loadArchive();
                    } catch (err) {
                        notify('Silme Hatası: ' + err.message, 'error');
                    }
                }
            });
            card.addEventListener('click', () => restoreProject(data));
            list.appendChild(card);
        });

        lucide.createIcons();
    } catch (err) {
        console.error(err);
        list.innerHTML = `<p style="color:#f87171; font-size:11px;">Arşiv yüklenemedi: ${err.message}</p>`;
    }
}

// ═══════════════════════════════════════════
//   RESTORE PROJECT
// ═══════════════════════════════════════════
function restoreProject(data) {
    document.getElementById('editable-title').innerText = data.title || '';

    if (data.subtitle) {
        document.getElementById('subtitle-bar').innerText = data.subtitle;
    }

    // ArrayBuffer → Blob
    const blobs = (data.imageBuffers || []).map((buf, i) =>
        new Blob([buf], { type: data.imageMimes?.[i] || 'image/jpeg' })
    );

    currentImageBlobs = blobs;
    currentImageNames = data.imageNames || [];

    renderImages(blobs);
    if (currentImageNames.length) updateNamesTextarea(currentImageNames);

    document.getElementById('editor-senaryo').innerText = data.senaryo || '';
    document.getElementById('editor-hikaye').innerText  = data.hikaye  || '';

    toggleR();
    notify(`"${data.title}" geri yüklendi ✓`, 'success');
}

// ═══════════════════════════════════════════
//   FILE INPUTS
// ═══════════════════════════════════════════
document.getElementById('folder-input').addEventListener('change', (e) => {
    const files = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));
    if (files.length < 36) return notify('Lütfen en az 36 adet görsel seçin!', 'error');
    allFiles.clear();
    files.forEach(f => allFiles.set(f.name, f));
    shuffleAndReset();
});

document.getElementById('music-input').addEventListener('change', (e) => {
    if (e.target.files[0]) {
        player.src = URL.createObjectURL(e.target.files[0]);
        player.load();
        notify('Müzik Yüklendi ✓', 'success');
    }
});

// ═══════════════════════════════════════════
//   SHUFFLE
// ═══════════════════════════════════════════
function shuffleAndReset() {
    if (allFiles.size === 0) return notify('Önce görsel yükleyin!', 'error');
    const names = Array.from(allFiles.keys())
        .sort(() => 0.5 - Math.random())
        .slice(0, 36);
    currentImageBlobs = names.map(n => allFiles.get(n));
    currentImageNames = names;
    renderImages(currentImageBlobs);
    updateNamesTextarea(names);
}

// ═══════════════════════════════════════════
//   RENDER IMAGES
// ═══════════════════════════════════════════
function renderImages(blobs) {
    const gridItems = document.querySelectorAll('.grid-item');
    const slides    = document.getElementById('video-slides');

    if (window._currentURLs) {
        window._currentURLs.forEach(u => URL.revokeObjectURL(u));
    }
    window._currentURLs = [];
    slides.innerHTML = '';

    const KB = ['kb1','kb2','kb3','kb4','kb5'];

    blobs.forEach((blob, i) => {
        const url = URL.createObjectURL(blob);
        window._currentURLs.push(url);

        if (gridItems[i]) {
            gridItems[i].innerHTML = `
                <span class="grid-num">${i + 1}</span>
                <img src="${url}" alt="${i + 1}">
            `;
            gridItems[i].onclick = () => jumpToSlide(i);
        }

        const kbClass = KB[i % KB.length];
        const delay   = -(Math.random() * 10).toFixed(1);
        const slide   = document.createElement('div');
        slide.className = 'swiper-slide';
        slide.innerHTML = `<div class="kb-img ${kbClass}" style="background-image:url('${url}'); animation-delay:${delay}s;"></div>`;
        slides.appendChild(slide);
    });

    if (sMain) { sMain.destroy(true, true); sMain = null; }
    sMain = new Swiper('.s-main', {
        effect: 'fade',
        allowTouchMove: true,
        speed: 1200,
        observer: true,
        observeParents: true
    });

    window.totalSlides = blobs.length;
}

function jumpToSlide(i) { if (sMain) sMain.slideTo(i); }

// ═══════════════════════════════════════════
//   PLAYBACK
// ═══════════════════════════════════════════
let playInterval = null;

function togglePlayback() {
    if (!currentImageBlobs.length) return notify('Görseller eksik!', 'error');
    if (!player.src || player.src === window.location.href) return notify('Lütfen önce bir müzik dosyası yükleyin!', 'error');

    isPlaying = !isPlaying;
    updateUI(isPlaying);

    if (isPlaying) {
        player.play();
        playInterval = setInterval(() => {
            if (!isPlaying || player.ended) {
                clearInterval(playInterval);
                isPlaying = false;
                player.currentTime = 0;
                document.getElementById('music-progress').style.width = '0%';
                updateUI(false);
                return;
            }
            const progress = player.currentTime / player.duration;
            document.getElementById('music-progress').style.width = (progress * 100) + '%';

            if (autoScrollToggle.checked && sMain) {
                const idx = Math.floor(progress * currentImageBlobs.length);
                if (sMain.activeIndex !== idx && idx < currentImageBlobs.length) {
                    sMain.slideTo(idx);
                }
            }
        }, 100);
    } else {
        player.pause();
        player.currentTime = 0;
        document.getElementById('music-progress').style.width = '0%';
        if (playInterval) clearInterval(playInterval);
    }
}

function updateUI(playing) {
    const b1 = document.getElementById('prod-btn');
    const b2 = document.getElementById('prod-btn2');
    if (playing) {
        if (b1) { b1.innerText = '⏹ DURDUR'; b1.style.background = '#ef4444'; }
        if (b2) { b2.innerText = '⏹ DURDUR'; b2.style.background = '#ef4444'; }
    } else {
        if (b1) { b1.innerText = '▶ OYNAT'; b1.style.background = '#22c55e'; }
        if (b2) { b2.innerText = '▶ OYNAT'; b2.style.background = '#22c55e'; }
    }
}

// ═══════════════════════════════════════════
//   NAMES TEXTAREA
// ═══════════════════════════════════════════
function updateNamesTextarea(names) {
    const ta  = document.getElementById('image-names-textarea');
    const cnt = document.getElementById('names-count');
    const clean = names.map(n => n.replace(/\.[^/.]+$/, ''));
    ta.value       = clean.join(' - ');
    cnt.textContent = clean.length + ' / 36';
}

function copyImageNames() {
    const ta  = document.getElementById('image-names-textarea');
    const btn = document.getElementById('copy-names-btn');
    if (!ta.value) return;
    navigator.clipboard.writeText(ta.value).then(() => {
        btn.classList.add('copied');
        btn.innerHTML = '<i data-lucide="check" style="width:12px;height:12px;"></i> KOPYALANDI!';
        lucide.createIcons();
        setTimeout(() => {
            btn.classList.remove('copied');
            btn.innerHTML = '<i data-lucide="copy" style="width:12px;height:12px;"></i> İSİMLERİ KOPYALA';
            lucide.createIcons();
        }, 2000);
    }).catch(() => {
        ta.select(); document.execCommand('copy');
    });
}

// ═══════════════════════════════════════════
//   PANEL TOGGLES
// ═══════════════════════════════════════════
function toggleL() { document.getElementById('offcanvas-left').classList.toggle('closed-l'); }
function toggleR() {
    document.getElementById('offcanvas-right').classList.toggle('closed-r');
    loadArchive();
}

function switchTab(t) {
    document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(el => el.classList.add('hidden'));
    document.getElementById('tab-' + t).classList.add('active');
    document.getElementById('panel-' + t).classList.remove('hidden');
}

// ═══════════════════════════════════════════
//   NOTIFICATION
// ═══════════════════════════════════════════
let notifTimer = null;
function notify(msg, type = 'success') {
    const el = document.getElementById('notif');
    el.textContent = msg;
    el.className = type === 'error' ? 'error' : '';
    if (type === 'info') el.style.background = '#3b82f6';
    else if (type === 'error') el.style.background = '#ef4444';
    else el.style.background = '#22c55e';
    el.style.color = '#fff';
    el.style.display = 'block';
    if (notifTimer) clearTimeout(notifTimer);
    notifTimer = setTimeout(() => { el.style.display = 'none'; }, 3000);
}

// ═══════════════════════════════════════════
//   HELPERS
// ═══════════════════════════════════════════
function escapeHTML(str) {
    return String(str)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;');
}
