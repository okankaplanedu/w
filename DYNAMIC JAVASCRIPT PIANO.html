<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>🎹 OKAN KAPLAN 2026 | DYNAMIC JAVASCRIPT PIANO</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.39/Tone.js"></script>

<style>
body{font-family:Arial;background:#eef;padding:20px}
button{
 padding:8px 16px;margin:6px;border:none;border-radius:6px;
 background:#3f51b5;color:#fff;font-weight:bold;cursor:pointer
}
button:hover{background:#283593}

#keyboard{position:relative;height:180px;margin-top:30px}
.key{
 position:absolute;bottom:0;
 display:flex;align-items:flex-end;justify-content:center;
 font-size:10px;pointer-events:none;
 border-radius:0 0 6px 6px;
}
.white{width:44px;height:180px;background:#fff;border:1px solid #333}
.black{width:28px;height:110px;background:#111;color:#fff;margin-left:-14px;z-index:2;top:0}
.white.active{background:#ffee58}
.black.active{background:#ff7043}
</style>
</head>

<body>

<h2>🎹 OKAN KAPLAN 2026 | DYNAMIC JAVASCRIPT PIANO</h2>
<button id="play">▶️ Başlat</button>
<button id="stop">⏹ Durdur</button>

<div id="keyboard"></div>

<script>
document.addEventListener("DOMContentLoaded",()=>{

// MAKAM
const makam=[
 "C3","D3","E3","F3","G3","A3","B3",
 "C4","D4","E4","F4","G4","A4","B4",
 "C5","D5","E5","F5","G5","A5","B5"
];

const noteMs=180;
let playing=false;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const rand=a=>a[Math.floor(Math.random()*a.length)];

// SES
const piano=new Tone.Sampler({
 urls:Object.fromEntries(makam.map(n=>[n,n+".mp3"])),
 baseUrl:"https://gleitz.github.io/midi-js-soundfonts/FluidR3_GM/acoustic_grand_piano-mp3/",
 release:9
}).toDestination();

// KLAVYE
const keyboard=document.getElementById("keyboard");
const white=["C","D","E","F","G","A","B"];
const black={"C":"C#","D":"D#","F":"F#","G":"G#","A":"A#"};
let x=0;

function addKey(note,isBlack){
 const k=document.createElement("div");
 k.className=`key ${isBlack?"black":"white"}`;
 k.dataset.note=note;
 k.textContent=note;
 k.style.left=x+"px";
 if(!isBlack) x+=44;
 keyboard.appendChild(k);
}

for(let o=3;o<=5;o++){
 for(const w of white){
  addKey(w+o,false);
  if(black[w]) addKey(black[w]+o,true);
 }
}

function flash(note,dur){
 const k=document.querySelector(`[data-note="${note}"]`);
 if(!k) return;
 k.classList.add("active");
 setTimeout(()=>k.classList.remove("active"),dur);
}

function playNote(note,dur){
 piano.triggerAttack(note);
 flash(note,dur);
 setTimeout(()=>piano.triggerRelease(note),dur);
}

function playChord(notes,dur){
 piano.triggerAttack(notes);
 notes.forEach(n=>flash(n,dur));
 setTimeout(()=>piano.triggerRelease(notes),dur);
}

// TRIAD AKOR
function triadFrom(note){
 let i = makam.indexOf(note);
 if(i<0||i+4>=makam.length) return null;
 return [makam[i],makam[i+2],makam[i+4]];
}

// MOTİF ÜRETİCİ
function motif(center,len=3){
 let i = makam.indexOf(center);
 let m=[];
 for(let j=0;j<len;j++){
  const step=rand([-1,0,1]);
  const n=makam[Math.max(0,Math.min(makam.length-1,i+step))];
  m.push(n);
  i += step;
 }
 return m;
}

// MINI SOLO
function fillSolo(center){
 const seq=motif(center,3);
 seq.forEach((n,idx)=>playNote(n,noteMs*(idx+1)));
}

// UZUN DİZE MOTİFLİ
function genLongDize(){
 let len=18+Math.floor(Math.random()*6);
 let idx=Math.floor(Math.random()*makam.length);
 let d=[makam[idx]];
 for(let i=1;i<len;i++){
  const step=rand([-2,-1,0,1,2]);
  idx=Math.max(0,Math.min(makam.length-1,idx+step));
  d.push(makam[idx]);
 }
 return d;
}

// AKOR İLERLEMELERİ
const cadence=[[0,4,7],[5,9,12],[7,11,14],[0,4,7]]; // I-V-vi-I gibi
function playCadence(){
 cadence.forEach(chord=>{
  const notes=chord.map(i=>makam[i]||"C4");
  playChord(notes,noteMs*6);
 });
}

// ANA LOOP
async function loop(){
 while(playing){
  const dize=genLongDize();
  for(let i=0;i<dize.length;i++){
   if(i%4===0){
    const tri=triadFrom(dize[i]);
    if(tri) playChord(tri.map(n=>n.replace("4","3")),noteMs*4);
   }
   playNote(dize[i],noteMs*3);
   if(i%6===5) fillSolo(dize[i]);
   await wait(noteMs);
  }
  playCadence();
 }
}

// BUTONLAR
document.getElementById("play").onclick=async()=>{
 if(!playing){
  await Tone.start();
  playing=true;
  loop();
 }
};

document.getElementById("stop").onclick=()=>{
 playing=false;
 piano.releaseAll();
};

});
</script>

</body>
</html>
