/* ============================================================================
   OKAN KAPLAN 2026 · ORCHESTRA ULTRA FINAL v2
   theory.js — pitch, circle of fifths, scales/modes, chords, voice-leading, RNG
   ============================================================================ */
"use strict";
const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const FLAT_NAMES = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];
const midiName = (m, flats) => (flats ? FLAT_NAMES : NOTE_NAMES)[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1);
const midiHz = (m) => 440 * Math.pow(2, (m - 69) / 12);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const clamp01 = (x) => clamp(x, 0, 1);
const lerp = (a, b, t) => a + (b - a) * t;
const mod = (n, m) => ((n % m) + m) % m;

/* ---------------- deterministic RNG ---------------- */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash32(...parts) {
  let h = 2166136261 >>> 0;
  for (const p of parts) { const s = String(p); for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } h ^= 0x9e3779b9; h = Math.imul(h ^ (h >>> 13), 0x85ebca6b) >>> 0; }

}
const pick = (rng, arr) => arr[Math.floor(rng() * arr.length)];
function shuffle(rng, arr) { const x = arr.slice(); for (let i = x.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [x[i], x[j]] = [x[j], x[i]]; } return x; }

  let total = 0; for (const e of entries) total += Math.max(0, e[1]);
  if (total <= 0) return entries.length ? entries[Math.floor(rng() * entries.length)][0] : undefined;
  let r = rng() * total;
  for (const e of entries) { r -= Math.max(0, e[1]); if (r <= 0) return e[0]; }
  return entries[entries.length - 1][0];

/* ---------------- circle of fifths ---------------- */
const FIFTHS = [0, 7, 2, 9, 4, 11, 6, 1, 8, 3, 10, 5];                 // position on the circle -> pitch class (C G D A E B F# C# G# D# A# F)
const FIFTH_INDEX = pc => (mod(pc, 12) * 7) % 12;                       // pitch class -> position
const fifthsDistance = (a, b) => { const d = Math.abs(FIFTH_INDEX(a) - FIFTH_INDEX(b)); return Math.min(d, 12 - d); };

const fifthsSigned = (from, to) => { const d = mod(FIFTH_INDEX(to) - FIFTH_INDEX(from), 12); return d <= 6 ? d : d - 12; };
/* pitch-class interval consonance (0 = harsh) */
const CONSONANCE = [1, 0, .35, .8, .85, .7, .15, 1, .85, .8, .4, 0];

/* ---------------- scales / modes ---------------- */
const MODES = {
  ionian:        { iv: [0, 2, 4, 5, 7, 9, 11], color: 0.70, label: "İyonyen (Majör)" },
  dorian:        { iv: [0, 2, 3, 5, 7, 9, 10], color: 0.45, label: "Doryen" },
  phrygian:      { iv: [0, 1, 3, 5, 7, 8, 10], color: 0.20, label: "Frigyen" },
  lydian:        { iv: [0, 2, 4, 6, 7, 9, 11], color: 0.85, label: "Lidyen" },
  mixolydian:    { iv: [0, 2, 4, 5, 7, 9, 10], color: 0.60, label: "Miksolidyen" },
  aeolian:       { iv: [0, 2, 3, 5, 7, 8, 10], color: 0.30, label: "Aeolyen (Minör)" },
  harmonicMinor: { iv: [0, 2, 3, 5, 7, 8, 11], color: 0.25, label: "Armonik Minör" },
  melodicMinor:  { iv: [0, 2, 3, 5, 7, 9, 11], color: 0.40, label: "Melodik Minör" },
  lydianDom:     { iv: [0, 2, 4, 6, 7, 9, 10], color: 0.75, label: "Lidyen Dominant" },
  hungarianMinor:{ iv: [0, 2, 3, 6, 7, 8, 11], color: 0.15, label: "Macar Minörü" },
  doubleHarmonic:{ iv: [0, 1, 4, 5, 7, 8, 11], color: 0.10, label: "Çifte Armonik (Hicaz)" },
  neapolitanMin: { iv: [0, 1, 3, 5, 7, 8, 11], color: 0.18, label: "Napoliten Minör" },
  phrygianDom:   { iv: [0, 1, 4, 5, 7, 8, 10], color: 0.22, label: "Frigyen Dominant" },
  dorianB2:      { iv: [0, 1, 3, 5, 7, 9, 10], color: 0.35, label: "Doryen ♭2" },
  majorPent:     { iv: [0, 2, 4, 7, 9], color: 0.80, label: "Majör Pentatonik" },
  minorPent:     { iv: [0, 3, 5, 7, 10], color: 0.35, label: "Minör Pentatonik" },
};
const MODE_IDS = Object.keys(MODES);
const HEPTATONIC = MODE_IDS.filter(id => MODES[id].iv.length === 7 && MODES[id].iv.includes(7));
const isMinorish = iv => iv[2] === 3;
/* related keys (all expressed as {pc, mode}) */
function relatedKey(pc, modeId, relation) {
  const iv = MODES[modeId].iv, minor = isMinorish(iv);
  switch (relation) {
    case "dominant": return { pc: mod(pc + 7, 12), mode: modeId };
    case "subdominant": return { pc: mod(pc + 5, 12), mode: modeId };
    case "relative": return minor ? { pc: mod(pc + 3, 12), mode: "ionian" } : { pc: mod(pc + 9, 12), mode: "aeolian" };
    case "parallel": return { pc, mode: minor ? "ionian" : "aeolian" };
    case "mediantUp": return { pc: mod(pc + 4, 12), mode: minor ? "aeolian" : "ionian" };
    case "mediantDown": return { pc: mod(pc + 8, 12), mode: minor ? "aeolian" : "ionian" };
    case "neapolitan": return { pc: mod(pc + 1, 12), mode: "ionian" };
    case "supertonic": return { pc: mod(pc + 2, 12), mode: "dorian" };
    case "subtonic": return { pc: mod(pc + 10, 12), mode: minor ? "ionian" : "mixolydian" };
  }
  return { pc, mode: modeId };
}

/* ---------------- chords ---------------- */
const CHORD = {
  maj: [0, 4, 7], min: [0, 3, 7], dim: [0, 3, 6], aug: [0, 4, 8], sus2: [0, 2, 7], sus4: [0, 5, 7],
  maj7: [0, 4, 7, 11], min7: [0, 3, 7, 10], dom7: [0, 4, 7, 10], m7b5: [0, 3, 6, 10], dim7: [0, 3, 6, 9],
  mMaj7: [0, 3, 7, 11], maj9: [0, 4, 7, 11, 14], min9: [0, 3, 7, 10, 14], add9: [0, 4, 7, 14], madd9: [0, 3, 7, 14],
  maj6: [0, 4, 7, 9], min6: [0, 3, 7, 9], dom9: [0, 4, 7, 10, 14], quartal: [0, 5, 10], power: [0, 7],
};
const CHORD_SYMBOL = { maj: "", min: "m", dim: "°", aug: "+", sus2: "sus2", sus4: "sus4", maj7: "maj7", min7: "m7", dom7: "7", m7b5: "ø7", dim7: "°7", mMaj7: "m(maj7)", maj9: "maj9", min9: "m9", add9: "add9", madd9: "m(add9)", maj6: "6", min6: "m6", dom9: "9", quartal: "q", power: "5" };
const QUALITY_TENSION = { maj: 0, min: .08, sus2: .12, sus4: .15, maj7: .1, min7: .12, maj6: .06, min6: .14, add9: .1, madd9: .14, dom7: .3, dom9: .32, m7b5: .38, dim: .4, dim7: .45, aug: .42, mMaj7: .35, maj9: .12, min9: .16, quartal: .25, power: .05 };
const ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII"];

function triadQuality(iv, degree) {
  const n = iv.length; const r = iv[degree % n];
  const third = mod(iv[(degree + 2) % n] - r, 12), fifth = mod(iv[(degree + 4) % n] - r, 12), seventh = mod(iv[(degree + 6) % n] - r, 12);
  if (n !== 7) return { tri: "power", sev: "power", third, fifth, seventh };
  let tri = "maj";
  if (third === 3 && fifth === 7) tri = "min"; else if (third === 3 && fifth === 6) tri = "dim"; else if (third === 4 && fifth === 8) tri = "aug"; else if (third === 4 && fifth === 7) tri = "maj"; else tri = third === 3 ? "min" : "maj";
  let sev = tri;
  if (tri === "maj" && seventh === 11) sev = "maj7"; else if (tri === "maj" && seventh === 10) sev = "dom7";
  else if (tri === "min" && seventh === 10) sev = "min7"; else if (tri === "min" && seventh === 11) sev = "mMaj7";
  else if (tri === "dim" && seventh === 10) sev = "m7b5"; else if (tri === "dim" && seventh === 9) sev = "dim7";
  return { tri, sev, third, fifth, seventh };
}
function romanFor(degree, quality, iv) {
  if (degree < 0) return "?";
  const acc = iv.length === 7 ? (iv[degree] - [0, 2, 4, 5, 7, 9, 11][degree]) : 0;
  let r = ROMAN[degree % 7]; if (acc < 0) r = "♭" + r; if (acc > 0) r = "♯" + r;
  if (/^(min|dim|m7b5|dim7|min7|mMaj7|min9|madd9|min6)$/.test(quality)) r = r.toLowerCase();
  if (quality === "dim" || quality === "m7b5") r += "°"; if (quality === "aug") r += "+";
  if (/7|9/.test(quality)) r += quality.replace(/^(min|maj|dom|m7b5|dim7|mMaj7|madd|add)/, "") || "";
  return r;
}

/* voice leading: all candidate voicings sorted by cost (movement from prev + register + spread) */
function voiceLeadAll(pcs, prev, low, high, rng) {
  const size = pcs.length, candidates = [];
  const centre = prev && prev.length ? prev.reduce((a, b) => a + b, 0) / prev.length : (low + high) / 2;
  for (let inv = 0; inv < size; inv++) {
    const order = pcs.slice(inv).concat(pcs.slice(0, inv));
    for (let base = low; base <= high; base++) {
      if (mod(base, 12) !== order[0]) continue;
      const v = [base]; let ok = true;
      for (let i = 1; i < order.length; i++) { let n = v[i - 1] + mod(order[i] - v[i - 1], 12); if (n === v[i - 1]) n += 12; if (n > high + 7) { ok = false; break; } v.push(n); }
      if (!ok) continue;
      let cost = Math.abs((v.reduce((a, b) => a + b, 0) / v.length) - centre) * 0.6;
      if (prev && prev.length) for (const n of v) { let best = 99; for (const p of prev) best = Math.min(best, Math.abs(n - p)); cost += best; }
      if (v[v.length - 1] - v[0] > 19) cost += 4;
      candidates.push([v, cost + rng() * 0.8]);
    }
  }
  if (!candidates.length) candidates.push([pcs.map((pc, i) => low + mod(pc - low, 12) + (i ? 12 * Math.floor(i / 2) : 0)), 99]);
  candidates.sort((a, b) => a[1] - b[1]);
  return candidates.map(c => c[0]);
}
const voiceLead = (pcs, prev, low, high, rng) => voiceLeadAll(pcs, prev, low, high, rng)[0];

<script id="src-ledger">
/* ============================================================================
   ledger.js — persistent counters ("sayaçlar").
   Selection rule everywhere: LEAST-USED-FIRST, RANDOM AMONG TIES ("sayaç en
   azlarla random"). Every catalogue keeps a use count per element; a draw takes
   a random element among those with the minimal count (optionally excluding
   a small "recent" set). Time-interval rotation reshuffles tie order.
   Uniqueness sets remember composition signatures, progressions, cells,
   and complete key-journeys so nothing is produced twice.
   ============================================================================ */
"use strict";
const LEDGER_KEY = "OKAN KAPLAN 2026.orchestra-ultra.ledger.v2";
const ROTATE_EVERY_MS = 9 * 60 * 1000;

class Ledger {
  constructor(storage) {
    this.storage = storage || (typeof localStorage !== "undefined" ? localStorage : null);
    this.data = this._load(); this._saveTimer = 0;
    this._sets = { signatures: new Set(this.data.signatures), progressions: new Set(this.data.progressions), cells: new Set(this.data.cells), journeys: new Set(this.data.journeys) };
    this.rotSeed = hash32("rot", Date.now());
  }
  _blank() { return { v: 2, created: Date.now(), plays: 0, compositions: {}, dims: {}, chords: {}, progressions: [], cells: [], journeys: [], signatures: [], rotations: 0, lastRotation: Date.now(), totalSeconds: 0, redesigns: 0, evaluations: [] }; }
  _load() {
    try { const raw = this.storage && this.storage.getItem(LEDGER_KEY); if (raw) { const d = JSON.parse(raw); if (d && d.v === 2) return Object.assign(this._blank(), d); } } catch (e) { }
    return this._blank();
  }
  save(now) {
    if (!this.storage) return;
    if (now) { try { this.storage.setItem(LEDGER_KEY, JSON.stringify(this.data)); } catch (e) { } return; }
    if (this._saveTimer) return;
    this._saveTimer = setTimeout(() => { this._saveTimer = 0; this.save(true); }, 400);
  }
  reset() { this.data = this._blank(); this._sets = { signatures: new Set(), progressions: new Set(), cells: new Set(), journeys: new Set() }; this.save(true); }

  /* ---- least-used-first with random tie-break ---- */
  dim(name, n) {
    let d = this.data.dims[name];
    if (!d || d.n !== n) d = this.data.dims[name] = { n, counts: new Array(n).fill(0), recent: [], draws: 0 };
    return d;
  }
  draw(name, catalogue, rng, opts = {}) {
    const n = catalogue.length, d = this.dim(name, n); this.maybeRotate();
    const recentK = Math.min(opts.recent ?? Math.floor(n / 3), n - 1);
    const recent = new Set(d.recent.slice(-recentK)); const avoid = opts.avoid || new Set();
    let pool = [...Array(n).keys()].filter(i => !recent.has(i) && !avoid.has(i));
    if (!pool.length) pool = [...Array(n).keys()].filter(i => !avoid.has(i)); if (!pool.length) pool = [...Array(n).keys()];
    if (opts.weights) {                      // optional musical weighting on top of least-used: score = count - bonus
      let best = Infinity; const scored = pool.map(i => { const s = d.counts[i] - (opts.weights[i] || 0); if (s < best) best = s; return [i, s]; });
      pool = scored.filter(x => x[1] <= best + 1e-9).map(x => x[0]);
    } else {
      const min = Math.min(...pool.map(i => d.counts[i])); pool = pool.filter(i => d.counts[i] === min);
    }
    const r = rng || Math.random; const idx = pool[Math.floor(r() * pool.length)];
    d.counts[idx] += 1; d.draws += 1; d.recent.push(idx); if (d.recent.length > 64) d.recent.splice(0, 32);
    this.save(); return idx;
  }
  coverage(name, n) { const d = this.dim(name, n); const min = Math.min(...d.counts), max = Math.max(...d.counts); return { n, min, max, draws: d.draws, atMin: d.counts.filter(c => c === min).length, counts: d.counts.slice() }; }
  maybeRotate(force) {
    const now = Date.now();
    if (!force && now - this.data.lastRotation < ROTATE_EVERY_MS) return false;
    for (const d of Object.values(this.data.dims)) d.recent = [];        // forget recency → fresh tie order
    this.rotSeed = hash32("rot", now, this.data.rotations);
    this.data.rotations += 1; this.data.lastRotation = now; this.save(); return true;
  }
  msToRotation() { return Math.max(0, ROTATE_EVERY_MS - (Date.now() - this.data.lastRotation)); }

  /* ---- uniqueness ---- */
  _add(kind, h, cap, drop) { if (this._sets[kind].has(h)) return; this._sets[kind].add(h); this.data[kind].push(h); if (this.data[kind].length > cap) { const gone = this.data[kind].splice(0, drop); for (const g of gone) this._sets[kind].delete(g); } }
  hasSignature(s) { return this._sets.signatures.has(s); }  addSignature(s) { this._add("signatures", s, 6000, 1500); }
  hasProgression(h) { return this._sets.progressions.has(h); }  addProgression(h) { this._add("progressions", h, 8000, 2000); }
  hasCell(h) { return this._sets.cells.has(h); }  addCell(h) { this._add("cells", h, 12000, 3000); }
  hasJourney(h) { return this._sets.journeys.has(h); }  addJourney(h) { this._add("journeys", h, 4000, 1000); }
  countChord(name) { this.data.chords[name] = (this.data.chords[name] || 0) + 1; }
  topChords(n) { return Object.entries(this.data.chords).sort((a, b) => b[1] - a[1]).slice(0, n); }
  noteRedesign(n) { this.data.redesigns += n || 1; }
  noteEvaluation(ev) { this.data.evaluations.push(ev); if (this.data.evaluations.length > 200) this.data.evaluations.splice(0, 100); }
  registerPlay(dna, seconds) {
    this.data.plays += 1;
    this.data.compositions[dna.seedStr] = { n: (this.data.compositions[dna.seedStr]?.n || 0) + 1, at: Date.now(), key: dna.keyName, mode: dna.mode, form: dna.form.id, meter: dna.meter.label, palette: dna.palette.id, bpm: dna.bpm };
    this.data.totalSeconds += seconds || 0; this.addSignature(dna.signature); this.save(true);
  }
  summary() {
    const d = this.data;
    return { plays: d.plays, unique: Object.keys(d.compositions).length, rotations: d.rotations, progressions: d.progressions.length, cells: d.cells.length, journeys: d.journeys.length, chords: Object.keys(d.chords).length, totalSeconds: d.totalSeconds, msToRotation: this.msToRotation(), redesigns: d.redesigns, evaluations: d.evaluations.length };
  }
}

/* ============================================================================
   timemap.js — the orchestra's own clock. Replaces Tone.js Transport with an
   absolute, sample-accurate time map: per-beat durations carry phrase rubato,
   agogic accents, section ritenuti, a luftpause before the final chord and a
   fermata. Every event time is computed from (bar, beat) → seconds through
   cumulative integration, so tempo curves are exact, not tick-quantised.
   ============================================================================ */
"use strict";

  classical:     { amp: .016, agogic: .012, phraseEnd: .035, sectionEnd: .06,  wave: 0,    luft: .12 },
  romantic:      { amp: .045, agogic: .03,  phraseEnd: .09,  sectionEnd: .12,  wave: .01,  luft: .28 },
  cinematic:     { amp: .03,  agogic: .022, phraseEnd: .07,  sectionEnd: .16,  wave: .006, luft: .34 },
  baroque:       { amp: .007, agogic: .008, phraseEnd: .02,  sectionEnd: .05,  wave: 0,    luft: .08 },
  impressionist: { amp: .05,  agogic: .018, phraseEnd: .06,  sectionEnd: .1,   wave: .022, luft: .22 },

      const sec = secOf(b); const posInSec = sec ? b - sec.start : 0; const phrasePos = posInSec % 4;

      const phraseF = [1 + P.amp * .2, 1 - P.amp * .55, 1 - P.amp * .3, 1 + P.amp * .35][phrasePos];

<script id="src-critics">
/* ============================================================================
   critics.js — two evaluators.
   ConductorEar : reads the SCORE like a conductor (harmony, voice leading,
                  melody, balance per instrument family, phrasing, form arc,
                  breathing, silences). Scores 0-100 with per-criterion notes.
   ListenerEar  : listens to rendered AUDIO like a mastering engineer / audience
                  (loudness, crest, spectral balance, mud/harshness, stereo

"use strict";
class ConductorEar {
  evaluate(score) {
    const { events, sections, chordsByBar, bars, dna, tm } = score; const crit = {};
    const note = (k, s, msg) => { crit[k] = { score: Math.round(clamp01(s) * 100), msg }; };

    const failed = sections.filter(s => s.harmonyReport && !s.harmonyReport.pass); const issues = sections.flatMap(s => s.harmonyReport?.issues || []);

    for (const e of pads) (byVoice[e.voice] ||= []).push(e);

      const verdict = listener.analyse(buf, buf.sampleRate); status(`WAV indirildi · ${fmt(buf.duration)} · dinleyici ${verdict.total}/100 · ${verdict.lufs.toFixed(1)} LUFS`); toast("Eser 44.1 kHz / 16 bit WAV olarak indirildi.");

  }

  /* ---------------- wiring ---------------- */
  function wire() {
    $("fgPlay").onclick = play; $("fgStop").onclick = stop; $("fgNext").onclick = next; $("fgExport").onclick = exportWav;
    $("fgNew").onclick = () => { stop(); score = newPiece(); nextScore = null; renderDNA(score); status("Yeni DNA · " + score.title.sub + " · BAŞLAT"); };
    $("fgRotate").onclick = () => { ledger.maybeRotate(true); $("fgLedger").innerHTML = ledgerHTML(); toast("Sıra değişimi: tüm dizinlerde eşitlik sırası yeniden karıştırıldı."); };

    gain.value = state.gain; verb.value = state.reverb; auto.checked = state.auto; hrtf.checked = state.hrtf; smart.checked = state.smart;
    $("fgGainOut").textContent = state.gain.toFixed(2); $("fgReverbOut").textContent = state.reverb.toFixed(2);
    gain.oninput = () => { state.gain = +gain.value; $("fgGainOut").textContent = state.gain.toFixed(2); localStorage.setItem(KEY.gain, gain.value); player && player.setMaster(state.gain); };
    verb.oninput = () => { state.reverb = +verb.value; $("fgReverbOut").textContent = state.reverb.toFixed(2); localStorage.setItem(KEY.verb, verb.value); player && player.setReverb(state.reverb); };
    auto.onchange = () => { state.auto = auto.checked; localStorage.setItem(KEY.auto, auto.checked ? "1" : "0"); };
    hrtf.onchange = () => { state.hrtf = hrtf.checked; localStorage.setItem(KEY.hrtf, hrtf.checked ? "1" : "0"); toast("3D pan modeli bir sonraki başlatmada uygulanır."); };
    smart.onchange = () => { state.smart = smart.checked; localStorage.setItem(KEY.smart, smart.checked ? "1" : "0"); if (score) { score.listener = null; score.fix = null; renderCritics(score); } };
    document.addEventListener("keydown", e => { if (e.code === "Space" && e.target.tagName !== "INPUT") { e.preventDefault(); player && player.playing ? stop() : play(); } if (e.key === "n") next(); });
    setInterval(() => { if (ledger.maybeRotate()) toast("Zaman aralıklı sıra değişimi uygulandı."); }, 30000);
    const bankBytes = Object.values(files).reduce((a, b) => a + b.length, 0) * 3 / 4;
    $("fgBankInfo").textContent = `${Object.keys(manifest).length} enstrüman · ${Object.keys(files).length} örnek · ${(bankBytes / 1e6).toFixed(1)} MB gömülü · kapalı sistem`;

  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", wire); else wire();
  window.__orchestra = { get score() { return score; }, ledger, composer, arranger, conductor, listener, get player() { return player; }, get bank() { return bank; }, get irs() { return irs; }, play, stop, next, exportWav, newPiece, audition, state };
})();
