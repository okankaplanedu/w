<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HICAZ PRO - NEO EDITION</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.39/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffde59;
            --surface: #ffffff;
            --accent: #000000;
            --border: 3px solid #000;
            --shadow: 8px 8px 0px #000;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: var(--bg); 
            color: var(--accent); 
            font-family: 'Space Grotesk', sans-serif; 
            padding: 40px 20px; 
        }
        .container { max-width: 1200px; margin: 0 auto; }
        
        /* HEADER & CONTROLS */
        .controls { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 30px; }
        button {
            padding: 12px 24px;
            font-family: inherit;
            font-weight: 700;
            text-transform: uppercase;
            border: var(--border);
            background: var(--surface);
            box-shadow: 4px 4px 0px #000;
            cursor: pointer;
            transition: 0.1s;
        }
        button:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0px #000; }
        button:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px #000; }
        #stopBtn { background: #ff5c5c; }
        .preset-group { display: flex; gap: 10px; background: rgba(0,0,0,0.05); padding: 10px; border: var(--border); }

        /* PIANO */
        .piano-wrap { 
            background: var(--surface); 
            border: var(--border); 
            box-shadow: var(--shadow); 
            padding: 20px; 
            margin-bottom: 40px; 
            overflow-x: auto; 
        }
        .piano { position: relative; height: 160px; min-width: 1000px; }
        .key {
            position: absolute;
            border: 2px solid #000;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 10px;
            font-size: 10px;
            font-weight: 700;
            transition: 0.05s;
        }
        .white { width: 40px; height: 100%; background: #fff; z-index: 1; }
        .black { width: 26px; height: 60%; background: #000; color: #fff; z-index: 2; border-top: none; }
        .key.active { background: var(--bg) !important; color: #000; border-bottom: 8px solid #000; }

        /* OUTPUT */
        #output { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .kita { background: var(--surface); border: var(--border); padding: 20px; box-shadow: var(--shadow); }
        .kita h3 { background: #000; color: #fff; display: inline-block; padding: 0 10px; margin-bottom: 15px; text-transform: uppercase; }
        .dizeDiv { 
            background: #f0f0f0; 
            border: 1px solid #000; 
            margin-bottom: 8px; 
            padding: 10px; 
            font-size: 13px; 
            word-spacing: 5px;
        }
        .playing-line { border: 3px solid #000 !important; background: #fff !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <button id="startBtn">▶ START ENGINE</button>
        <button id="stopBtn">⏹ STOP</button>  
        <div class="preset-group">
            <button onclick="setPreset('mono')">Mono</button>
            <button onclick="setPreset('broadcast')">On-Air</button>
            <button onclick="setPreset('tape')">Tape</button>
            <button onclick="setPreset('epic')">© 2026 OKAN KAPLAN</button>
        </div>
    </div>

    <div class="piano-wrap">
        <div class="piano" id="piano"></div>
    </div>

    <div id="output"></div>
</div>

<script>
/* ---------- MAKAM ---------- */
const makamBase = [
  "D2","Eb2","G2","A2","Bb2","C3","D3","Eb3","G3","A3","Bb3","C4",
  "D4","Eb4","G4","A4","Bb4","C5","D5","Eb5","G5","A5","Bb5","C6"
];

function updateMakam() {
  const length = makamBase.length;
  const randomIndex = Math.floor(Math.random() * (length - 2));
  const selectedNotes = makamBase.splice(randomIndex, 3);
  makamBase.push(...selectedNotes);
}
setInterval(updateMakam, 3000);

/* ---------- PIANO GENERATOR ---------- */
function buildPiano() {
    const piano = document.getElementById("piano");
    const notes = ["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];
    let x = 0;
    for (let oct = 2; oct <= 7; oct++) {
        notes.forEach(n => {
            const isBlack = n.length > 1;
            const noteName = n + oct;
            const div = document.createElement("div");
            div.className = `key ${isBlack ? 'black' : 'white'}`;
            div.dataset.note = noteName;
            if (!isBlack) {
                div.style.left = x + "px";
                x += 40;
            } else {
                div.style.left = (x - 13) + "px";
            }
            div.innerHTML = `<span>${noteName}</span>`;
            piano.appendChild(div);
        });
    }
}
buildPiano();

function pianoOn(note) {
    const el = document.querySelector(`[data-note="${note}"]`);
    if(el) el.classList.add("active");
}
function pianoOff() {
    document.querySelectorAll(".key").forEach(k => k.classList.remove("active"));
}

/* ---------- HELPERS ---------- */
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]);

/* ---------- TRANSPOSE ---------- */
function transpose(note,step,makam){
    if(!note) return null;
    const i=makam.indexOf(note);
    if(i<0) return note;
    let ni=i+step;
    ni=Math.max(0,Math.min(makam.length-1,ni));
    return makam[ni];
}
// Nota → MIDI dönüşümü (C4 = 60)
function noteToMidi(note){
    const table = ["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];
    const name = note.slice(0, -1);
    const octave = parseInt(note.slice(-1));
    return table.indexOf(name) + (octave + 1) * 12;
}

// MakamBase kalın → ince sıralama
const makamSorted = makamBase.slice().sort((a,b) => noteToMidi(a) - noteToMidi(b));
/* ---------- MOTIF ---------- */
function motif(makam){
    const t=rand(-3,3);
    return Array.from({length:1}, () =>
        (Math.random()<0.15 ? null : transpose(makam[rand(0,makam.length-1)], t, makam))
    );
}
function motifSorted(makam){
    const t = rand(-3,3);
    let notes = Array.from({length:1}, () => 
        (Math.random()<0.45 ? null : transpose(makam[rand(0,makam.length-1)], t, makam))
    );
    // null değerleri sona alıp kalın → ince sıralama
    return notes.filter(n => n).sort((a,b) => noteToMidi(b) - noteToMidi(a))
                .concat(notes.filter(n => n === null));
}

function kita(m){return [motif(m),motif(m),motif(m)];}
function generateSong(){
    const m=shuffle([...makamBase]);
    return [kita(m),kita(m)];
}

/* ---------- MASTER ---------- */
const pan=new Tone.Panner(0).toDestination();
const delay=new Tone.PingPongDelay().connect(pan);
const reverb=new Tone.Reverb().connect(delay);
const eq=new Tone.EQ3().connect(reverb);
const comp=new Tone.Compressor().connect(eq);
const limiter=new Tone.Limiter(-1).connect(comp);

/* ---------- PIANO ---------- */
const piano=new Tone.Sampler({
    urls:Object.fromEntries(makamBase.map(n=>[n,n+".mp3"])),
    baseUrl:"https://gleitz.github.io/midi-js-soundfonts/FluidR3_GM/acoustic_grand_piano-mp3/"
}).connect(limiter);

/* ---------- PRESETS ---------- */
function setPreset(type){
    if(type==="mono"){pan.pan.value=0;delay.wet.value=0;reverb.wet.value=0;eq.low.value=-2;eq.mid.value=0;eq.high.value=2;comp.threshold.value=-22;comp.ratio.value=2.5;}
    if(type==="broadcast"){delay.wet.value=0.08;reverb.wet.value=0.15;eq.low.value=-4;eq.mid.value=1;eq.high.value=3;comp.threshold.value=-18;comp.ratio.value=4;}
    if(type==="tape"){delay.wet.value=0.12;reverb.wet.value=0.22;eq.mid.value=-1;eq.high.value=-2;comp.threshold.value=-20;comp.ratio.value=3;}
    if(type==="epic"){delay.wet.value=0.18;reverb.decay=4;reverb.wet.value=0.35;eq.low.value=3;eq.high.value=2;comp.threshold.value=-16;comp.ratio.value=3.5;}
}

/* ---------- PLAY (INTEGRATED PIANO) ---------- */
async function playLine(div){
    const baseDur=360;
    let last=null, count=0;

    const flush=async()=>{
        if(last){
            pianoOn(last);
            piano.triggerAttackRelease(last,`${count}m`);
            await new Promise(r=>setTimeout(r,baseDur*count));
            pianoOff();
        }
        last=null; count=0;
    };

    div.classList.add("playing-line");
    for(const n of div.notes){
        if(!playing) break;
        if(n && n===last){
            count++;
        }else{
            await flush();
            if(n){ last=n; count=1; }
            else { await new Promise(r=>setTimeout(r,baseDur)); }
        }
    }
    await flush();
    div.classList.remove("playing-line");
}

/* ---------- FORM ---------- */
async function playKita(k){
    const d=k.querySelectorAll(".dizeDiv");
    for(let r=0;r<2;r++){
        if(!playing) return;
        await playLine(d[0]);
        await playLine(d[1]);
        await playLine(d[0]);
        await playLine(d[1]);
        await playLine(d[2]);
    }
}

/* ---------- VISUAL ---------- */
let song=null,playing=false;
function draw(){
    const out=document.getElementById("output");
    out.innerHTML="";
    song.forEach((k,i)=>{
        const kd=document.createElement("div");
        kd.className="kita";
        kd.innerHTML=`<h3>Kıta ${i+1}</h3>`;
        k.forEach(line=>{
            const d=document.createElement("div");
            d.className="dizeDiv";
            d.notes=line;
            d.textContent=line.map(n=>n||"–").join(" ");
            kd.appendChild(d);
        });
        out.appendChild(kd);
    });
}

/* ---------- ARKA ARKAYA OKTAV SOLOLAR ---------- */
async function playOctaveSolo(direction = "up") {
    // direction: "up" = C→B (ince → kalın), "down" = B→C (kalın → ince)
    const baseNotes = direction === "up"
        ? ["C","D","E","F","G","A","B"]
        : ["B","A","G","F","E","D","C"];

    let octave = direction === "up" ? 3 : 7; // başlangıç oktavı
    const length = rand(4,8);
    const dur = 240;
    let noteIndex = 0;

    for(let i=0;i<length;i++){
        if(!playing) break;

        const noteName = baseNotes[noteIndex % baseNotes.length] + octave;
        pianoOn(noteName);
        piano.triggerAttackRelease(noteName, `${dur}ms`);
        await new Promise(r => setTimeout(r,dur));
        pianoOff();

        // noteIndex ve octave ayarı
        if(direction === "up") {
            noteIndex++;
            if(noteIndex % baseNotes.length === 0){
                octave++;
                if(octave > 3) octave = 2;
            }
        } else {
            noteIndex++;
            if(noteIndex % baseNotes.length === 0){
                octave--;
                if(octave < 2) octave = 3;
            }
        }
    }
}

/* ---------- LOOP ---------- */
async function loop(){
    while(playing){
        song = generateSong();
        draw();
        for(const k of document.querySelectorAll(".kita")){
            if(!playing) return;
            await playKita(k);
        }
        // %50 ihtimalle arka arkaya oktav sololar
        if(Math.random() < 0.1) await playOctaveSolo();
    }
}

/* ---------- CONTROLS ---------- */
document.getElementById("startBtn").onclick=async()=>{
    if(playing) return;
    await Tone.start();
    setPreset("mono");
    playing=true;
    loop();
};
document.getElementById("stopBtn").onclick=()=>{
    playing=false;
    pianoOff();
};
</script>
</body>
</html>
