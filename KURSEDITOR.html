<script>
const COURSE=${dataStr};const THEATERS=${thStr};const LINKS=${linksStr};
const flat=[];COURSE.modules.forEach(m=>m.lessons.forEach(l=>flat.push({m,l})));
let idx=0,mode='idle',playing=false,lineEls=[],charEls=[],capEls=[],revealed=-1,raf,timer,rate=1,fxOn=true,activeLine=null,linkReq=0,linkPending=null;const audio=new Audio();
let animTimer=null,animElapsed=0,animStarted=0,animPaused=true;const ANIM_CYCLE_MS=14000;
const nav=document.getElementById('nav');
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
var BRIDGE='<scr'+'ipt>(function(){function resolve(loc){try{if(!loc)return null;if(loc.type===\"sel\")return document.querySelector(loc.sel);if(loc.type===\"tag\"){var e=document.getElementsByTagName(loc.tag);return e[(loc.nth||1)-1]||e[0]||null}}catch(x){}return null}window.addEventListener(\"message\",function(ev){var d=ev.data;if(!d||d.__kb!==\"locate\")return;var el=resolve(d.loc),r=null,label=\"\";if(el){var b=el.getBoundingClientRect();r={x:b.left,y:b.top,w:b.width,h:b.height};label=\"<\"+el.tagName.toLowerCase()+(el.id?(\"#\"+el.id):(el.className&&typeof el.className===\"string\"&&el.className.trim()?(\".\"+el.className.trim().split(/\\\\s+/)[0]):\"\"))+\">\"}(ev.source||window.parent).postMessage({__kb:\"located\",id:d.id,rect:r,label:label,dw:document.documentElement.clientWidth,dh:document.documentElement.clientHeight},\"*\")})})();</scr'+'ipt>';
function doc(c){return '<!doctype html><html><head><meta charset=UTF-8><meta name=viewport content="width=device-width, initial-scale=1"><style>'+(c.css||'')+'</style></head><body>'+(c.html||'')+'<scr'+'ipt>'+(c.js||'')+'</scr'+'ipt>'+BRIDGE+'</body></html>'}
/* ---- VC ---- */
const VC={lines:[],max:400,unread:0,open:false,add(t,m){const d=new Date();const ts=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');this.lines.push({t:ts,type:t,msg:m});if(this.lines.length>this.max)this.lines.shift();if(!this.open)this.unread++;this.render()},info(m){this.add('info',m)},ok(m){this.add('ok',m)},warn(m){this.add('warn',m)},err(m){this.add('err',m)},code(m){this.add('code',m)},anim(m){this.add('anim',m)},tts(m){this.add('tts',m)},sim(m){this.add('sim',m)},render(){const b=document.getElementById('vcb');if(!b)return;b.innerHTML=this.lines.slice(-200).map(l=>'<div class="vcl '+l.type+'"><span class="t">'+l.t+'</span><span class="tg">'+l.type.toUpperCase()+'</span><span class="msg">'+esc(l.msg)+'</span></div>').join('');b.scrollTop=b.scrollHeight;const i=document.getElementById('vci');if(i){if(this.unread>0&&!this.open){i.classList.add('bdg');i.dataset.count=this.unread>99?'99+':this.unread}else i.classList.remove('bdg')}},toggle(f){this.open=typeof f==='boolean'?f:!this.open;const el=document.getElementById('vc');if(el)el.classList.toggle('open',this.open);if(this.open){this.unread=0;this.render()}},clear(){this.lines.length=0;this.unread=0;this.render()},copy(){const t=this.lines.map(l=>'['+l.t+'] '+l.type.toUpperCase()+'  '+l.msg).join('\\n');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.resolve()).then(()=>alert('Konsol kopyalandı'))}};
/* ---- SIM ---- */
function collectSIM(){const flat=[];COURSE.modules.forEach(m=>m.lessons.forEach(l=>flat.push({m,l})));const sim={generated:new Date().toISOString(),version:'KURS-BUILDER-SIM/1.0',meta:COURSE.meta,stats:{modules:COURSE.modules.length,lessons:flat.length,audioLessons:flat.filter(x=>x.l.audio).length,totalCodeChars:flat.reduce((a,x)=>a+(x.l.code.html||'').length+(x.l.code.css||'').length+(x.l.code.js||'').length,0),totalNarrWords:flat.reduce((a,x)=>a+(x.l.narration||'').trim().split(/\\s+/).filter(Boolean).length,0),activeDevice:document.getElementById('bframe').dataset.d,visualConsoleLines:VC.lines.length},timeline:VC.lines.slice(-120).map(l=>({t:l.t,type:l.type,msg:l.msg})),modules:COURSE.modules.map((m,mi)=>({index:mi+1,id:m.id,title:m.title,lessonCount:m.lessons.length,lessons:m.lessons.map((l,li)=>({index:li+1,id:l.id,title:l.title,hasAudio:!!l.audio,narrationWords:(l.narration||'').trim().split(/\\s+/).filter(Boolean).length,codeLength:{html:(l.code.html||'').length,css:(l.code.css||'').length,js:(l.code.js||'').length}}))}))};return sim}
function showSIM(){const sim=collectSIM();const b=document.getElementById('sb');const f=n=>new Intl.NumberFormat('tr-TR').format(n);const stats=[['Modül',sim.stats.modules],['Ders',sim.stats.lessons],['Ses',sim.stats.audioLessons],['Kod Krktr',f(sim.stats.totalCodeChars)],['Kelime',f(sim.stats.totalNarrWords)],['Cihaz',sim.stats.activeDevice.toUpperCase()],['Konsol',sim.stats.visualConsoleLines],['~Süre dk',Math.round(sim.stats.totalNarrWords/150)]];
const sh='<div class="stats">'+stats.map(([l,n])=>'<div class="st"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>').join('')+'</div>';
const mh=sim.modules.map(m=>'<div class="card"><h4>📦 '+esc(m.title)+' <span style="background:#1a2340;border:1px solid var(--border);padding:2px 9px;border-radius:20px;font-size:11px;color:var(--sim);font-weight:800">'+m.lessonCount+' ders</span></h4><ul style="margin:8px 0 0;padding-left:16px;font-size:12px;color:var(--muted);line-height:1.7">'+m.lessons.map(l=>'<li><b style="color:#fff">'+esc(l.title)+'</b> · '+(l.codeLength.html+l.codeLength.css+l.codeLength.js)+' kod · '+l.narrationWords+' kelime'+(l.hasAudio?' · 🎙':'')+'</li>').join('')+'</ul></div>').join('');
const jh='<div class="card" style="grid-column:1/-1"><h4>🧬 Ham SIM JSON</h4><pre>'+esc(JSON.stringify(sim,null,2))+'</pre></div>';
b.innerHTML=sh+mh+jh;document.getElementById('smeta').textContent=sim.generated.slice(0,19).replace('T',' ');document.getElementById('simov').classList.add('open');VC.sim('SIM toplandı: '+sim.stats.modules+' modül / '+sim.stats.lessons+' ders')}
function dlSIM(){const sim=collectSIM();const blob=new Blob([JSON.stringify(sim,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='kurs_SIM.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);VC.sim('SIM indirildi')}
function cpSIM(){const sim=collectSIM();const t=JSON.stringify(sim,null,2);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.resolve()).then(()=>alert('SIM kopyalandı'))}
/* ---- device morph ---- */
function dm(dev,old){const st=document.getElementById('stage');const tt=document.getElementById('dtoast');tt.textContent={pc:'🖥 PC Modu',tablet:'📱 Tablet Modu',mobile:'📲 Mobil Modu'}[dev]||dev;tt.classList.add('show');setTimeout(()=>tt.classList.remove('show'),1400);st.classList.remove('m-pc','m-tablet','m-mobile');void st.offsetWidth;st.classList.add('m-'+dev);st.classList.remove('rp');void st.offsetWidth;st.classList.add('rp');const b=document.createElement('div');b.className='ptb';st.appendChild(b);for(let i=0;i<26;i++){const p=document.createElement('span');p.className='pt';const a=(Math.PI*2*i/26)+Math.random()*.5;const d=90+Math.random()*140;p.style.setProperty('--dx',(Math.cos(a)*d)+'px');p.style.setProperty('--dy',(Math.sin(a)*d)+'px');p.style.animationDelay=(Math.random()*.15)+'s';p.style.width=p.style.height=(4+Math.random()*10)+'px';b.appendChild(p)}setTimeout(()=>b.remove(),1100);setTimeout(()=>{st.classList.remove('m-pc','m-tablet','m-mobile','rp')},900);VC.anim('Cihaz morph: '+(old||'?')+' → '+dev)}
/* ---- build ---- */
function buildNav(){let h='';COURSE.modules.forEach(m=>{h+='<div class=m>'+esc(m.title)+'</div>';m.lessons.forEach(l=>{const i=flat.findIndex(x=>x.l===l);h+='<div class=l data-i='+i+'>'+esc(l.title)+(l.audio?' 🎙':'')+'</div>'})});nav.innerHTML=h;}
buildNav();
nav.addEventListener('click',e=>{const el=e.target.closest('[data-i]');if(el){idx=+el.dataset.i;load()}});
function fmt(s){s=Math.max(0,s||0);return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}
function estDur(t){const w=(t||'').trim().split(/\\s+/).filter(Boolean).length;return Math.max(2,w/(2.6*rate))}
function slug(s){return (s||'').toLowerCase().replace(/ç/g,'c').replace(/ğ/g,'g').replace(/ı/g,'i').replace(/ö/g,'o').replace(/ş/g,'s').replace(/ü/g,'u').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}
function load(){stop();animElapsed=0;animPaused=true;const {m,l}=flat[idx];document.getElementById('frame').srcdoc=doc(l.code);[...nav.querySelectorAll('.l')].forEach(x=>x.classList.toggle('on',+x.dataset.i===idx));var dt=(l.code.html.match(/<title>([^<]*)<\\/title>/i)||[])[1]||l.title;document.getElementById('tabt').textContent=dt;document.getElementById('url').innerHTML='https://<b>kurs.local</b>/'+esc(slug(l.title)||'ders')+'.html';document.getElementById('code').innerHTML=THEATERS[l.id]||'';lineEls=[...document.querySelectorAll('#code .cline')];charEls=[...document.querySelectorAll('#code .c')];revealed=-1;const t=(l.narration||'').trim();const cap=document.getElementById('cap');if(!t){cap.innerHTML='<span style=color:#6a769c>Anlatım yok.</span>';capEls=[];}else{cap.innerHTML=t.split(/(\\s+)/).map(x=>/\\S/.test(x)?'<span class=cw>'+esc(x)+'</span>':esc(x)).join('');capEls=[...cap.querySelectorAll('.cw')];}document.getElementById('fill').style.width='0%';document.getElementById('tm').textContent='0:00';document.getElementById('play').textContent='▶';playing=false;activeLine=null;hideLink();VC.code('Ders yüklendi: '+l.title)}
function stop(){if(window.speechSynthesis)speechSynthesis.cancel();audio.pause();clearInterval(timer);cancelAnimationFrame(raf);pauseLoop();playing=false;document.getElementById('play').textContent='▶'}
function stopFull(){stop();try{audio.pause();audio.currentTime=0}catch(e){}resetLoop();if(capEls)capEls.forEach(e=>e.classList.remove('now'));document.getElementById('fill').style.width='0%';document.getElementById('tm').textContent='0:00';mode='idle';playing=false;document.getElementById('play').textContent='▶';VC.anim('Stop — sıfırlandı')}
function startLoop(){if(!animPaused)return;if(!charEls.length)return;animPaused=false;animStarted=Date.now();animTimer=setInterval(()=>{const total=animElapsed+(Date.now()-animStarted);const p=(total%ANIM_CYCLE_MS)/ANIM_CYCLE_MS;reveal(p)},55)}
function pauseLoop(){if(animPaused)return;animPaused=true;animElapsed+=(Date.now()-animStarted);if(animTimer){clearInterval(animTimer);animTimer=null}}
function resetLoop(){pauseLoop();animElapsed=0;revealed=-1;if(charEls)charEls.forEach(e=>{e.classList.remove('on');e.classList.remove('cur')});if(lineEls)lineEls.forEach(e=>e.classList.remove('on'));activeLine=null;hideLink()}
function applyCap(p){p=Math.min(1,Math.max(0,p));if(capEls.length){const a=Math.min(capEls.length-1,Math.floor(p*capEls.length));capEls.forEach((e,i)=>e.classList.toggle('now',i===a))}document.getElementById('fill').style.width=(p*100)+'%'}
function reveal(p){const n=charEls.length;if(!n)return;const t=Math.min(n-1,Math.round(p*(n-1)));if(t===revealed)return;if(t>revealed){for(let i=revealed+1;i<=t;i++)charEls[i].classList.add('on')}else{for(let i=revealed;i>t;i--)charEls[i].classList.remove('on')}revealed=t;charEls.forEach(e=>e.classList.remove('cur'));const c=charEls[t];if(c){c.classList.add('cur');const ln=c.closest('.cline');if(ln&&ln!==activeLine){activeLine=ln;lineEls.forEach(e=>e.classList.remove('on'));ln.classList.add('on');const b=document.getElementById('code').getBoundingClientRect(),r=ln.getBoundingClientRect();if(r.bottom>b.bottom-60||r.top<b.top+60)ln.scrollIntoView({block:'center',behavior:'smooth'});requestLink(ln)}}}
function setFx(on){fxOn=on;document.getElementById('code').classList.toggle('fx-on',on);var b=document.getElementById('fxbtn');if(b)b.classList.toggle('off',!on);if(!on){hideLink();VC.anim('FX KAPALI')}else{VC.anim('FX AÇIK');if(activeLine)requestLink(activeLine)}}
function hideLink(){document.getElementById('llayer').classList.remove('show');document.getElementById('elbox').classList.remove('show')}
function requestLink(line){if(!fxOn||!line){hideLink();return}var raw=line.getAttribute('data-loc');if(!raw){hideLink();return}var loc=null;try{loc=JSON.parse(raw)}catch(e){}if(!loc){hideLink();return}var fr=document.getElementById('frame');if(!fr||!fr.contentWindow){hideLink();return}linkReq++;linkPending={id:linkReq,line:line};fr.contentWindow.postMessage({__kb:'locate',id:linkReq,loc:loc},'*')}
function onLocated(msg){var p=linkPending;if(!p||msg.id!==p.id)return;if(!msg.rect){hideLink();return}drawLink(p.line,msg)}
function drawLink(line,msg){if(!fxOn){hideLink();return}var main=document.querySelector('main'),layer=document.getElementById('llayer'),svg=document.getElementById('lsvg'),path=document.getElementById('lpath'),head=document.getElementById('lhead'),box=document.getElementById('elbox'),tag=document.getElementById('ltag'),fr=document.getElementById('frame');if(!main||!svg||!fr)return;var host=main.getBoundingClientRect(),codeBox=document.getElementById('code').getBoundingClientRect(),lr=line.getBoundingClientRect();if(lr.bottom<codeBox.top+4||lr.top>codeBox.bottom-4){hideLink();return}var fRect=fr.getBoundingClientRect();var sx=msg.dw?fRect.width/msg.dw:1,sy=msg.dh?fRect.height/msg.dh:1;var ex=fRect.left+msg.rect.x*sx,ey=fRect.top+msg.rect.y*sy,ew=Math.max(6,msg.rect.w*sx),eh=Math.max(6,msg.rect.h*sy);var bx=ex-host.left,by=ey-host.top;var vpL=fRect.left-host.left,vpT=fRect.top-host.top,vpR=fRect.right-host.left,vpB=fRect.bottom-host.top;var cbx=Math.max(vpL,bx),cby=Math.max(vpT,by),cbw=Math.min(vpR,bx+ew)-cbx,cbh=Math.min(vpB,by+eh)-cby;if(cbw<=2||cbh<=2){hideLink();return}box.style.left=cbx+'px';box.style.top=cby+'px';box.style.width=cbw+'px';box.style.height=cbh+'px';box.classList.add('show');document.getElementById('ltagt').textContent=msg.label||'render';var tgx=cbx+cbw/2,tgy=cby-8;if(tgy<vpT+18)tgy=cby+cbh+26;tag.style.left=tgx+'px';tag.style.top=tgy+'px';var W=host.width,H=host.height;svg.setAttribute('viewBox','0 0 '+W+' '+H);var startX=Math.min(codeBox.right-host.left-6,lr.right-host.left+14),startY=lr.top-host.top+lr.height/2,endX=cbx-8,endY=cby+cbh/2,midX=(startX+endX)/2;path.setAttribute('d','M '+startX+' '+startY+' C '+midX+' '+startY+' '+midX+' '+endY+' '+endX+' '+endY);var ang=Math.atan2(0,endX-midX),ah=14,p1x=endX,p1y=endY,p2x=p1x-ah*Math.cos(ang-0.42),p2y=p1y-ah*Math.sin(ang-0.42),p3x=p1x-ah*Math.cos(ang+0.42),p3y=p1y-ah*Math.sin(ang+0.42);head.setAttribute('points',p1x+','+p1y+' '+p2x+','+p2y+' '+p3x+','+p3y);layer.classList.add('show');VC.anim('Link: '+(msg.label||'render'))}
window.addEventListener('message',function(e){var d=e.data;if(d&&d.__kb==='located')onLocated(d)});
function toggle(){const {l}=flat[idx];if(playing){if(mode==='audio')audio.pause();else if(speechSynthesis.speaking&&!speechSynthesis.paused)speechSynthesis.pause();pauseLoop();playing=false;document.getElementById('play').textContent='▶';VC.warn('Duraklatıldı');return}l.audio?pa(l):pt(l)}

let modalCb=null, modalMode='prompt';
function prompt2(title,desc,val,cb){ modalMode='prompt'; modalCb=cb; $('#mTitle').textContent=title; $('#mDesc').textContent=desc; const inp=$('#mInput'); inp.style.display='block'; inp.value=val||''; $('#mOk').textContent='Kaydet'; $('#modalBack').classList.add('open'); setTimeout(()=>{inp.focus();inp.select();},30); }
function confirm2(title,desc,cb){ modalMode='confirm'; modalCb=cb; $('#mTitle').textContent=title; $('#mDesc').textContent=desc; $('#mInput').style.display='none'; $('#mOk').textContent='Evet, devam et'; $('#modalBack').classList.add('open'); }
function closeModal(){ $('#modalBack').classList.remove('open'); modalCb=null; }
$('#mCancel').addEventListener('click',closeModal);
$('#mOk').addEventListener('click',()=>{ const cb=modalCb; const val=$('#mInput').value.trim(); closeModal(); if(cb){ if(modalMode==='prompt') cb(val); else cb(); } });
$('#mInput').addEventListener('keydown',e=>{ if(e.key==='Enter'){ $('#mOk').click(); } });
$('#modalBack').addEventListener('click',e=>{ if(e.target===$('#modalBack')) closeModal(); });

function toast(msg,type){ const t=document.createElement('div'); t.className='toast '+(type||''); t.innerHTML=(type==='ok'?'✓ ':type==='err'?'⚠ ':type==='warn'?'⚠ ':'')+esc(msg); $('#toasts').appendChild(t); setTimeout(()=>{ t.style.transition='.3s'; t.style.opacity='0'; t.style.transform='translateY(10px)'; setTimeout(()=>t.remove(),320); }, 2600); }

document.addEventListener('keydown',e=>{

  if(e.key==='Escape'){ if($('#simOverlay').classList.contains('open')) $('#simOverlay').classList.remove('open'); else if(player.open) closePlayer(); else if($('#modalBack').classList.contains('open')) closeModal(); }
  if(player.open){
    if(e.key===' '&&e.target===document.body){ e.preventDefault(); togglePlay(); }
    if(e.key==='ArrowRight') playerNext();
    if(e.key==='ArrowLeft') playerPrev();
    if(e.key==='f'||e.key==='F'){ e.preventDefault(); toggleFullscreen(); }
    if(e.key==='z'||e.key==='Z'){ e.preventDefault(); setFx(!player.fxOn); }
    if(e.key==='c'||e.key==='C'){ e.preventDefault(); VC.toggle(); }
    if(e.key==='Backspace'){ e.preventDefault(); stopPlaybackFull(); }
  }
});
