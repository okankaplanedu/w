<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KURS BUILDER — SIM & ANIM · Görsel Konsol · Yüksek TTS</title>
<meta name="description" content="Modül ve derslerden oluşan interaktif kurs oluşturucu. Kod editörü, canlı önizleme, SIM/ANIM animasyon motoru, görsel konsol ve yüksek kabiliyetli TTS." />
<style>
  :root{
    --bg:#0b1020; --bg2:#11172c; --panel:#141b33; --panel2:#1a2340;
    --border:#25304f; --border2:#324066;
    --text:#e8edf7; --muted:#95a2c4; --faint:#6a769c;
    --brand:#6ea8ff; --brand2:#8b7bff; --accent:#37e0b0;
    --danger:#ff6b7d; --warn:#ffcf6b; --ok:#37e0b0;
    --sim:#00e5ff; --anim:#ff5fa2; --neon:#c084fc;
    --code-bg:#0c1226;
    --radius:14px; --radius-sm:9px;
    --shadow:0 12px 40px rgba(0,0,0,.45);
    --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Fira Code", Consolas, monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:var(--font); color:var(--text);
    background:
      radial-gradient(1100px 620px at 88% -8%, rgba(139,123,255,.16), transparent 60%),
      radial-gradient(900px 560px at -6% 4%, rgba(110,168,255,.14), transparent 55%),
      var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit}
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-thumb{background:#28324f;border-radius:20px;border:3px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:#39466c;background-clip:padding-box;border:3px solid transparent}

  /* ---------- Layout ---------- */
  .app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
  header.topbar{
    display:flex;align-items:center;gap:14px;padding:11px 18px;
    background:linear-gradient(180deg,rgba(20,27,51,.9),rgba(17,23,44,.72));
    border-bottom:1px solid var(--border);backdrop-filter:blur(8px);z-index:30;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:12px;margin-right:auto}
  .logo{
    width:40px;height:40px;border-radius:11px;flex:none;
    background:linear-gradient(135deg,var(--brand),var(--brand2));
    display:grid;place-items:center;color:#0b1020;font-weight:800;font-size:19px;
    box-shadow:0 6px 20px rgba(110,168,255,.35);
  }
  .brand h1{font-size:15px;margin:0;letter-spacing:.2px;line-height:1.15}
  .brand span{font-size:11.5px;color:var(--muted);font-weight:500}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  .btn{
    display:inline-flex;align-items:center;gap:7px;cursor:pointer;
    background:var(--panel2);color:var(--text);border:1px solid var(--border2);
    padding:8px 13px;border-radius:10px;font-size:13px;font-weight:600;
    transition:.16s ease; white-space:nowrap;
  }
  .btn:hover{border-color:var(--brand);background:#212c50;transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#0b1020;border:none;box-shadow:0 6px 18px rgba(110,168,255,.3)}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.ghost{background:transparent;border-color:var(--border)}
  .btn.ok{background:linear-gradient(135deg,var(--accent),#2fb6ff);color:#062018;border:none}
  .btn.danger{color:var(--danger);border-color:#5a2a36}
  .btn.danger:hover{background:#2a1620;border-color:var(--danger)}
  .btn.sm{padding:6px 9px;font-size:12px;border-radius:8px}
  .btn.icon{padding:8px;width:36px;height:36px;justify-content:center}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
  .btn svg{width:16px;height:16px;flex:none}

  main{flex:1;display:flex;min-height:0}

  /* ---------- Sidebar ---------- */
  aside{
    width:322px;flex:none;background:linear-gradient(180deg,var(--panel),rgba(17,23,44,.85));
    border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;
  }
  .side-head{padding:13px 14px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
  .search{position:relative}
  .search input{
    width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:9px;
    padding:9px 11px 9px 33px;color:var(--text);font-size:13px;font-family:inherit;
  }
  .search input:focus{outline:none;border-color:var(--brand)}
  .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--faint)}
  .side-stats{display:flex;gap:8px;font-size:11.5px;color:var(--muted)}
  .side-stats b{color:var(--text)}
  .chip{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:3px 10px}

  .tree{flex:1;overflow-y:auto;padding:8px 8px 24px}
  .module{margin-bottom:6px;border:1px solid var(--border);border-radius:12px;background:rgba(12,18,38,.4);overflow:hidden}
  .mod-head{display:flex;align-items:center;gap:8px;padding:9px 10px;cursor:pointer;user-select:none}
  .mod-head:hover{background:rgba(110,168,255,.06)}
  .caret{width:16px;height:16px;color:var(--muted);transition:transform .18s;flex:none}
  .module.collapsed .caret{transform:rotate(-90deg)}
  .module.collapsed .lessons{display:none}
  .mod-title{font-weight:700;font-size:13.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mod-count{font-size:11px;color:var(--faint);background:var(--bg2);border-radius:20px;padding:2px 8px;flex:none}
  .mod-actions{display:none;gap:2px}
  .mod-head:hover .mod-actions{display:flex}
  .mini{width:26px;height:26px;border:none;background:transparent;color:var(--muted);border-radius:7px;cursor:pointer;display:grid;place-items:center}
  .mini:hover{background:var(--panel2);color:var(--text)}
  .mini svg{width:14px;height:14px}

  .lessons{padding:4px 6px 8px 6px;display:flex;flex-direction:column;gap:3px}
  .lesson{
    display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;cursor:pointer;
    font-size:13px;color:var(--muted);border:1px solid transparent;
  }
  .lesson:hover{background:rgba(110,168,255,.07);color:var(--text)}
  .lesson.active{background:linear-gradient(90deg,rgba(110,168,255,.2),rgba(139,123,255,.12));color:#fff;border-color:var(--border2)}
  .lesson .num{width:22px;height:22px;flex:none;border-radius:7px;background:var(--bg2);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--brand)}
  .lesson.active .num{background:var(--brand);color:#0b1020}
  .lesson .lname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lesson .badge{font-size:10px;flex:none}
  .lesson-actions{display:none;gap:1px}
  .lesson:hover .lesson-actions{display:flex}
  .add-lesson{width:100%;text-align:left;background:transparent;border:1px dashed var(--border2);color:var(--muted);
    padding:7px 10px;border-radius:9px;cursor:pointer;font-size:12.5px;margin-top:2px}
  .add-lesson:hover{border-color:var(--brand);color:var(--text)}
  .side-foot{padding:10px;border-top:1px solid var(--border)}

  /* ---------- Editor ---------- */
  .editor{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
  .ed-head{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .crumbs{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:6px;flex:1;min-width:0}
  .crumbs b{color:var(--muted);font-weight:600}
  .title-input{
    font-size:19px;font-weight:800;background:transparent;border:none;color:var(--text);
    width:100%;padding:4px 2px;font-family:inherit;letter-spacing:.2px;
  }
  .title-input:focus{outline:none}
  .title-wrap{display:flex;flex-direction:column;gap:2px;flex:1;min-width:220px;order:5;flex-basis:100%}

  .tabs{display:flex;gap:4px;padding:0 18px;border-bottom:1px solid var(--border);background:rgba(12,18,38,.3)}
  .tab{padding:11px 15px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;display:flex;align-items:center;gap:7px}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--text);border-bottom-color:var(--brand)}
  .tab svg{width:15px;height:15px}
  .tab .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}

  .ed-body{flex:1;min-height:0;position:relative}
  .pane{position:absolute;inset:0;display:none;overflow:auto}
  .pane.active{display:flex}

  .code-pane{flex-direction:column}
  .code-toolbar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .seg{display:flex;background:var(--bg2);border:1px solid var(--border);border-radius:9px;overflow:hidden}
  .seg button{background:transparent;border:none;color:var(--muted);padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--mono)}
  .seg button.active{background:var(--panel2);color:var(--text)}
  .seg button:not(:last-child){border-right:1px solid var(--border)}
  .code-wrap{flex:1;position:relative;min-height:0;display:flex}
  textarea.code{
    flex:1;width:100%;background:var(--code-bg);color:#d7e3ff;border:none;resize:none;
    font-family:var(--mono);font-size:13.5px;line-height:1.65;padding:14px 16px;tab-size:2;
    white-space:pre;overflow:auto;
  }
  textarea.code:focus{outline:none}
  .code-hint{font-size:11.5px;color:var(--faint);margin-left:auto}

  .prev-pane{flex-direction:column}
  .prev-toolbar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .prev-frame-wrap{flex:1;background:#fff;position:relative;min-height:0}
  .prev-frame-wrap.dev{background:
    linear-gradient(45deg,#e9edf5 25%,transparent 25%),linear-gradient(-45deg,#e9edf5 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#e9edf5 75%),linear-gradient(-45deg,transparent 75%,#e9edf5 75%);
    background-size:22px 22px;background-position:0 0,0 11px,11px -11px,-11px 0;padding:0}
  .prev-frame-holder{width:100%;height:100%;margin:0 auto;transition:max-width .2s;background:#fff}
  iframe#preview{width:100%;height:100%;border:none;background:#fff;display:block}

  .narr-pane{flex-direction:column}
  .narr-toolbar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
  textarea.narr{flex:1;width:100%;background:var(--bg2);color:var(--text);border:none;resize:none;
    font-family:inherit;font-size:15px;line-height:1.85;padding:18px 22px}
  textarea.narr:focus{outline:none}

  .audio-pane{flex-direction:column;overflow:auto}
  .audio-inner{max-width:760px;margin:0 auto;padding:22px 20px;width:100%;display:flex;flex-direction:column;gap:16px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
  .card h3{margin:0 0 4px;font-size:14.5px}
  .card p.desc{margin:0 0 14px;font-size:13px;color:var(--muted);line-height:1.6}
  .drop{
    border:2px dashed var(--border2);border-radius:12px;padding:26px;text-align:center;cursor:pointer;
    transition:.16s;background:rgba(12,18,38,.4);
  }
  .drop:hover,.drop.over{border-color:var(--brand);background:rgba(110,168,255,.07)}
  .drop svg{width:34px;height:34px;color:var(--brand);margin-bottom:8px}
  .drop .big{font-weight:700;font-size:14px}
  .drop .small{font-size:12px;color:var(--faint);margin-top:4px}
  audio{width:100%;margin-top:12px;filter:invert(.92) hue-rotate(180deg)}
  .audio-status{display:flex;align-items:center;gap:10px;font-size:13px;padding:10px 12px;border-radius:10px;background:var(--bg2);border:1px solid var(--border);margin-top:12px}
  .audio-status .tag{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px}
  .tag.mp3{background:rgba(55,224,176,.16);color:var(--accent)}
  .tag.tts{background:rgba(255,207,107,.16);color:var(--warn)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
  .field select,.field input[type=range]{width:100%}
  .field select{background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:8px 10px;color:var(--text);font-family:inherit;font-size:13px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

  .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);text-align:center;padding:40px}
  .empty svg{width:64px;height:64px;color:var(--border2)}

  /* ---------- Player (course mode) ---------- */
  .player-overlay{position:fixed;inset:0;z-index:100;background:rgba(6,9,20,.86);backdrop-filter:blur(6px);display:none}
  .player-overlay.open{display:flex;flex-direction:column}
  .player-top{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--border);background:var(--panel)}
  .player-top .p-title{font-weight:800;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .player-top .p-sub{font-size:12px;color:var(--muted)}
  .player-main{flex:1;display:flex;min-height:0;position:relative}
  .player-left{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
  .player-code{flex:1;overflow:auto;padding:26px 30px 14px;
    background:radial-gradient(900px 480px at 80% -10%,rgba(139,123,255,.1),transparent 60%),#0a0f22;}
  .sec-head{display:inline-flex;align-items:center;gap:9px;margin:8px 0 12px;padding:6px 15px;border-radius:22px;
    font-weight:800;font-size:15px;letter-spacing:.6px;font-family:var(--font);animation:secIn .4s ease both}
  .sec-head:not(:first-child){margin-top:22px}
  .sec-head.html{background:rgba(255,123,156,.16);color:#ff7b9c;box-shadow:inset 0 0 0 1px rgba(255,123,156,.3)}
  .sec-head.css{background:rgba(130,170,255,.16);color:#82aaff;box-shadow:inset 0 0 0 1px rgba(130,170,255,.3)}
  .sec-head.js{background:rgba(255,203,107,.16);color:#ffcb6b;box-shadow:inset 0 0 0 1px rgba(255,203,107,.3)}
  @keyframes secIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .code-theater{font-family:var(--mono);font-size:clamp(16px,1.85vw,25px);line-height:1.78}
  .cline{display:flex;gap:16px;align-items:flex-start;padding:3px 14px;border-radius:11px;position:relative;
    border-left:3px solid transparent;transition:background .28s ease,border-color .28s ease}
  .cline .ln{color:#39456b;min-width:2.2ch;text-align:right;font-size:.62em;padding-top:.6em;user-select:none;flex:none}
  .cline code{white-space:pre-wrap;word-break:break-word;flex:1;font-family:var(--mono)}
  .cline.on{background:linear-gradient(90deg,rgba(110,168,255,.13),transparent);border-left-color:var(--brand)}
  .c{opacity:.12;transition:opacity .1s ease}
  .c.on{opacity:1}
  .c.cur{position:relative}
  .c.cur::after{content:'';position:absolute;right:-2px;top:.06em;width:2px;height:1.05em;
    background:var(--brand);box-shadow:0 0 9px var(--brand);animation:caretblink 1.05s steps(1) infinite}
  @keyframes caretblink{0%,50%{opacity:1}50.01%,100%{opacity:0}}
  .tok-tag{color:#ff7b9c}.tok-attr{color:#ffd166}.tok-str{color:#7ee787}
  .tok-com{color:#5f6b93;font-style:italic}.tok-kw{color:#c792ea;font-weight:600}
  .tok-num{color:#f78c6c}.tok-punct{color:#89ddff}.tok-prop{color:#82aaff}
  .tok-sel{color:#ffcb6b}.tok-val{color:#c3e88d}.tok-fn{color:#82aaff}
  .player-caption{padding:13px 30px;border-top:1px solid var(--border);font-size:16px;line-height:1.55;
    color:var(--muted);font-family:var(--font);min-height:26px;background:rgba(12,18,38,.6);flex:none;max-height:96px;overflow:auto}
  .player-caption .cw{transition:all .16s;display:inline-block}
  .player-caption .cw.now{color:var(--brand);font-weight:700;text-shadow:0 0 12px rgba(110,168,255,.6);transform:translateY(-1px) scale(1.06)}

  /* ===== YENİ: SIM & ANIM stilleri ===== */
  .player-code .cline{transition:background .28s ease,border-color .28s ease,opacity .4s ease,filter .4s ease}
  .player-code.fx-on .cline.on{background:linear-gradient(90deg,rgba(110,168,255,.2),rgba(139,123,255,.06) 60%,transparent);
    border-left-color:var(--brand);box-shadow:inset 0 0 0 1px rgba(110,168,255,.25);border-radius:10px;z-index:2}
  .player-code.fx-on .cline.on .ln{color:#8ab4ff}

  /* Aktif satır çevresinde nabız */
  @keyframes lineNebula{
    0%,100%{box-shadow:inset 0 0 0 1px rgba(110,168,255,.25),0 0 12px rgba(110,168,255,.18)}
    50%{box-shadow:inset 0 0 0 1px rgba(110,168,255,.5),0 0 22px rgba(110,168,255,.4)}
  }
  .player-code.fx-on .cline.on{animation:lineNebula 2.4s ease-in-out infinite}

  /* Bağlantı katmanı */
  .link-layer{position:absolute;inset:0;pointer-events:none;z-index:60;opacity:0;transition:opacity .3s ease}
  .link-layer.show{opacity:1}
  .link-layer svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .link-path{fill:none;stroke:url(#lnkgrad);stroke-width:3;stroke-linecap:round;
    stroke-dasharray:10 8;filter:drop-shadow(0 0 6px rgba(110,168,255,.55));animation:lnkdash .55s linear infinite}
  @keyframes lnkdash{to{stroke-dashoffset:-36}}
  .link-head{fill:#8b7bff;filter:drop-shadow(0 0 5px rgba(139,123,255,.8))}
  .el-box{position:absolute;pointer-events:none;border:2.5px solid #8b7bff;border-radius:6px;
    box-shadow:0 0 0 3px rgba(139,123,255,.18),0 0 22px rgba(139,123,255,.45);opacity:0;
    transition:left .38s cubic-bezier(.22,1,.36,1),top .38s cubic-bezier(.22,1,.36,1),width .38s,height .38s,opacity .25s;
    background:rgba(139,123,255,.06)}
  .el-box.show{opacity:1;animation:elpulse 1.7s ease-in-out infinite}
  @keyframes elpulse{0%,100%{box-shadow:0 0 0 3px rgba(139,123,255,.14),0 0 18px rgba(139,123,255,.35)}
    50%{box-shadow:0 0 0 5px rgba(139,123,255,.28),0 0 30px rgba(139,123,255,.6)}}
  .link-tag{position:absolute;transform:translate(-50%,-100%);pointer-events:none;white-space:nowrap;
    display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:8px;
    font:800 12px/1 var(--mono);letter-spacing:.4px;color:#fff;
    background:linear-gradient(135deg,#6ea8ff,#8b7bff);box-shadow:0 8px 22px -6px rgba(110,168,255,.7),inset 0 0 0 1px rgba(255,255,255,.2)}
  .link-tag::after{content:'';position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);
    border:5px solid transparent;border-top-color:#8b7bff}
  .link-tag .lt-dot{width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 7px #fff;animation:ltblink 1s steps(1) infinite}
  @keyframes ltblink{0%,60%{opacity:1}60.01%,100%{opacity:.25}}
  .p-round.fx-toggle.off{opacity:.45}

  /* ---------- SIM cihaz morph animasyonları ---------- */
  @keyframes dm-pc{
    0%{transform:scale(.5) rotateY(180deg) translateZ(-400px);opacity:0;filter:blur(24px) saturate(2)}
    45%{transform:scale(1.06) rotateY(8deg) translateZ(40px);opacity:1;filter:blur(0) saturate(1.2)}
    100%{transform:scale(1) rotateY(0) translateZ(0);opacity:1;filter:blur(0) saturate(1)}
  }
  @keyframes dm-tablet{
    0%{transform:scale(.4) rotate(-25deg) translateY(-60px);opacity:0;filter:blur(20px) hue-rotate(60deg)}
    55%{transform:scale(1.05) rotate(4deg) translateY(8px);opacity:1;filter:blur(0) hue-rotate(0deg)}
    100%{transform:scale(1) rotate(0) translateY(0);opacity:1}
  }
  @keyframes dm-mobile{
    0%{transform:scale(.2) rotate(35deg) translateY(80px);opacity:0;filter:blur(18px) brightness(2)}
    55%{transform:scale(1.08) rotate(-3deg) translateY(-6px);opacity:1;filter:blur(0) brightness(1)}
    100%{transform:scale(1) rotate(0) translateY(0);opacity:1}
  }
  .device-stage{position:relative}
  .device-stage.morph-pc .browser-frame{animation:dm-pc .78s cubic-bezier(.34,1.56,.64,1) both}
  .device-stage.morph-tablet .browser-frame{animation:dm-tablet .78s cubic-bezier(.34,1.56,.64,1) both}
  .device-stage.morph-mobile .browser-frame{animation:dm-mobile .78s cubic-bezier(.34,1.56,.64,1) both}

  /* Morph sırasında çıkan halka (ripple) */
  .device-stage::after{
    content:'';position:absolute;left:50%;top:50%;width:0;height:0;border-radius:50%;
    border:3px solid var(--brand);opacity:0;pointer-events:none;transform:translate(-50%,-50%)
  }
  .device-stage.rippling::after{animation:deviceRipple .9s ease-out forwards}
  @keyframes deviceRipple{
    0%{width:40px;height:40px;opacity:.85;border-color:var(--brand)}
    60%{opacity:.5;border-color:var(--brand2)}
    100%{width:min(96vw,1400px);height:min(96vw,1400px);opacity:0;border-color:transparent}
  }

  /* Parçacık patlaması */
  .particle-burst{position:absolute;pointer-events:none;left:50%;top:50%;width:0;height:0;z-index:80}
  .particle-burst .pt{position:absolute;width:8px;height:8px;border-radius:50%;
    background:linear-gradient(135deg,var(--brand),var(--brand2));
    box-shadow:0 0 12px var(--brand),0 0 6px var(--neon);
    animation:ptFly .9s ease-out forwards}
  @keyframes ptFly{
    0%{transform:translate(0,0) scale(.4);opacity:1}
    100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}
  }
  /* Yıldız patlaması */
  .star-burst{position:absolute;inset:0;pointer-events:none;z-index:70;opacity:0;background:
    radial-gradient(circle at 50% 50%,rgba(139,123,255,.25),transparent 30%);
    transition:opacity .3s}
  .star-burst.show{opacity:1;animation:starFlash .7s ease-out}
  @keyframes starFlash{0%{opacity:0;transform:scale(.7)}50%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.15)}}

  /* Cihaz geçiş bildirimi (toast benzeri büyük etiket) */
  .device-toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-24px) scale(.9);z-index:90;
    background:linear-gradient(135deg,rgba(110,168,255,.95),rgba(139,123,255,.95));
    color:#0b1020;padding:10px 22px;border-radius:22px;font-weight:800;font-size:13px;letter-spacing:.8px;
    box-shadow:0 14px 40px -8px rgba(110,168,255,.7);opacity:0;pointer-events:none;transition:.32s;
    display:flex;align-items:center;gap:9px}
  .device-toast::before{content:'';width:9px;height:9px;border-radius:50%;background:#0b1020;animation:dtBlink .7s steps(1) infinite}
  @keyframes dtBlink{0%,50%{opacity:1}50.01%,100%{opacity:.2}}
  .device-toast.show{opacity:1;transform:translate(-50%,0) scale(1)}

  /* ---------- Görsel Konsol ---------- */
  .visual-console{
    position:absolute;left:0;right:0;bottom:0;height:0;z-index:55;
    background:linear-gradient(180deg,rgba(6,9,20,.0) 0%,rgba(6,9,20,.97) 15%);
    border-top:1px solid var(--border2);overflow:hidden;transition:height .3s cubic-bezier(.22,1,.36,1);
    display:flex;flex-direction:column;backdrop-filter:blur(8px);
  }
  .visual-console.open{height:38%}
  .vc-head{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--border);flex:none;
    background:linear-gradient(90deg,rgba(110,168,255,.08),rgba(139,123,255,.08));cursor:pointer;user-select:none}
  .vc-title{font-weight:800;font-size:12.5px;letter-spacing:.4px;color:var(--text);display:flex;align-items:center;gap:8px}
  .vc-title .vc-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:vcPulse 1.6s infinite}
  @keyframes vcPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
  .vc-actions{margin-left:auto;display:flex;gap:6px}
  .vc-actions button{background:var(--panel2);border:1px solid var(--border2);color:var(--muted);font-size:11px;padding:4px 10px;border-radius:7px;cursor:pointer;font-weight:700}
  .vc-actions button:hover{color:#fff;border-color:var(--brand)}
  .vc-body{flex:1;overflow:auto;padding:8px 12px;font-family:var(--mono);font-size:12px;line-height:1.55;background:#060a16}
  .vc-line{display:flex;gap:10px;padding:3px 8px;border-radius:6px;animation:vcSlide .25s ease both}
  @keyframes vcSlide{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
  .vc-line .vc-time{color:var(--faint);flex:none;min-width:64px}
  .vc-line .vc-tag{flex:none;font-weight:800;font-size:10px;padding:1px 7px;border-radius:5px;letter-spacing:.4px}
  .vc-line.info .vc-tag{background:rgba(110,168,255,.2);color:var(--brand)}
  .vc-line.ok .vc-tag{background:rgba(55,224,176,.2);color:var(--accent)}
  .vc-line.warn .vc-tag{background:rgba(255,207,107,.2);color:var(--warn)}
  .vc-line.err .vc-tag{background:rgba(255,107,125,.2);color:var(--danger)}
  .vc-line.code .vc-tag{background:rgba(139,123,255,.2);color:var(--brand2)}
  .vc-line.anim .vc-tag{background:rgba(255,95,162,.2);color:var(--anim)}
  .vc-line.tts .vc-tag{background:rgba(192,132,252,.2);color:var(--neon)}
  .vc-line.sim .vc-tag{background:rgba(0,229,255,.2);color:var(--sim)}
  .vc-line .vc-msg{flex:1;color:#d7e3ff;word-break:break-word;white-space:pre-wrap}
  .vc-line.code .vc-msg{color:#c792ea}
  .vc-line .vc-msg b{color:#fff}

  /* VC indicator (sağ alt köşede nabız) */
  .vc-indicator{
    position:absolute;right:14px;bottom:14px;z-index:56;width:44px;height:44px;border-radius:50%;
    background:linear-gradient(135deg,var(--brand),var(--brand2));color:#0b1020;border:none;cursor:pointer;
    display:grid;place-items:center;box-shadow:0 8px 22px rgba(110,168,255,.45);font-weight:800;font-size:16px;
    transition:transform .2s;
  }
  .vc-indicator:hover{transform:scale(1.08) rotate(6deg)}
  .vc-indicator.badge::after{content:attr(data-count);position:absolute;top:-4px;right:-4px;
    background:var(--danger);color:#fff;font-size:10px;font-weight:800;padding:2px 6px;border-radius:10px;min-width:16px;text-align:center}

  /* ---------- SIM overlay ---------- */
  .sim-overlay{position:fixed;inset:0;z-index:180;background:rgba(4,7,18,.94);backdrop-filter:blur(8px);display:none;
    flex-direction:column;overflow:hidden}
  .sim-overlay.open{display:flex}
  .sim-head{display:flex;align-items:center;gap:14px;padding:16px 22px;border-bottom:1px solid var(--border2);
    background:linear-gradient(90deg,rgba(110,168,255,.1),rgba(139,123,255,.1),rgba(0,229,255,.05))}
  .sim-head h2{margin:0;font-size:16px;letter-spacing:.3px;display:flex;align-items:center;gap:10px}
  .sim-head h2 .sim-ic{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--sim),var(--brand2));display:grid;place-items:center;color:#04121a;font-weight:900}
  .sim-head .sim-meta{font-size:12px;color:var(--muted);margin-left:auto}
  .sim-body{flex:1;overflow:auto;padding:18px 22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
  .sim-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;position:relative;overflow:hidden;
    transition:.2s;animation:simIn .5s ease both}
  .sim-card:hover{border-color:var(--brand);transform:translateY(-2px)}
  @keyframes simIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .sim-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,229,255,.06),transparent 60%);pointer-events:none}
  .sim-card h4{margin:0 0 6px;font-size:13px;display:flex;align-items:center;gap:8px}
  .sim-card .sim-count{background:var(--bg2);border:1px solid var(--border);padding:2px 9px;border-radius:20px;font-size:11px;color:var(--sim);font-weight:800}
  .sim-card .sim-list{margin:8px 0 0;padding-left:16px;font-size:12px;color:var(--muted);line-height:1.7;max-height:220px;overflow:auto}
  .sim-card .sim-list li{padding:1px 0}
  .sim-card .sim-list li b{color:var(--text)}
  .sim-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;margin-bottom:6px}
  .sim-stat{background:linear-gradient(135deg,rgba(110,168,255,.14),rgba(139,123,255,.06));border:1px solid var(--border);
    padding:14px;border-radius:12px;text-align:center;position:relative;overflow:hidden}
  .sim-stat .n{font-size:24px;font-weight:900;color:#fff;letter-spacing:.4px;line-height:1;font-family:var(--mono)}
  .sim-stat .l{font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:.4px;text-transform:uppercase}
  .sim-stat::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;
    background:linear-gradient(90deg,var(--brand),var(--brand2),var(--sim))}
  .sim-foot{padding:14px 22px;border-top:1px solid var(--border);background:var(--panel);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
  .sim-foot .right{margin-right:auto;font-size:12px;color:var(--muted);align-self:center}
  .sim-json{margin:0;padding:16px;background:#060a16;border:1px solid var(--border2);border-radius:10px;
    font-family:var(--mono);font-size:11.5px;color:#7ee787;overflow:auto;max-height:280px;white-space:pre-wrap;word-break:break-word}
  .sim-tabs{display:flex;gap:6px;margin-bottom:14px}
  .sim-tabs button{background:var(--panel2);border:1px solid var(--border2);color:var(--muted);padding:7px 14px;border-radius:9px;
    cursor:pointer;font-size:12.5px;font-weight:700}
  .sim-tabs button.active{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#0b1020;border-color:transparent}

  /* ---------- Yüksek kabiliyetli TTS panel ---------- */
  .tts-hud{
    position:absolute;left:14px;top:14px;z-index:57;display:flex;align-items:center;gap:12px;
    background:rgba(12,18,38,.85);border:1px solid var(--border2);border-radius:14px;padding:8px 14px;
    backdrop-filter:blur(6px);box-shadow:0 12px 30px rgba(0,0,0,.4);
    opacity:0;transform:translateY(-8px);pointer-events:none;transition:.3s;font-size:12px
  }
  .tts-hud.show{opacity:1;transform:none;pointer-events:auto}
  .tts-hud .ring{position:relative;width:38px;height:38px;flex:none}
  .tts-hud .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .tts-hud .ring circle{fill:none;stroke-width:3;stroke-linecap:round}
  .tts-hud .ring .bg{stroke:#26304e}
  .tts-hud .ring .fg{stroke:var(--neon);transition:stroke-dashoffset .12s linear;filter:drop-shadow(0 0 6px var(--neon))}
  .tts-hud .ring .lbl{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff;font-family:var(--mono)}
  .tts-hud .info{display:flex;flex-direction:column;line-height:1.35}
  .tts-hud .info b{font-size:12px;color:#fff}
  .tts-hud .info span{color:var(--muted);font-size:11px}
  .tts-hud .wave{display:flex;gap:2px;align-items:flex-end;height:22px}
  .tts-hud .wave i{width:3px;background:linear-gradient(180deg,var(--neon),var(--brand));border-radius:2px;animation:wv 1s ease-in-out infinite}
  @keyframes wv{0%,100%{height:4px;opacity:.35}50%{height:22px;opacity:1}}

  /* Sürüklenebilir bölücü */
  .player-resizer{width:9px;flex:none;cursor:col-resize;background:var(--border);position:relative;z-index:5;transition:background .15s}
  .player-resizer:hover,.player-resizer.drag{background:var(--brand)}
  .player-resizer::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:3px;height:40px;background:rgba(255,255,255,.35);border-radius:3px}
  body.col-resizing{cursor:col-resize;user-select:none}
  body.col-resizing iframe{pointer-events:none}

  .player-side{width:44%;flex:none;border-left:1px solid var(--border);background:#0a0f22;display:flex;flex-direction:column;min-width:260px}
  .side-toolbar{display:flex;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--panel);flex:none}
  .side-toolbar .st-label{font-size:11.5px;color:var(--muted);margin-right:auto}
  .dev-seg{display:flex;background:var(--bg2);border:1px solid var(--border);border-radius:9px;overflow:hidden}
  .dev-seg button{background:transparent;border:none;color:var(--muted);padding:6px 11px;font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;transition:.18s}
  .dev-seg button svg{width:15px;height:15px}
  .dev-seg button.active{background:linear-gradient(135deg,rgba(110,168,255,.3),rgba(139,123,255,.2));color:#fff;box-shadow:inset 0 0 0 1px rgba(110,168,255,.5)}
  .dev-seg button:not(:last-child){border-right:1px solid var(--border)}
  .device-stage{flex:1;position:relative;overflow:auto;display:flex;align-items:center;justify-content:center;padding:18px;
    background:radial-gradient(700px 400px at 50% 0%,rgba(110,168,255,.08),transparent 60%),
      repeating-linear-gradient(45deg,#0c1226 0 12px,#0a0f22 12px 24px)}

  .browser-frame{background:#e9edf5;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 26px 70px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.3);transform-origin:center center}
  .browser-frame[data-device="pc"]{width:100%;height:100%;border-radius:10px}
  .browser-frame[data-device="tablet"]{width:834px;height:1112px;border-radius:22px}
  .browser-frame[data-device="mobile"]{width:390px;height:800px;border-radius:34px;padding:0}
  .bf-titlebar{height:36px;background:linear-gradient(#39445f,#2d3852);
    display:flex;align-items:center;gap:12px;padding:0 13px;flex:none}
  .bf-dots{display:flex;gap:7px}
  .bf-dots i{width:12px;height:12px;border-radius:50%;display:block}
  .bf-dots i:nth-child(1){background:#ff5f57}.bf-dots i:nth-child(2){background:#febc2e}.bf-dots i:nth-child(3){background:#28c840}
  .bf-tab{font-size:12.5px;color:#c9d3e8;font-family:var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    background:rgba(255,255,255,.08);padding:5px 14px 5px 12px;border-radius:8px 8px 0 0;max-width:60%;display:flex;align-items:center;gap:7px}
  .bf-tab .favi{width:13px;height:13px;border-radius:3px;background:linear-gradient(135deg,var(--brand),var(--brand2));flex:none}
  .bf-toolbar{height:46px;background:#f4f6fb;display:flex;align-items:center;gap:9px;padding:0 11px;border-bottom:1px solid #d7deea;flex:none}
  .bf-nav{display:flex;gap:3px}
  .bf-nav button{width:30px;height:30px;border:none;background:transparent;border-radius:50%;color:#5b6577;cursor:pointer;display:grid;place-items:center}
  .bf-nav button:hover{background:#e4e9f2}
  .bf-nav button svg{width:17px;height:17px}
  .bf-address{flex:1;height:32px;background:#fff;border:1px solid #d7deea;border-radius:17px;display:flex;align-items:center;gap:8px;
    padding:0 13px;color:#334155;font-size:13px;font-family:var(--font);overflow:hidden}
  .bf-address .lock{color:#16a34a;flex:none;display:grid;place-items:center}
  .bf-address .lock svg{width:13px;height:13px}
  .bf-address .url{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bf-address .url b{color:#0f172a}
  .bf-address .star{margin-left:auto;color:#94a3b8;flex:none}
  .bf-address .star svg{width:15px;height:15px}
  .bf-viewport{flex:1;background:#fff;overflow:hidden;position:relative}
  .bf-viewport iframe{width:100%;height:100%;border:none;display:block;background:#fff}
  .browser-frame[data-device="mobile"] .bf-titlebar{height:26px;justify-content:center;position:relative}
  .browser-frame[data-device="mobile"] .bf-dots{display:none}
  .browser-frame[data-device="mobile"] .bf-tab{display:none}
  .browser-frame[data-device="mobile"] .bf-titlebar::after{content:'';width:120px;height:7px;border-radius:8px;background:#111827}
  .browser-frame[data-device="mobile"] .bf-toolbar{height:44px}
  .browser-frame[data-device="mobile"] .bf-nav button:nth-child(-n+2){display:none}
  .device-dim{font-size:11px;color:var(--faint);font-family:var(--mono)}
  .player-bar{padding:14px 22px;border-top:1px solid var(--border);background:var(--panel);display:flex;align-items:center;gap:14px}
  .progress{flex:1;height:7px;background:var(--bg2);border-radius:20px;overflow:hidden;cursor:pointer}
  .progress .fill{height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .12s linear}
  .p-time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:82px;text-align:center}
  .p-round{width:52px;height:52px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#0b1020;cursor:pointer;display:grid;place-items:center;flex:none;box-shadow:0 8px 22px rgba(110,168,255,.4)}
  .p-round svg{width:24px;height:24px}
  .p-round.sm{width:40px;height:40px;background:var(--panel2);color:var(--text)}
  .p-round.sm svg{width:18px;height:18px}
  .p-round.stop{background:linear-gradient(135deg,#ff6b7d,#ff8b5a);color:#2a0910;box-shadow:0 8px 22px rgba(255,107,125,.35)}
  .p-round.sim{background:linear-gradient(135deg,var(--sim),var(--brand2));color:#04121a;box-shadow:0 8px 22px rgba(0,229,255,.4)}

  @media (max-width:960px){ aside{width:280px} }
  @media (max-width:760px){
    aside{position:fixed;z-index:40;top:0;bottom:0;left:0;transform:translateX(-100%);transition:.24s;box-shadow:var(--shadow)}
    aside.show{transform:none}
    .menu-btn{display:inline-flex!important}
    .player-main{flex-direction:column}
    .player-resizer{display:none}
    .player-side{width:auto!important;border-left:none;border-top:1px solid var(--border);min-height:38vh}
    .player-left{min-height:34vh}
    .visual-console.open{height:52%}
    .sim-stats{grid-template-columns:repeat(2,1fr)}
  }
  .menu-btn{display:none}

  .toast-wrap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:var(--panel2);border:1px solid var(--border2);color:var(--text);padding:11px 18px;border-radius:11px;font-size:13.5px;box-shadow:var(--shadow);display:flex;align-items:center;gap:9px;animation:tin .25s ease}
  .toast.ok{border-color:var(--ok)} .toast.err{border-color:var(--danger)} .toast.warn{border-color:var(--warn)}
  @keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .modal-back{position:fixed;inset:0;z-index:250;background:rgba(6,9,20,.7);display:none;align-items:center;justify-content:center;padding:20px}
  .modal-back.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--border2);border-radius:var(--radius);width:100%;max-width:440px;box-shadow:var(--shadow);overflow:hidden}
  .modal h3{margin:0;padding:16px 18px;border-bottom:1px solid var(--border);font-size:15px}
  .modal .body{padding:18px}
  .modal .body p{margin:0 0 14px;color:var(--muted);font-size:13.5px;line-height:1.6}
  .modal input[type=text]{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;color:var(--text);font-family:inherit;font-size:14px}
  .modal input:focus{outline:none;border-color:var(--brand)}
  .modal .foot{display:flex;gap:10px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--border)}

  .kbd{font-family:var(--mono);font-size:11px;background:var(--bg2);border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--muted)}
  .save-ind{font-size:11.5px;color:var(--faint);display:flex;align-items:center;gap:6px}
  .save-ind .d{width:7px;height:7px;border-radius:50%;background:var(--ok)}
  .save-ind.saving .d{background:var(--warn)}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="btn icon ghost menu-btn" id="menuBtn" title="Menü">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
    </button>
    <div class="brand">
      <div class="logo">K</div>
      <div>
        <h1>KURS BUILDER <span style="color:var(--sim)">· SIM</span></h1>
        <span>HTML5 · CSS3 · JS — Animasyonlu Anlatım & Görsel Konsol</span>
      </div>
    </div>
    <div class="save-ind" id="saveInd"><span class="d"></span><span id="saveTxt">Kaydedildi</span></div>
    <div class="toolbar">
      <button class="btn ok" id="playBtn" title="Kurs modunda oynat">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Kursu Oynat
      </button>
      <button class="btn ghost" id="importBtn" title="JSON içe aktar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg> İçe Aktar
      </button>
      <button class="btn ghost" id="exportBtn" title="JSON dışa aktar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V3m0 0 4 4m-4-4-4 4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg> Dışa Aktar
      </button>
      <button class="btn ghost" id="htmlBtn" title="Tek dosya HTML">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></svg> HTML
      </button>

<script>
/* =========================================================================
   KURS BUILDER — SIM & ANIM · Görsel Konsol · Yüksek TTS
   ========================================================================= */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const uid = ()=> Math.random().toString(36).slice(2,9);
const esc = s => (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STORE_KEY = 'kurs_builder_sim_v1';

/* ---------- Eğitmen bağlantıları ---------- */
const INSTRUCTOR_LINKS = [
  { label:'Udemy',        url:'https://www.udemy.com/user/okan-kaplan-7/' },
  { label:'YouTube',      url:'https://www.youtube.com/@KişiselGelişim-Video-Pdf-img' },
  { label:'Web',          url:'https://okankaplanedu.github.io/' },
  { label:'Bilgi-Beceri', url:'https://bilgibeceri.com' },
  { label:'LinkedIn',     url:'https://www.linkedin.com/in/canvasor/recent-activity/all/' },
];
function qrSVG(text, size){
  size = size || 150;
  try{
    const qr = qrcode(0, 'M');
    qr.addData(text); qr.make();
    const count = qr.getModuleCount();
    const cell = (size / count);
    let rects = '';
    for(let r=0;r<count;r++) for(let c=0;c<count;c++) if(qr.isDark(r,c))
      rects += '<rect x="'+(c*cell).toFixed(2)+'" y="'+(r*cell).toFixed(2)+'" width="'+cell.toFixed(2)+'" height="'+cell.toFixed(2)+'"/>';
    return '<svg xmlns="http://www.w3.org/2000/svg" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" shape-rendering="crispEdges"><rect width="'+size+'" height="'+size+'" fill="#fff"/><g fill="#000">'+rects+'</g></svg>';
  }catch(e){ return ''; }
}
function linksBlockHTML(){
  const cards = INSTRUCTOR_LINKS.map(l=>
    '<div class="lk-card">'+
      '<div class="lk-qr">'+qrSVG(l.url, 132)+'</div>'+
      '<div class="lk-name">'+esc(l.label)+'</div>'+
      '<a class="lk-url" href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.url.replace(/^https?:\/\//,'').replace(/\/$/,''))+'</a>'+
    '</div>'
  ).join('');
  return '<div class="links-section">'+
    '<h3 class="sec">🔗 Eğitmen Bağlantıları</h3>'+
    '<p class="lk-hint">Bağlantılara tıklayabilir veya QR kodları telefonunuzla okutabilirsiniz.</p>'+
    '<div class="lk-grid">'+cards+'</div>'+
  '</div>';
}

/* ---------- Starter ---------- */
function starterCourse(){
  const L = (title, html, css, js, narration) => ({id:uid(), title, code:{html,css,js}, narration, audio:null, audioName:null});
  return {
    meta:{ title:"HTML5 · CSS3 · JavaScript · DOM · Animasyon — Sıfırdan Uzmanlığa", author:"", updated:Date.now() },
    modules:[
      { id:uid(), title:`Modül 1 — HTML5 Temelleri`, collapsed:false, lessons:[
        L(`Web Nasıl Çalışır? İlk Sayfa`,
`<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>İlk Sayfam</title>
  </head>
  <body>
    <h1>Merhaba Dünya</h1>
    <p>Bu benim ilk web sayfam.</p>
  </body>
</html>`,
`body{ font-family:system-ui, sans-serif; padding:2rem; color:#1f2937; }
h1{ color:#2563eb; }`,
``,
`Web'in nasıl çalıştığını anlamak her şeyin temelidir. Bir tarayıcıya adres yazdığınızda, tarayıcı o adresteki sunucuya bir istek gönderir ve sunucu geriye bir HTML belgesi döndürür; tarayıcı bu belgeyi okuyup ekranda görsel bir sayfaya dönüştürür. HTML yani HyperText Markup Language bir işaretleme dilidir; içeriği etiketlerle sarmalayarak ona anlam kazandırır. Bir web sayfasının üç temel katmanı vardır: yapı için HTML, görünüm için CSS ve davranış için JavaScript. Bu ilk sayfada yapı katmanını görüyoruz. doctype bildirimi tarayıcıya belgenin modern HTML5 standardında olduğunu söyler. html etiketi tüm belgeyi sarar, head bölümü ekranda görünmeyen kimlik bilgilerini, body bölümü ise kullanıcının gördüğü tüm içeriği barındırır. Bu ayrımı en baştan kavramak, ilerideki her konuyu çok daha kolay öğrenmenizi sağlar.`),
        L(`Belge İskeleti ve Meta Etiketleri`,
`<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="HTML5 öğrenme sayfası" />
    <title>Belge İskeleti</title>
  </head>
  <body>
    <h1>Sağlam bir iskelet</h1>
  </body>
</html>`,
`body{ font-family:system-ui, sans-serif; padding:2rem; }
h1{ color:#2563eb; }`,
``,
`Her profesyonel HTML5 belgesi aynı sağlam iskeletle başlar ve bu iskeletin her parçasının bir görevi vardır. doctype html satırı tarayıcının standart modda çalışmasını sağlar; bu satır olmadığında tarayıcı eski uyumluluk moduna düşer ve sayfa beklenmedik görünebilir. html etiketindeki lang özniteliği sayfanın dilini belirtir; bu hem ekran okuyucuların doğru telaffuz yapması hem de arama motorlarının içeriği doğru sınıflandırması için önemlidir. head bölümü sayfanın kimlik kartıdır. charset UTF-8 Türkçedeki ş, ğ, ı gibi karakterlerin doğru görüntülenmesini garanti eder ve mutlaka en başta yer almalıdır. viewport meta etiketi sayfanın mobil cihazlarda düzgün ölçeklenmesini sağlar; bu satır olmadan responsive tasarım çalışmaz. description meta etiketi arama sonuçlarında görünen açıklamayı belirler. title ise tarayıcı sekmesinde ve arama sonuçlarında görünen başlıktır. Bu iskeleti ezberlemek yerine anlamak, kendi sayfalarınızı özgüvenle kurmanızı sağlar.`),
      ]},
    ]
  };
}

let course = null;
let activeLessonId = null;
let activeTab = 'code';
let codeLang = 'html';
let previewTimer = null;
let dirty = false;

/* ---------- Persist ---------- */
function load(){
  try{ const raw = localStorage.getItem(STORE_KEY); if(raw) course = JSON.parse(raw); }catch(e){}
  if(!course || !course.modules || !course.modules.length){ course = starterCourse(); }
  outer: for(const m of course.modules){ for(const l of m.lessons){ activeLessonId=l.id; break outer; } }
}
function save(){
  course.meta.updated = Date.now();
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(course)); }
  catch(e){ toast('Kaydedilemedi: depolama dolu olabilir.','err'); }
  setSaved();
}
let saveTimer=null;
function markDirty(){
  dirty=true; const ind=$('#saveInd'); ind.classList.add('saving'); $('#saveTxt').textContent='Kaydediliyor…';
  clearTimeout(saveTimer); saveTimer=setTimeout(()=>{ save(); }, 600);
}
function setSaved(){ dirty=false; const ind=$('#saveInd'); ind.classList.remove('saving'); $('#saveTxt').textContent='Kaydedildi'; }

function findLesson(id){
  for(const m of course.modules){ const l=m.lessons.find(x=>x.id===id); if(l) return {module:m, lesson:l}; }
  return null;
}
function activeCtx(){ return activeLessonId ? findLesson(activeLessonId) : null; }
function allLessonsFlat(){ const arr=[]; course.modules.forEach(m=>m.lessons.forEach(l=>arr.push({module:m,lesson:l}))); return arr; }

/* ============================================================
   🔷 GÖRSEL KONSOL (VC) — SIM & ANIM olay kaydı
   ============================================================ */
const VC = {
  lines: [],
  max: 400,
  unread: 0,
  open: false,
  add(type, msg){
    const now = new Date();
    const t = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0')+'.'+String(now.getMilliseconds()).padStart(3,'0');
    this.lines.push({t, type, msg});
    if(this.lines.length>this.max) this.lines.shift();
    if(!this.open) this.unread++;
    this.render();
  },
  info(m){ this.add('info', m); },
  ok(m){ this.add('ok', m); },
  warn(m){ this.add('warn', m); },
  err(m){ this.add('err', m); },
  code(m){ this.add('code', m); },
  anim(m){ this.add('anim', m); },
  tts(m){ this.add('tts', m); },
  sim(m){ this.add('sim', m); },
  render(){
    const body = $('#vcBody'); if(!body) return;
    body.innerHTML = this.lines.slice(-200).map(l=>
      `<div class="vc-line ${l.type}"><span class="vc-time">${l.t}</span><span class="vc-tag">${l.type.toUpperCase()}</span><span class="vc-msg">${esc(l.msg)}</span></div>`
    ).join('');
    body.scrollTop = body.scrollHeight;
    const ind = $('#vcIndicator');
    if(ind){ if(this.unread>0 && !this.open){ ind.classList.add('badge'); ind.dataset.count=this.unread>99?'99+':this.unread; } else { ind.classList.remove('badge'); } }
  },
  toggle(force){
    this.open = (typeof force==='boolean') ? force : !this.open;
    const el = $('#visualConsole'); if(el) el.classList.toggle('open', this.open);
    if(this.open){ this.unread=0; this.render(); }
  },
  clear(){ this.lines.length=0; this.unread=0; this.render(); },
  copy(){
    const txt = this.lines.map(l=>`[${l.t}] ${l.type.toUpperCase()}  ${l.msg}`).join('\n');
    copyText(txt).then(()=>toast('Konsol kopyalandı','ok'));
  }
};

/* ============================================================
   🔶 SIM — tüm içeriği tek yapıda topla
   ============================================================ */
function collectSIM(){
  const flat = allLessonsFlat();
  const modules = course.modules.map((m,mi)=>({
    index: mi+1,
    id: m.id,
    title: m.title,
    lessonCount: m.lessons.length,
    lessons: m.lessons.map((l,li)=>({
      index: li+1,
      id: l.id,
      title: l.title,
      hasAudio: !!l.audio,
      audioSize: l.audio ? l.audio.length : 0,
      narrationLength: (l.narration||'').length,
      narrationWords: (l.narration||'').trim().split(/\s+/).filter(Boolean).length,
      codeLength: { html:(l.code.html||'').length, css:(l.code.css||'').length, js:(l.code.js||'').length }
    }))
  }));
  const totalCodeChars = flat.reduce((a,x)=>a+(x.lesson.code.html||'').length+(x.lesson.code.css||'').length+(x.lesson.code.js||'').length,0);
  const totalNarrWords = flat.reduce((a,x)=>a+(x.lesson.narration||'').trim().split(/\s+/).filter(Boolean).length,0);
  const totalAudio = flat.filter(x=>x.lesson.audio).length;
  const sim = {
    generated: new Date().toISOString(),
    version: 'KURS-BUILDER-SIM/1.0',
    meta: course.meta,
    stats: {
      modules: course.modules.length,
      lessons: flat.length,
      audioLessons: totalAudio,
      totalCodeChars,
      totalNarrWords,
      estNarrationMinutes: Math.round((totalNarrWords/150)*10)/10,
      activeDevice: $('#pBrowser') ? $('#pBrowser').dataset.device : 'pc',
      visualConsoleLines: VC.lines.length
    },
    timeline: VC.lines.slice(-120).map(l=>({t:l.t, type:l.type, msg:l.msg})),
    modules
  };
  return sim;
}

/* ============================================================
   🎬 CİHAZ MORPH ANİMASYONU — dinamik browser değişimi
   ============================================================ */
function triggerDeviceMorph(newDev, oldDev){
  const stage = $('#pStage'); const toastEl = $('#pDevToast'); const toastTxt = $('#pDevToastTxt');
  if(!stage) return;
  const label = { pc:'🖥 PC Modu', tablet:'📱 Tablet Modu', mobile:'📲 Mobil Modu' }[newDev] || newDev;
  if(toastTxt) toastTxt.textContent = label;
  if(toastEl){ toastEl.classList.add('show'); setTimeout(()=>toastEl.classList.remove('show'),1400); }
  // morph animasyon sınıfı
  stage.classList.remove('morph-pc','morph-tablet','morph-mobile');
  void stage.offsetWidth;
  stage.classList.add('morph-'+newDev);
  // ripple
  stage.classList.remove('rippling'); void stage.offsetWidth; stage.classList.add('rippling');
  // particle burst
  spawnParticles(stage);
  VC.anim(`Cihaz morph: ${oldDev||'?'} → ${newDev}  (scale+flip+ripple)`);
  setTimeout(()=>{ stage.classList.remove('morph-pc','morph-tablet','morph-mobile','rippling'); },900);
}
function spawnParticles(stage){
  const burst = document.createElement('div');
  burst.className='particle-burst';
  stage.appendChild(burst);
  const N = 26;
  for(let i=0;i<N;i++){
    const p = document.createElement('span');
    p.className='pt';
    const ang = (Math.PI*2*i/N) + Math.random()*0.5;
    const dist = 90 + Math.random()*140;
    const dx = Math.cos(ang)*dist, dy = Math.sin(ang)*dist;
    p.style.setProperty('--dx', dx+'px');
    p.style.setProperty('--dy', dy+'px');
    p.style.animationDelay = (Math.random()*0.15)+'s';
    p.style.width = p.style.height = (4+Math.random()*10)+'px';
    burst.appendChild(p);
  }
  setTimeout(()=>burst.remove(), 1100);
}

/* ============================================================
   🧠 Kod → Sonuç köprüsü (bridge iframe içine enjekte edilir)
   ============================================================ */
const LOCATOR_BRIDGE = `<script>(function(){
  function resolve(loc){
    try{
      if(!loc) return null;
      if(loc.type==='sel'){ return document.querySelector(loc.sel); }
      if(loc.type==='tag'){ var els=document.getElementsByTagName(loc.tag); return els[(loc.nth||1)-1]||els[0]||null; }
    }catch(e){}
    return null;
  }
  window.addEventListener('message', function(ev){
    var d=ev.data; if(!d||d.__kb!=='locate') return;
    var el=resolve(d.loc), r=null, label='';
    if(el){ var b=el.getBoundingClientRect();
      r={x:b.left,y:b.top,w:b.width,h:b.height};
      label='<'+el.tagName.toLowerCase()+(el.id?('#'+el.id):(el.className&&typeof el.className==='string'&&el.className.trim()?('.'+el.className.trim().split(/\\s+/)[0]):''))+'>';
    }
    (ev.source||window.parent).postMessage({__kb:'located', id:d.id, rect:r, label:label, dw:document.documentElement.clientWidth, dh:document.documentElement.clientHeight}, '*');
  });
})();<\/script>`;
function buildDoc(code){
  return `<!doctype html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>${code.css||''}</style></head><body>${code.html||''}<script>${code.js||''}<\/script>${LOCATOR_BRIDGE}</body></html>`;
}

$('#tree').addEventListener('click', e=>{
  const actBtn=e.target.closest('[data-act]');
  if(actBtn){ e.stopPropagation(); handleAct(actBtn.dataset.act, actBtn.dataset.id); return; }
  const addBtn=e.target.closest('[data-add-lesson]');
  if(addBtn){ addLesson(addBtn.dataset.addLesson); return; }
  const les=e.target.closest('[data-lesson]');
  if(les){ selectLesson(les.dataset.lesson); return; }
  const head=e.target.closest('[data-mod]');
  if(head){ const m=course.modules.find(x=>x.id===head.dataset.mod); m.collapsed=!m.collapsed; save(); renderTree(); }
});

function handleAct(act, id){
  if(act==='renameMod'){ const m=course.modules.find(x=>x.id===id); prompt2('Modülü yeniden adlandır','Modül başlığı:',m.title,v=>{ if(v){m.title=v; save(); renderTree();} }); }
  else if(act==='delMod'){ const m=course.modules.find(x=>x.id===id); confirm2('Modülü sil','"'+m.title+'" ve içindeki tüm dersler silinecek. Emin misiniz?',()=>{ course.modules=course.modules.filter(x=>x.id!==id); if(!findLesson(activeLessonId)){ const f=allLessonsFlat()[0]; activeLessonId=f?f.lesson.id:null; } save(); renderTree(); renderEditor(); toast('Modül silindi','ok'); }); }
  else if(act==='moveModUp'){ moveMod(id,-1); }
  else if(act==='moveModDown'){ moveMod(id,1); }
  else if(act==='renameLesson'){ const c=findLesson(id); prompt2('Dersi yeniden adlandır','Ders adı:',c.lesson.title,v=>{ if(v){c.lesson.title=v; save(); renderTree(); renderEditor();} }); }
  else if(act==='dupLesson'){ const c=findLesson(id); const copy=JSON.parse(JSON.stringify(c.lesson)); copy.id=uid(); copy.title=c.lesson.title+' (kopya)'; const i=c.module.lessons.indexOf(c.lesson); c.module.lessons.splice(i+1,0,copy); save(); renderTree(); toast('Ders çoğaltıldı','ok'); }
  else if(act==='delLesson'){ const c=findLesson(id); confirm2('Dersi sil','"'+c.lesson.title+'" silinecek. Emin misiniz?',()=>{ c.module.lessons=c.module.lessons.filter(x=>x.id!==id); if(activeLessonId===id){ const f=allLessonsFlat()[0]; activeLessonId=f?f.lesson.id:null; } save(); renderTree(); renderEditor(); toast('Ders silindi','ok'); }); }
}
function moveMod(id,dir){ const i=course.modules.findIndex(x=>x.id===id); const j=i+dir; if(j<0||j>=course.modules.length) return; [course.modules[i],course.modules[j]]=[course.modules[j],course.modules[i]]; save(); renderTree(); }

const ANIM_CYCLE_MS = 14000;

function makeHL(rules){
  const combined=new RegExp(rules.map(r=>'('+r.re+')').join('|'),'g');
  const tokenize=function(src){
    const segs=[]; let last=0, m; combined.lastIndex=0;
    while((m=combined.exec(src))){
      if(m.index>last) segs.push({cls:'', text:src.slice(last,m.index)});
      let gi=-1; for(let i=1;i<m.length;i++){ if(m[i]!==undefined){ gi=i; break; } }
      segs.push({cls:rules[gi-1].cls, text:m[gi]});
      last=combined.lastIndex;
      if(m.index===combined.lastIndex) combined.lastIndex++;
    }
    if(last<src.length) segs.push({cls:'', text:src.slice(last)});
    return segs;
  };
  const fn=src=> tokenize(src).map(s=> s.cls?'<span class="'+s.cls+'">'+esc(s.text)+'</span>':esc(s.text)).join('');
  fn.tokenize=tokenize;
  return fn;
}
const hlHTML=makeHL([
  {re:'<!--[\\s\\S]*?-->', cls:'tok-com'},
  {re:'</?[a-zA-Z][\\w-]*', cls:'tok-tag'},
  {re:'"[^"]*"|\'[^\']*\'', cls:'tok-str'},
  {re:'[a-zA-Z-]+(?=\\s*=)', cls:'tok-attr'},
  {re:'/?>', cls:'tok-punct'},
]);
const hlCSS=makeHL([
  {re:'/\\*[\\s\\S]*?\\*/', cls:'tok-com'},
  {re:'"[^"]*"|\'[^\']*\'', cls:'tok-str'},
  {re:'#[0-9a-fA-F]{3,8}\\b', cls:'tok-val'},
  {re:'[.#@][A-Za-z][\\w-]*', cls:'tok-sel'},
  {re:'[A-Za-z-]+(?=\\s*:)', cls:'tok-prop'},
  {re:'\\b\\d+(?:\\.\\d+)?(?:px|rem|em|%|vh|vw|s|ms|deg|fr|pt)?\\b', cls:'tok-num'},
  {re:'[{}]', cls:'tok-punct'},
]);
const hlJS=makeHL([
  {re:'//[^\\n]*|/\\*[\\s\\S]*?\\*/', cls:'tok-com'},
  {re:'"[^"]*"|\'[^\']*\'|`[^`]*`', cls:'tok-str'},
  {re:'\\b(?:const|let|var|function|return|if|else|for|while|do|of|in|new|true|false|null|undefined|this|class|import|export|typeof)\\b', cls:'tok-kw'},
  {re:'=>', cls:'tok-kw'},
  {re:'\\b\\d+(?:\\.\\d+)?\\b', cls:'tok-num'},
  {re:'[A-Za-z_$][\\w$]*(?=\\s*\\()', cls:'tok-fn'},
]);
const SEC=[
  {key:'html', icon:'🏷️', label:'HTML', fn:hlHTML},
  {key:'css',  icon:'🎨', label:'CSS',  fn:hlCSS},
  {key:'js',   icon:'⚙️', label:'JS',   fn:hlJS},
];
function lineToChars(line, fn){
  if(!line.length) return '';
  return fn.tokenize(line).map(seg=>{
    const cls = seg.cls ? 'c '+seg.cls : 'c';
    let out='';
    for(const ch of seg.text){ out += `<span class="${cls}">${esc(ch)}</span>`; }
    return out;
  }).join('');
}
function buildLocators(sec, raw){
  const lines=raw.split('\n');
  const out=new Array(lines.length).fill(null);
  if(sec==='html'){
    const counts={}; let last=null;
    lines.forEach((line,i)=>{
      const m=line.match(/<([a-zA-Z][\w-]*)(\s|>|\/|$)/);
      if(m){ const tag=m[1].toLowerCase();
        if(tag!=='!doctype'){ counts[tag]=(counts[tag]||0)+1; last={type:'tag',tag,nth:counts[tag]}; }
      }
      out[i]=last;
    });
  } else if(sec==='css'){
    let cur=null;
    lines.forEach((line,i)=>{
      const bi=line.indexOf('{');
      if(bi>=0){ let selRaw=line.slice(0,bi).trim();
        if(selRaw){ const first=selRaw.split(',')[0].trim().replace(/::?[a-zA-Z-]+(\([^)]*\))?/g,'').trim();
          if(first && first!=='@'&&!first.startsWith('@')&&!first.startsWith('from')&&!first.startsWith('to')&&!/^\d/.test(first)) cur={type:'sel',sel:first}; else cur=null; }
      }
      out[i]=cur;
      if(line.indexOf('}')>=0) cur=null;
    });
  } else if(sec==='js'){
    let last=null;
    lines.forEach((line,i)=>{
      let sel=null;
      let m=line.match(/getElementById\(\s*['"`]([^'"`]+)['"`]/);
      if(m) sel='#'+m[1];
      if(!sel){ m=line.match(/querySelector(?:All)?\(\s*['"`]([^'"`]+)['"`]/); if(m) sel=m[1]; }
      if(!sel && /document\.body/.test(line)) sel='body';
      if(sel){ last={type:'sel',sel}; out[i]=last; } else out[i]=last;
    });
  }
  return out.map(l=>l?JSON.stringify(l):'');
}
function renderCodeTheater(code){
  let html='';
  SEC.forEach(sec=>{
    const raw=(code[sec.key]||'').replace(/\s+$/,'');
    if(!raw.trim()) return;
    const locs=buildLocators(sec.key, raw);
    html+=`<div class="sec-head ${sec.key}">${sec.icon} ${sec.label}</div><div class="code-theater">`;
    raw.split('\n').forEach((line,i)=>{
      const inner = line.length ? lineToChars(line, sec.fn) : '&nbsp;';
      const loc = locs[i] ? ` data-loc='${esc(locs[i])}'` : '';
      html+=`<div class="cline" data-step data-key="${sec.key}"${loc}><span class="ln">${i+1}</span><code>${inner}</code></div>`;
    });
    html+='</div>';
  });
  return html || '<div style="color:var(--faint);padding:20px;font-family:sans-serif">Bu ders için kod girilmemiş.</div>';
}

function fmt(s){ s=Math.max(0,s||0); const m=Math.floor(s/60), r=Math.floor(s%60); return m+':'+String(r).padStart(2,'0'); }
function setPlayIcon(playing){

function startCodeLoop(){
  if(!player.animPaused) return;
  if(!player.charEls.length) return;
  player.animPaused=false;
  player.animStarted=Date.now();
  player.animTimer=setInterval(()=>{
    const total=player.animElapsed+(Date.now()-player.animStarted);
    const p=(total % ANIM_CYCLE_MS)/ANIM_CYCLE_MS;
    revealChars(p);
  }, 55);
}
function pauseCodeLoop(){
  if(player.animPaused) return;
  player.animPaused=true;
  player.animElapsed+=(Date.now()-player.animStarted);
  if(player.animTimer){ clearInterval(player.animTimer); player.animTimer=null; }
}
function resetCodeLoop(){
  pauseCodeLoop();
  player.animElapsed=0;
  player.revealed=-1;
  if(player.charEls) player.charEls.forEach(e=>{ e.classList.remove('on'); e.classList.remove('cur'); });
  if(player.lineEls) player.lineEls.forEach(e=>e.classList.remove('on'));
  player.activeLine=null;
  hideLink();
}
function stopPlayback(){
  if(window.speechSynthesis) speechSynthesis.cancel();
  player.audio.pause();
  clearInterval(player.timer); player.timer=null;
  cancelAnimationFrame(player.raf);
  pauseCodeLoop();
  setPlayIcon(false);
  updateTTSHud(false);
}
function stopPlaybackFull(){
  stopPlayback();

function togglePlay(){

function pausePlayback(){
  if(player.mode==='audio'){ player.audio.pause(); }
  else if(player.mode==='tts'){ if(speechSynthesis.speaking && !speechSynthesis.paused) speechSynthesis.pause(); }
  pauseCodeLoop();
  setPlayIcon(false);
  updateTTSHud(false);

function applyCaptionProgress(p){
  p=Math.min(1,Math.max(0,p));
  const nC=player.capEls.length;
  if(nC){ const act=Math.min(nC-1, Math.floor(p*nC)); player.capEls.forEach((e,i)=>e.classList.toggle('now', i===act)); }
  $('#pFill').style.width=(p*100)+'%';
}
function revealChars(p){
  const n=player.charEls.length; if(!n) return;
  const target=Math.min(n-1, Math.round(p*(n-1)));
  if(target===player.revealed) return;
  if(target>player.revealed){
    for(let i=player.revealed+1;i<=target;i++) player.charEls[i].classList.add('on');
  } else {
    for(let i=player.revealed;i>target;i--) player.charEls[i].classList.remove('on');
  }
  player.revealed=target;
  player.charEls.forEach(e=>e.classList.remove('cur'));
  const cur=player.charEls[target]; if(cur){ cur.classList.add('cur'); markActiveLine(cur); }
}
function markActiveLine(charEl){
  const line=charEl.closest('.cline'); if(!line) return;
  if(line===player.activeLine) return;
  player.activeLine=line;
  player.lineEls.forEach(e=>e.classList.remove('on'));
  line.classList.add('on');
  const box=$('#pCode').getBoundingClientRect(); const r=line.getBoundingClientRect();
  if(r.bottom>box.bottom-60||r.top<box.top+60) line.scrollIntoView({block:'center',behavior:'smooth'});
  requestLink(line);
}
function setFx(on){
  player.fxOn=on;
  $('#pCode').classList.toggle('fx-on', on);
  const btn=$('#pFx'); if(btn) btn.classList.toggle('off', !on);
  if(!on){ hideLink(); VC.anim('Kod→Sonuç bağlantısı KAPALI'); }
  else { VC.anim('Kod→Sonuç bağlantısı AÇIK'); if(player.activeLine) requestLink(player.activeLine); }
}
function hideLink(){ $('#pLinkLayer').classList.remove('show'); $('#pElBox').classList.remove('show'); }
function requestLink(line){
  if(!player.fxOn || !line){ hideLink(); return; }
  const raw=line.getAttribute('data-loc');
  if(!raw){ hideLink(); return; }
  let loc=null; try{ loc=JSON.parse(raw); }catch(e){}
  if(!loc){ hideLink(); return; }
  const fr=$('#pFrame'); if(!fr||!fr.contentWindow){ hideLink(); return; }
  player.linkReq=(player.linkReq||0)+1;
  player.linkPending={id:player.linkReq, line};
  fr.contentWindow.postMessage({__kb:'locate', id:player.linkReq, loc}, '*');
}
function onLocated(msg){
  const p=player.linkPending;
  if(!p || msg.id!==p.id) return;
  if(!msg.rect){ hideLink(); return; }
  drawLink(p.line, msg);
}
function drawLink(line, msg){
  if(!player.fxOn){ hideLink(); return; }
  const main=$('.player-main'), layer=$('#pLinkLayer'), svg=$('#pLinkSvg');
  const path=$('#pLinkPath'), head=$('#pLinkHead'), box=$('#pElBox'), tag=$('#pLinkTag');
  const fr=$('#pFrame'); if(!main||!svg||!fr) return;
  const host=main.getBoundingClientRect();
  const codeBox=$('#pCode').getBoundingClientRect();
  const lr=line.getBoundingClientRect();
  if(lr.bottom<codeBox.top+4 || lr.top>codeBox.bottom-4){ hideLink(); return; }
  const fRect=fr.getBoundingClientRect();
  const sx=msg.dw? fRect.width/msg.dw : 1;
  const sy=msg.dh? fRect.height/msg.dh : 1;
  const ex=fRect.left + msg.rect.x*sx, ey=fRect.top + msg.rect.y*sy;
  const ew=Math.max(6, msg.rect.w*sx), eh=Math.max(6, msg.rect.h*sy);
  let bx=ex-host.left, by=ey-host.top;
  const vpL=fRect.left-host.left, vpT=fRect.top-host.top, vpR=fRect.right-host.left, vpB=fRect.bottom-host.top;
  const cbx=Math.max(vpL,bx), cby=Math.max(vpT,by);
  const cbw=Math.min(vpR,bx+ew)-cbx, cbh=Math.min(vpB,by+eh)-cby;
  if(cbw<=2||cbh<=2){ hideLink(); return; }
  box.style.left=cbx+'px'; box.style.top=cby+'px'; box.style.width=cbw+'px'; box.style.height=cbh+'px';
  box.classList.add('show');
  tag.querySelector('#pLinkTagText').textContent=msg.label||'render';
  let tgx=cbx+cbw/2, tgy=cby-8; if(tgy<vpT+18) tgy=cby+cbh+26;
  tag.style.left=tgx+'px'; tag.style.top=tgy+'px';
  const W=host.width, H=host.height;
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  const startX=Math.min(codeBox.right-host.left-6, lr.right-host.left+14);
  const startY=lr.top-host.top+lr.height/2;
  const endX=cbx-8, endY=cby+cbh/2;
  const midX=(startX+endX)/2;
  path.setAttribute('d',`M ${startX} ${startY} C ${midX} ${startY} ${midX} ${endY} ${endX} ${endY}`);
  const ang=Math.atan2(endY-endY, endX-midX), ah=14;
  const p1x=endX, p1y=endY;
  const p2x=p1x-ah*Math.cos(ang-0.42), p2y=p1y-ah*Math.sin(ang-0.42);
  const p3x=p1x-ah*Math.cos(ang+0.42), p3y=p1y-ah*Math.sin(ang+0.42);
  head.setAttribute('points',`${p1x},${p1y} ${p2x},${p2y} ${p3x},${p3y}`);

function updateTTSHud(active, progress){

function playWithAudio(l){
  player.mode='audio';

  if(a.src!==l.audio){ a.src=l.audio; }
  a.playbackRate=player.rate;
  a.onloadedmetadata=()=>{ $('#pTime').textContent='0:00 / '+fmt(a.duration); };
  a.play().then(()=>{ setPlayIcon(true); VC.tts('MP3 çalınıyor: '+(l.audioName||'ses')); }).catch(()=>{ toast('Ses çalınamadı, TTS kullanılıyor.','warn'); VC.warn('MP3 çalınamadı, TTS\'e düşüldü'); playWithTTS(l); });
  startCodeLoop();
  updateTTSHud(true, 0);
  $('#ttsState').textContent='MP3 Oynuyor'; $('#ttsInfo').textContent=(l.audioName||'ses');
  const tick=()=>{
    const dur=a.duration||0; const cur=a.currentTime;
    $('#pTime').textContent=fmt(cur)+' / '+fmt(dur);
    applyCaptionProgress(dur?cur/dur:0);
    updateTTSHud(true, dur?cur/dur:0);
    if(!a.paused && !a.ended) player.raf=requestAnimationFrame(tick);
  };
  player.raf=requestAnimationFrame(tick);
  a.onended=()=>{ setPlayIcon(false); pauseCodeLoop(); applyCaptionProgress(1); updateTTSHud(false); VC.ok('MP3 bitti → autoNext'); autoNext(); };
  a.onpause=()=>setPlayIcon(false);
}
function playWithTTS(l){
  if(!('speechSynthesis' in window)){ toast('Tarayıcı TTS desteklemiyor.','err'); return; }
  player.mode='tts';
  if(speechSynthesis.paused){ speechSynthesis.resume(); setPlayIcon(true); startCodeLoop(); VC.tts('TTS devam'); return; }
  const text=(l.narration||'').trim();
  const dur=estimateDuration(text||'x'); let started=Date.now();
  if(!text){
    speechSynthesis.cancel();
    clearInterval(player.timer); setPlayIcon(true);
    startCodeLoop();
    updateTTSHud(true, 0);
    $('#ttsState').textContent='Anlatım (sessiz)'; $('#ttsInfo').textContent='metin yok';
    const total=dur*1000; const t0=Date.now();
    player.timer=setInterval(()=>{ const p=(Date.now()-t0)/total; applyCaptionProgress(p); updateTTSHud(true,p); $('#pTime').textContent=fmt((Date.now()-t0)/1000)+' / ~'+fmt(dur); if(p>=1){ clearInterval(player.timer); setPlayIcon(false); pauseCodeLoop(); updateTTSHud(false); autoNext(); } }, 90);
    return;
  }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  const v=pickVoice(); if(v){ u.voice=v; u.lang=v.lang; } else u.lang='tr-TR';
  u.rate=player.rate;
  const pitch=$('#ttsPitch'); u.pitch = pitch ? +pitch.value : 1;
  const vol=$('#ttsVol'); u.volume = vol ? +vol.value : 1;
  let boundaryFired=false;
  const totalWords = text.trim().split(/\s+/).filter(Boolean).length;
  u.onboundary=(e)=>{
    boundaryFired=true;
    const p=(e.charIndex||0)/Math.max(1,text.length);
    applyCaptionProgress(p);
    updateTTSHud(true, p);
    $('#pTime').textContent=fmt((Date.now()-started)/1000)+' / ~'+fmt(dur);
    const estWord = Math.floor(p*totalWords);
    $('#ttsState').textContent='Konuşuyor'; $('#ttsInfo').textContent=`~${estWord}/${totalWords} kelime · ${player.rate}×`;
  };
  u.onend=()=>{ setPlayIcon(false); pauseCodeLoop(); applyCaptionProgress(1); updateTTSHud(false); VC.ok('TTS bitti → autoNext'); autoNext(); };
  u.onpause=()=>{ setPlayIcon(false); updateTTSHud(false); };
  u.onerror=(e)=>{ VC.err('TTS hata: '+(e.error||'bilinmeyen')); };
  speechSynthesis.speak(u); setPlayIcon(true);
  updateTTSHud(true, 0);
  $('#ttsState').textContent='Konuşuyor'; $('#ttsInfo').textContent=`${totalWords} kelime · ${player.rate}×`;
  VC.tts(`TTS başladı: ${totalWords} kelime · hız ${player.rate}×`);
  startCodeLoop();
  clearInterval(player.timer);
  const t0=Date.now();
  player.timer=setInterval(()=>{
    if(boundaryFired){ clearInterval(player.timer); return; }
    if(!speechSynthesis.speaking){ clearInterval(player.timer); return; }
    const p=(Date.now()-t0)/(dur*1000);
    applyCaptionProgress(p);
    updateTTSHud(true,p);
  }, 100);
}

function initResizer(){
  const rez=$('#pResizer'), side=$('#pSide'), main=$('#pResizer').parentElement;
  let dragging=false;
  const down=e=>{ dragging=true; rez.classList.add('drag'); document.body.classList.add('col-resizing'); e.preventDefault(); };
  const move=e=>{ if(!dragging) return;
    const cx=(e.touches?e.touches[0].clientX:e.clientX);
    const rect=main.getBoundingClientRect();
    let sideW=rect.right-cx;
    const min=280, max=rect.width-360;
    sideW=Math.max(min, Math.min(max, sideW));
    side.style.width=sideW+'px';
    fitDevice();
  };
  const up=()=>{ if(!dragging) return; dragging=false; rez.classList.remove('drag'); document.body.classList.remove('col-resizing'); };
  rez.addEventListener('mousedown',down); rez.addEventListener('touchstart',down,{passive:false});
  window.addEventListener('mousemove',move); window.addEventListener('touchmove',move,{passive:false});
  window.addEventListener('mouseup',up); window.addEventListener('touchend',up);
}

function exportJSON(){

function importJSON(file){
  const r=new FileReader();
  r.onload=()=>{ try{ const obj=JSON.parse(r.result); if(!obj.modules||!Array.isArray(obj.modules)) throw new Error('Geçersiz'); course=normalize(obj); const f=allLessonsFlat()[0]; activeLessonId=f?f.lesson.id:null; save(); renderTree(); renderEditor(); toast('Kurs içe aktarıldı ✓','ok'); VC.ok('Kurs içe aktarıldı: '+course.modules.length+' modül'); }catch(e){ toast('Geçersiz JSON dosyası.','err'); VC.err('İçe aktarma hatası: '+e.message); } };
  r.readAsText(file);
}
function normalize(obj){
  obj.meta=obj.meta||{title:'Kurs',updated:Date.now()};
  obj.modules.forEach(m=>{ m.id=m.id||uid(); m.collapsed=!!m.collapsed; m.lessons=m.lessons||[]; m.lessons.forEach(l=>{ l.id=l.id||uid(); l.code=l.code||{html:'',css:'',js:''}; l.narration=l.narration||''; l.audio=l.audio||null; l.audioName=l.audioName||null; }); });
  return obj;
}

}
function sanitize(s){ return (s||'').replace(/[^a-z0-9çğıöşü _-]/gi,'').trim().replace(/\s+/g,'_'); }
function downloadBlob(blob,name){ const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),1000); }
function copyText(txt){

  const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); return Promise.resolve();

function narrationToHTML(text){
  if(!text||!text.trim()) return '<p class="muted">Bu ders için anlatım metni girilmemiş.</p>';
  return text.trim().split(/\n{2,}|\r\n\r\n/).map(p=>'<p>'+pdfEsc(p.trim()).replace(/\n/g,'<br>')+'</p>').join('');
}
function keyPoints(text){
  if(!text||!text.trim()) return '';
  const sents=text.replace(/\n/g,' ').split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(s=>s.length>25);
  const picks=sents.slice(0,5);
  if(!picks.length) return '';
  return '<ul class="keys">'+picks.map(s=>'<li>'+pdfEsc(s)+'</li>').join('')+'</ul>';
}
function codeBlockPDF(code,lang,fn){
  const raw=(code||'').replace(/\s+$/,'');
  if(!raw.trim()) return '';
  const meta={html:['HTML','html'],css:['CSS','css'],js:['JavaScript','js']}[lang];
  const lines=raw.split('\n').map((ln,i)=>
    '<div class="cl"><span class="ln">'+String(i+1).padStart(2,'0')+'</span><code>'+(ln.length?fn(ln):'&nbsp;')+'</code></div>').join('');
  return '<div class="codeblock '+meta[1]+'"><div class="cb-head">'+meta[0]+'</div><div class="cb-body">'+lines+'</div></div>';
}

function openCoursePDF(){

  let toc='<div class="toc"><h2>İçindekiler</h2><ol>';
  flat.forEach(({module,lesson})=>{ toc+='<li>'+pdfEsc(lesson.title)+'<span class="tmod">'+pdfEsc(module.title)+'</span></li>'; });
  toc+='</ol></div>';
  let secs='';
  flat.forEach(({module,lesson},i)=>{ secs+=lessonSectionHTML(lesson,module,i+1); });
  const html=buildPDFDoc(course.meta.title, 'Tam kurs ders notları kitapçığı', toc+secs, true, flat.length);

}
