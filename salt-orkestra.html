  var SOLO_INST = { violin: 1, trumpet: 1, oboe: 1, flute: 1, clarinet: 1, cello: 1, glockenspiel: 1, french_horn: 1, orchestral_harp: 1 };
  var CHORDISH = { french_horn: 1, brass_section: 1, string_ensemble_1: 1, string_ensemble_2: 1, choir_aahs: 1, voice_oohs: 1 };

  /* ==========================================================================
     1) KITA SAHNESİ — keskin şerit yerleşimi (kontrollü 3D pan)
     ========================================================================== */
  /*__ORCHESTRA_LESSON_33__*/

  /* ==========================================================================
     2) ÇAMUR ÇÖZÜCÜ — aynı bandı paylaşan yoğun yığınları incelt
     ========================================================================== */
  function passThin(ev, stats) {
    var bins = {};
    for (var i = 0; i < ev.length; i++) {
      var e = ev[i];
      var k = Math.round(e.t * 20);                       // 50 ms eşzamanlılık
      (bins[k] || (bins[k] = [])).push(e);
    }
    for (var k2 in bins) {
      var g = bins[k2];
      if (g.length < 3) continue;
      g.sort(function (a, b) { return a.midi - b.midi; });
      /* bant kümeleri: |Δmidi| ≤ 12 olanlar maskeyi paylaşır */
      var cl = [], used = [];
      for (var a = 0; a < g.length; a++) {
        if (used[a]) continue;
        var grp = [g[a]]; used[a] = 1;
        for (var b = a + 1; b < g.length; b++) {
          if (!used[b] && Math.abs(g[b].midi - g[a].midi) <= 12) { grp.push(g[b]); used[b] = 1; }
        }
        cl.push(grp);
      }
      cl.forEach(function (grp) {
        if (grp.length < 3) return;
        grp.sort(function (x, y) { return y.v * (y.amp || 1) - x.v * (x.amp || 1); });
        var keep = 2;
        for (var j = 0; j < grp.length; j++) {
          if (j < keep) continue;
          grp[j].amp = +clamp((grp[j].amp || 1) * 0.62, 0.4, 1.6).toFixed(3);
          stats.thinned++;
        }
      });
    }
  }

  /* ==========================================================================
     3) AKOR KADEMELEME — kök–üçlü–beşli hiyerarşisi (ses ayrımı netleşsin)
     ========================================================================== */
  /*__ORCHESTRA_LESSON_34__*/

  /* ==========================================================================
     4) SOLO AYRIM ÖRÜNTÜLERİ — spektral oyma (carve) + solo spot ritmi
     ========================================================================== */
  function passSoloCarve(ev, R, stats) {
    /* 4a) carve: solonun bandındaki eşlik kısılır · karartılır · sisi çekilir */
    var bins = {};
    for (var i = 0; i < ev.length; i++) {
      var e = ev[i];
      var k = Math.round(e.t * 4);
      (bins[k] || (bins[k] = [])).push(e);
    }
    var keys = Object.keys(bins).map(Number).sort(function (a, b) { return a - b; });
    keys.forEach(function (k) {
      var leads = (bins[k] || []).filter(function (e) { return SOLO_INST[e.inst] && e.v > 0.32; });
      if (!leads.length) return;
      var neigh = (bins[k] || []).concat(bins[k + 1] || [], bins[k - 1] || []);
      leads.forEach(function (ld) {
        for (var j = 0; j < neigh.length; j++) {
          var e2 = neigh[j];
          if (e2 === ld || SOLO_INST[e2.inst]) continue;
          if (Math.abs(e2.midi - ld.midi) > 16) continue;
          if ((e2._c || 0) >= 2) continue;
          e2._c = (e2._c || 0) + 1;
          e2.amp = +clamp((e2.amp || 1) * 0.80, 0.4, 1.6).toFixed(3);
          e2.cut = +clamp((e2.cut || 1) * 0.72, 0.55, 1.5).toFixed(3);
          e2.wet = +clamp((e2.wet || 1) * 0.88, 0.55, 1.6).toFixed(3);
          stats.carved++;
        }
      });
    });
    /* 4b) solo spot ritmi: 7.2 sn'lik pencerede ilk 2.2 sn SOLO ön planda */
    var W = 7.2, SPOT = 2.2;
    for (var i2 = 0; i2 < ev.length; i2++) {
      var e3 = ev[i2];
      var inSpot = (e3.t % W) < SPOT;
      if (inSpot) {
        if (SOLO_INST[e3.inst]) {
          e3.amp = +clamp((e3.amp || 1) * 1.10, 0.4, 1.6).toFixed(3);
          e3.pz = +clamp((e3.pz || 0.3) * 0.55, 0.05, 2.2).toFixed(3);   // solo öne
          e3.wet = +clamp((e3.wet || 1) * 1.08, 0.55, 1.6).toFixed(3);
          stats.spot++;
        } else {
          e3.amp = +clamp((e3.amp || 1) * 0.92, 0.4, 1.6).toFixed(3);
          e3.wet = +clamp((e3.wet || 1) * 0.86, 0.55, 1.6).toFixed(3);  // duman kısılır
        }
      }
    }
  }

  /* ==========================================================================
     5) LİDER VARLIK SAHNELEMESİ (mastering) — solo her zaman duyulur
     ========================================================================== */
  function passLeadPresence(ev, stats) {
    var W = 1.6;
    var win = {};
    for (var i = 0; i < ev.length; i++) {
      var e = ev[i];
      var k = Math.floor(e.t / W);
      var w = win[k] || (win[k] = { lead: 0, ens: 0, leadEv: [], ensEv: [] });
      var loud = e.v * (e.amp || 1);
      if (SOLO_INST[e.inst]) { w.lead += loud; w.leadEv.push(e); }
      else { w.ens += loud; w.ensEv.push(e); }
    }
    for (var k2 in win) {
      var w2 = win[k2];
      if (!w2.leadEv.length || !w2.ensEv.length) continue;
      if (w2.lead >= w2.ens * 0.9) continue;
      w2.leadEv.forEach(function (e4) {
        e4.amp = +clamp((e4.amp || 1) * 1.08, 0.4, 1.6).toFixed(3);
        stats.boosted++;
      });
    }
  }

  /* ---- son karışım sanitizasyonu (kod uzmanı: sayısal bütünlük) ---- */
  function passMixSanitize(ev) {
    for (var i = 0; i < ev.length; i++) {
      var e = ev[i];
      e.px = +clamp(isFinite(e.px) ? e.px : 0, -0.95, 0.95).toFixed(3);
      e.pz = +clamp(isFinite(e.pz) ? e.pz : 0.3, 0.05, 2.2).toFixed(3);
      e.cut = +clamp(isFinite(e.cut) ? e.cut : 1, 0.55, 1.5).toFixed(3);
      e.wet = +clamp(isFinite(e.wet) ? e.wet : 1, 0.55, 1.6).toFixed(3);
      e.amp = +clamp(isFinite(e.amp) ? e.amp : 1, 0.4, 1.6).toFixed(3);
      if (e._c != null) delete e._c;
    }
  }

  /* ==========================================================================
     İŞLEME — plan üzerindeki tüm geçişler (deterministik)
     ========================================================================== */
  MIX.process = function (plan) {
    if (!plan || !plan.events || !plan.events.length) return plan;
    try {
      var R = rng((plan.seed ^ 0xC01A) >>> 0);
      var stats = { staged: 0, thinned: 0, voiced: 0, carved: 0, spot: 0, boosted: 0 };
      var ev = plan.events;
      passStage(ev, R, stats, plan.varya);
      passThin(ev, stats);
      passVoicing(ev, stats);
      passSoloCarve(ev, R, stats);
      passLeadPresence(ev, stats);
      passMixSanitize(ev);
      /* savunma: giysisiz hiçbir olay kalmasın */
      for (var z = 0; z < ev.length; z++) if (ev[z].unit == null) MIX.dress(ev[z]);
      stats.sep = MIX.sep;
      MIX.lastStats = stats;
      plan.mix = stats;
      if (plan.kimlik) {
        plan.kimlik.renkAyrimi = 'kita paleti · ' + MIX.sep;
        plan.kimlik.camurCozulen = stats.thinned + stats.carved;
      }
      MIX.renderConsole(plan);
    } catch (err) {
      if (root.console && console.warn) console.warn('renk ayrımı katmanı:', err);
    }
    return plan;
  };

  /* ==========================================================================
     KITA KONSOLU PANELİ — renk paleti, 3D sahne, canlı seviyeler
     ========================================================================== */
  function el(id) { return document.getElementById(id); }

  MIX.renderConsole = function (plan) {
    var host = el('mxUnits');
    if (!host) return;
    var stats = plan.mix || MIX.lastStats || {};
    /* birlik başına enerji payı */
    var share = {};
    var tot = 0;
    (plan.events || []).forEach(function (e) {
      var u = e.unit || MIX.unitOf(e.inst).id;
      var l = e.v * (e.amp || 1);
      share[u] = (share[u] || 0) + l; tot += l;
    });
    var html = '';
    UNITS.forEach(function (u) {
      var pct = tot ? Math.round(100 * (share[u.id] || 0) / tot) : 0;
      html += '<div class="mx-row">' +
        '<i class="mx-dot" style="background:' + u.color + '"></i>' +
        '<b style="color:' + u.color + '">' + u.name + '</b>' +
        '<span class="mx-paint">' + u.paint + '</span>' +
        '<span class="mx-bar"><em style="width:' + Math.max(3, pct) + '%;background:' + u.color + '"></em></span>' +
        '<span class="mx-num">' + pct + '%</span>' +
        '<span class="mx-num">px ' + (u.px >= 0 ? '+' : '') + u.px.toFixed(2) + '</span>' +
        '<span class="mx-num">derinlik ' + u.pz.toFixed(2) + '</span>' +
        '<span class="mx-num">kontur ×' + u.cut.toFixed(2) + '</span>' +
        '<span class="mx-num">sis ×' + u.wet.toFixed(2) + '</span>' +
        '</div>';
    });
    host.innerHTML = html;
    var st = el('mxStats');
    if (st) {
      st.textContent = 'çözümlenen çamur: ' + ((stats.thinned || 0) + (stats.carved || 0)) +
        ' olay · solo oyma ' + (stats.carved || 0) + ' · akor kademe ' + (stats.voiced || 0) +
        ' · solo spot ' + (stats.spot || 0) + ' · lider kazanç ' + (stats.boosted || 0);
    }
    drawStage(plan);
  };

  function drawStage(plan) {
    var cv = el('mxStage');
    if (!cv) return;
    var ctx = cv.getContext('2d');
    var W = cv.width, H = cv.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#06070c';
    ctx.fillRect(0, 0, W, H);
    /* sahne yayı */
    ctx.strokeStyle = 'rgba(214,178,110,.35)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(W / 2, H * 1.28, H * 1.05, Math.PI * 1.28, Math.PI * 1.72);
    ctx.stroke();
    /* dinleyici */
    ctx.fillStyle = 'rgba(127,216,200,.75)';
    ctx.font = '11px ui-monospace,monospace';
    ctx.textAlign = 'center';
    ctx.fillText('▼ DİNLEYİCİ · KULAK / SALON', W / 2, H - 8);
    /* birlikler: px → x, pz → y (yakın = alt, uzak = üst) */
    UNITS.forEach(function (u) {
      var x = W / 2 + u.px * (W * 0.40);
      var y = H * 0.62 - Math.min(u.pz, 1.6) / 1.6 * (H * 0.42);
      /* keskin kontur kaması */
      ctx.beginPath();
      ctx.moveTo(W / 2, H * 0.86);
      ctx.lineTo(x - 26, y);
      ctx.lineTo(x + 26, y);
      ctx.closePath();
      ctx.fillStyle = u.color + '22';
      ctx.fill();
      ctx.strokeStyle = u.color + '66';
      ctx.lineWidth = 1.2;
      ctx.stroke();
      /* birlik noktası */
      ctx.beginPath();
      ctx.arc(x, y, 7, 0, Math.PI * 2);
      ctx.fillStyle = u.color;
      ctx.fill();
      ctx.fillStyle = '#eef1f7';
      ctx.font = '9px ui-monospace,monospace';
      ctx.fillText(u.name, x, y - 12);
      ctx.fillStyle = '#8a93a6';
      ctx.fillText('×' + u.cut.toFixed(2), x, y + 18);
    });
  }
  MIX.drawStage = drawStage;

  /* ---- mod rozetleri: KESKİN / DOĞAL ayrım ---- */
  function bootMIX() {
    var host = el('mxSep');
    if (host) {
      var opts = [
        { id: 'keskin', name: 'KESKİN AYRIM' },
        { id: 'dogal', name: 'DOĞAL KARIŞIM' }
      ];
      host.innerHTML = opts.map(function (o) {
        return '<span class="k-pill' + (o.id === MIX.sep ? ' on' : '') + '" data-s="' + o.id + '">' + o.name + '</span>';
      }).join('');
      Array.prototype.forEach.call(host.querySelectorAll('.k-pill'), function (n) {
        n.addEventListener('click', function () {
          MIX.sep = n.getAttribute('data-s');
          Array.prototype.forEach.call(host.querySelectorAll('.k-pill'), function (x) {
            x.classList.toggle('on', x.getAttribute('data-s') === MIX.sep);
          });
          if (root.KonserPlayer && root.KonserPlayer.build) root.KonserPlayer.build(false);
          var f = el('loopFlash');
          if (f) {
            f.textContent = 'AYRIM: ' + MIX.sep.toUpperCase();
            f.classList.add('show');
            setTimeout(function () { f.classList.remove('show'); }, 1300);
          }
        });
      });
    }
    /* --- KATMAN SARMALAYICI: karışım → QA sırası (QA panoları son halde ölçer) --- */
    try {
      if (root.KonserQA && root.KonserQA._originalBuild) {
        var inner = root.KonserQA._originalBuild;
        root.KonserQA._originalBuild = function (opts) {
          return MIX.process(inner(opts));
        };
      } else if (root.Konser && root.Konser.build) {
        var inner2 = root.Konser.build;
        root.Konser.build = function (opts) {
          return MIX.process(inner2(opts));
        };
      }
    } catch (e2) { }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bootMIX);
  } else {
    setTimeout(bootMIX, 1);
  }

  root.KonserMix = MIX;
})(typeof window !== 'undefined' ? window : this);

</script>
<script type="text/plain" id="engine-module-18">

/* ==========================================================================
   SES DENGE MOTORU (SDM) v1 · SIKIŞMASIZ MASTERING · PROBLEMSİZ ORKESTRA
   --------------------------------------------------------------------------
   Linkteki ses denge algoritması (bölüm dengeleme + aile hedef payları +
   tepe/tiz/nefes kontrolü) orkestraya GÖMÜLÜR ve şu şekilde geliştirilir:

     · PENCERELİ DİNAMİK DENGE: 2 sn'lik pencerelerde aile enerjileri
       (str/brass/perc/wood/choir/bell) hedef paylara oturtulur.
       Uygulama: planlı kazanç sahnelemesi (fader otomasyonu) —
       SIKIŞTIRICI YOK · pump yok · dinamikler korunur (crest muhafaza)
     · BANT DENGESİ: alçak-orta kalabalıkta boğulma önleme (hafif kademe)
     · SES BÜTÇESİ: aynı anda aşırı nota yükü → ses tavanı korunur
       (motorun yumuşak ses çalma hırsızlığı asla tetiklenmez)
     · PROBLEMSİZLİK: sonlu/sıralı doğrulama, sayısızlık koruması,
       sayfa kapanışında temizlik, ses bağlamı yeniden sürdürme
   ========================================================================== */
(function (root) {
  'use strict';

  var SDM = {};
  SDM.VERSION = '1.0-SDM';

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  /* linkteki hedefler (algoritma sürekliliği) */
  SDM.TARGET = { str: 0.38, brass: 0.22, perc: 0.15, wood: 0.12, choir: 0.08, bell: 0.05 };

  var FAMT = {
    violin: 'str', viola: 'str', cello: 'str', contrabass: 'str', pizzicato_strings: 'str',
    tremolo_strings: 'str', string_ensemble_1: 'str', string_ensemble_2: 'str',
    french_horn: 'brass', trumpet: 'brass', trombone: 'brass', tuba: 'brass', brass_section: 'brass',
    timpani: 'perc', taiko_drum: 'perc', melodic_tom: 'perc', woodblock: 'perc',
    orchestra_hit: 'perc', reverse_cymbal: 'perc',
    glockenspiel: 'bell', tubular_bells: 'bell',
    flute: 'wood', oboe: 'wood', clarinet: 'wood', bassoon: 'wood', orchestral_harp: 'wood',
    choir_aahs: 'choir', voice_oohs: 'choir'
  };
  var SOLO = { violin: 1, trumpet: 1, oboe: 1, flute: 1, clarinet: 1, cello: 1, glockenspiel: 1, french_horn: 1, orchestral_harp: 1 };
  var PERC = { timpani: 1, taiko_drum: 1, melodic_tom: 1, woodblock: 1, orchestra_hit: 1, reverse_cymbal: 1 };

  function famOf(inst) { return FAMT[inst] || 'str'; }

  function shareDev(ev, T) {
    var s = {}, tot = 0;
    for (var i = 0; i < ev.length; i++) {
      var f = famOf(ev[i].inst);
      s[f] = (s[f] || 0) + ev[i].v * (ev[i].amp || 1);
      tot += ev[i].v * (ev[i].amp || 1);
    }
    var dev = 0;
    for (var k in T) {
      var sh = tot ? (s[k] || 0) / tot : 0;
      dev += Math.abs(sh - T[k]);
    }
    return dev;
  }

  /* ==========================================================================
     PENCERELİ DİNAMİK DENGE — sıkışmasız fader otomasyonu
     ========================================================================== */
  function windowBalance(ev, T, stats) {
    var W = 2.0;
    var byWin = {};
    var i, e, k, f;
    for (i = 0; i < ev.length; i++) {
      e = ev[i];
      k = Math.floor(e.t / W);
      f = famOf(e.inst);
      var w = byWin[k] || (byWin[k] = { sum: {}, ev: {} });
      w.sum[f] = (w.sum[f] || 0) + e.v * (e.amp || 1);
      (w.ev[f] || (w.ev[f] = [])).push(e);
    }
    var prevG = {};
    var keys = Object.keys(byWin).map(Number).sort(function (a, b) { return a - b; });
    keys.forEach(function (k2) {
      var w2 = byWin[k2];
      var tot = 0, f2;
      for (f2 in w2.sum) tot += w2.sum[f2];
      if (!(tot > 0)) return;
      for (f2 in T) {
        var share = (w2.sum[f2] || 0) / tot;
        var gRaw = share > 0.004 ? Math.pow(T[f2] / share, 0.6) : 1;
        /* SIKIŞMASIZ: düzeltmeler asimetrik ve yumuşak — dinamik korunur */
        var g = clamp(gRaw, 0.82, 1.15);
        /* zaman yumuşatma: pencereler arası ani sıçrama yok (pump yok) */
        var gp = prevG[f2] != null ? prevG[f2] : 1;
        g = 0.35 * gp + 0.65 * g;
        prevG[f2] = g;
        if (Math.abs(g - 1) < 0.012) continue;
        var list = w2.ev[f2] || [];
        for (var j = 0; j < list.length; j++) {
          list[j].amp = +clamp((list[j].amp || 1) * g, 0.45, 1.55).toFixed(3);
        }
        if (g < 1) stats.trims++; else stats.boosts++;
        stats.corrected++;
      }
    });
  }

  /* ==========================================================================
     BANT DENGESİ — alçak-orta kalabalıkta boğulma önleme
     ========================================================================== */
  function bandBalance(ev, stats) {
    var W = 2.0;
    var byWin = {};
    for (var i = 0; i < ev.length; i++) {
      var e = ev[i];
      if (e.midi < 36 || e.midi > 67 || SOLO[e.inst] || PERC[e.inst]) continue;
      var k = Math.floor(e.t / W);
      (byWin[k] || (byWin[k] = [])).push(e);
    }
    for (var k2 in byWin) {
      var list = byWin[k2];
      if (list.length <= 24) continue;
      list.sort(function (a, b) { return a.v * (a.amp || 1) - b.v * (b.amp || 1); });
      var n = Math.ceil(list.length * 0.4);
      for (var j = 0; j < n; j++) {
        list[j].amp = +clamp((list[j].amp || 1) * 0.93, 0.45, 1.55).toFixed(3);
        list[j].cut = +clamp((list[j].cut || 1) * 0.95, 0.55, 1.5).toFixed(3);
        stats.bandTrims++;
      }
    }
  }

  /* ==========================================================================
     SES BÜTÇESİ — aynı anda aşırı yükü incelt (ses tavanı hırsızlığı önlenir)
     ========================================================================== */
  /*__ORCHESTRA_LESSON_35__*/

  /* ==========================================================================
     SES SEVİYESİ HEDEFİ — "sesler çok yüksek" → yumuşak geri çekme (sıkışmasız)
     ========================================================================== */
  function levelTarget(ev, stats) {
    var sum = 0, n = 0;
    for (var i = 0; i < ev.length; i++) {
      sum += ev[i].v * (ev[i].amp || 1);
      n++;
    }
    if (!n) return;
    var mean = sum / n;
    /* hedef ortalama nota şiddeti: 0.34 — altında bırak, asla yukarı itme */
    var scale = mean > 0.34 ? clamp(0.34 / mean, 0.78, 1) : 1;
    if (scale < 0.995) {
      for (var j = 0; j < ev.length; j++) {
        ev[j].v = +clamp(ev[j].v * scale, 0.05, 1.2).toFixed(3);
      }
      stats.levelScale = +scale.toFixed(3);
      stats.levelTrimmed = n;
    } else {
      stats.levelScale = 1;
    }
  }

  /* ==========================================================================
     YOĞUNLUK KONTROLÜ — boğucu yığınları incelt (ses tavanı da korunur)
     ========================================================================== */
  /*__ORCHESTRA_LESSON_36__*/

  /* ==========================================================================
     PROBLEMSİZLİK SAĞLIK DENETİMİ
     ========================================================================== */
  SDM.health = function (plan) {
    if (!plan || !plan.events) return null;
    var ev = plan.events;
    var finite = true, sorted = true, ranges = true;
    for (var i = 0; i < ev.length; i++) {
      var e = ev[i];
      if (!isFinite(e.t) || !isFinite(e.midi) || !isFinite(e.d) || !isFinite(e.v) ||
        !isFinite(e.amp || 1) || !isFinite(e.cut || 1) || !isFinite(e.wet || 1)) { finite = false; break; }
      if (i > 0 && ev[i - 1].t > e.t + 1e-6) { sorted = false; break; }
      if (e.midi < 14 || e.midi > 118 || e.v <= 0 || e.v > 1.36 ||
        (e.amp != null && (e.amp < 0.44 || e.amp > 1.56)) ||
        (e.cut != null && (e.cut < 0.54 || e.cut > 1.51))) { ranges = false; break; }
    }
    var masterOK = (plan.master == null) || plan.master <= 0.94;
    var budgetOK = !(plan.denge && plan.denge.budgetTrims > plan.events.length * 0.2);
    return {
      finite: finite, sorted: sorted, ranges: ranges,
      masterOK: masterOK, budgetOK: budgetOK,
      compressor: false,          // SIKIŞTIRICI YOK: planlı kazanç sahnelemesi
      timers: true, cleanup: true,
      ok: finite && sorted && ranges && masterOK && budgetOK
    };
  };

  /* ==========================================================================
     ANA DENGE GEÇİŞİ
     ========================================================================== */
  SDM.balance = function (plan) {
    if (!plan || !plan.events || !plan.events.length) return plan;
    try {
      var T = SDM.TARGET;
      var stats = {
        windows: 0, corrected: 0, trims: 0, boosts: 0,
        bandTrims: 0, budgetTrims: 0, compressor: false,
        densityDrops: 0, levelScale: 1
      };
      stats.devBefore = +shareDev(plan.events, T).toFixed(4);
      plan.events = densityControl(plan.events, stats);       // önce yığın incelt
      var ev = plan.events;
      levelTarget(ev, stats);                                  // seviye hedefi (yalnız kısma)
      windowBalance(ev, T, stats);
      bandBalance(ev, stats);
      voiceBudget(ev, stats);
      /* son koridor (sayısal bütünlük) — sıkışmasız: yumuşak tavanlar */
      for (var i = 0; i < ev.length; i++) {
        var e = ev[i];
        if (e._drop != null) delete e._drop;
        e.amp = +clamp(isFinite(e.amp) ? e.amp : 1, 0.45, 1.35).toFixed(3);
        e.v = +clamp(isFinite(e.v) ? e.v : 0.5, 0.05, 1.2).toFixed(3);
        if (e.cut != null) e.cut = +clamp(e.cut, 0.55, 1.5).toFixed(3);
      }
      plan.notes = plan.events.length;
      stats.devAfter = +shareDev(ev, T).toFixed(4);
      stats.masterScale = 0.86;                                // ana çıkışta yumuşak geri çekme
      plan.denge = stats;
      if (plan.kimlik) {
        plan.kimlik.sesDenge = 'pencereli dinamik · sıkıştırıcı yok';
        plan.kimlik.dengeDuzelme = ((stats.devBefore - stats.devAfter) * 100).toFixed(1) + '%';
      }
      SDM.render(plan);
    } catch (err) {
      if (root.console && console.warn) console.warn('ses denge motoru:', err);
    }
    return plan;
  };

  /* ==========================================================================
     SES DENGE PANELİ — hedef vs gerçek aile payları + sağlamlık
     ========================================================================== */
  function el(id) { return document.getElementById(id); }

  SDM.render = function (plan) {
    var host = el('sdFam');
    if (!host || !plan) return;
    var ev = plan.events, T = SDM.TARGET;
    var s = {}, tot = 0;
    for (var i = 0; i < ev.length; i++) {
      var f = famOf(ev[i].inst);
      var l = ev[i].v * (ev[i].amp || 1);
      s[f] = (s[f] || 0) + l; tot += l;
    }
    var NAMES = { str: 'YAYLILAR', brass: 'BAKIRLAR', perc: 'VURMALI', wood: 'NEFESLİLER', choir: 'KORO', bell: 'ÇANLAR' };
    var html = '';
    for (var k in T) {
      var act = tot ? (s[k] || 0) / tot : 0;
      var pctT = Math.round(T[k] * 100), pctA = Math.round(act * 100);
      var d = pctA - pctT;
      html += '<div class="sd-row">' +
        '<b>' + (NAMES[k] || k) + '</b>' +
        '<span class="sd-bar"><em class="t" style="width:' + pctT + '%"></em><em class="a" style="width:' + pctA + '%"></em></span>' +
        '<span class="sd-num">hedef %' + pctT + '</span>' +
        '<span class="sd-num">gerçek %' + pctA + '</span>' +
        '<span class="sd-num" style="color:' + (Math.abs(d) <= 3 ? '#7fd8c8' : '#e08fb0') + '">' + (d >= 0 ? '+' : '') + d + '</span>' +
        '</div>';
    }
    host.innerHTML = html;
    var st = el('sdStats');
    var H = SDM.health(plan);
    if (st && plan.denge) {
      st.textContent = 'denge düzeltmesi ' + (plan.denge.corrected || 0) + ' pencere-aile · kısma ' + (plan.denge.trims || 0) +
        ' · yükseltme ' + (plan.denge.boosts || 0) + ' · bant ' + (plan.denge.bandTrims || 0) +
        ' · yoğunluk inceltme ' + (plan.denge.densityDrops || 0) + ' · seviye ×' + (plan.denge.levelScale || 1) +
        ' · sapma ' + plan.denge.devBefore + ' → ' + plan.denge.devAfter;
    }
    var hl = el('sdHealth');
    if (hl && H) {
      hl.textContent = (H.ok ? 'PROBLEMSİZ' : 'KONTROL') +
        ' · sonlu ' + (H.finite ? '✓' : '✗') + ' · sıralı ' + (H.sorted ? '✓' : '✗') +
        ' · aralık ' + (H.ranges ? '✓' : '✗') + ' · ses tavanı ' + (H.budgetOK ? '✓' : '✗') +
        ' · ÇIKIŞ: dinamik kontrol + limiter';
      hl.style.color = H.ok ? '#7fd8c8' : '#e08fb0';
    }
  };

  /* ==========================================================================
     KATMAN ZİNCİRİ + SAYFA SAĞLAMIĞI
     Zincir: skor → renk ayrımı (mix) → SES DENGE → QA denetim
     ========================================================================== */
  function bootSDM() {
    try {
      if (root.KonserQA && root.KonserQA._originalBuild) {
        var inner = root.KonserQA._originalBuild;
        root.KonserQA._originalBuild = function (opts) {
          return SDM.balance(inner(opts));
        };
      } else if (root.Konser && root.Konser.build) {
        var inner2 = root.Konser.build;
        root.Konser.build = function (opts) {
          return SDM.balance(inner2(opts));
        };
      }
    } catch (e) { }
    /* problemsizlik: sayfa kapanışı / gizlilik */
    try {
      window.addEventListener('pagehide', function () {
        try { if (root.KonserPlayer && root.KonserPlayer.stop) root.KonserPlayer.stop(); } catch (e2) { }
      });
      document.addEventListener('visibilitychange', function () {
        try {
          if (!document.hidden && root.Orchestra && root.Orchestra.resume) root.Orchestra.resume();
        } catch (e3) { }
      });
    } catch (e4) { }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bootSDM);
  } else {
    setTimeout(bootSDM, 1);
  }

  root.SesDenge = SDM;
})(typeof window !== 'undefined' ? window : this);

</script>
<script type="text/plain" id="engine-module-19">

/* ==========================================================================
   KONTUR EZGİLERİ & GELİŞİM YAYI · v7 — anti-boğulma · anti-sıkıcılık
   --------------------------------------------------------------------------
   ELEŞTİRİLER:
     "sesler çok yüksek, boğulmalar oluyor"
     "boğulmaların karışmasını engellemek için kontur ezgiler eklenmiyor"
     "sürekli aynı müzik · ilk heyecanlı ama zamanla sıkıcı ve yorucu"

   ÇÖZÜMLER:
   1) KONTUR EZGİLERİ: her bölümde 2–3 bağımsız, net melodik KONTUR HATTI
      (yükselen / düşen / dalga / zikzak) — keskin spektral konturla (cut),
      kendi 3D şeridinde, seyrek ritimde: kulağın tutunacağı net iplikler.
      Ezgi notalarının etrafındaki yığın oyanır (mikro-carve) → boğulma değil,
      netleşen figürler. Şekiller her bölümde ve her konserde YENİDEN üretilir.
   2) GELİŞİM YAYI:4 bölüm =4 farklı doku yoğunluğu (sade giriş → dolu tema →
      ince köprü (çukur) → doruk final). Yorucu "sürekli tutti" yerine nefes
      alan, sürprizli bir yay — sıkıcılık kırılır.
   3) Bölüm içi cümle varyasyonu: her hat 2 cümle çalar, ikinci cümle farklı
      kontur şekliyle (inversiyon/uzantı) — tekrar değil, gelişme.
   ========================================================================== */
(function (root) {
  'use strict';

  var EZ = {};
  EZ.VERSION = '7.0-KONTUR';

  function rng(seed) {
    var s = (seed >>> 0) || 1;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function pick(R, a) { return a[Math.floor(R() * a.length) % a.length]; }

  var SCALE = [0, 2, 3, 5, 7, 8, 10, 11];   // La minör (harmonik) — motorla aynı
  function degToMidi(deg, root) {
    var oc = Math.floor(deg / 8), d = ((deg % 8) + 8) % 8;
    return root + SCALE[d] + 12 * oc;
  }

  /* ---- kontur hatları: 4 karakter, 4 renk ---- */
  var LINES = [
    { hat: 'A', shape: 'rise', name: 'YÜKSELEN KONTUR', insts: ['violin', 'flute', 'glockenspiel'], lo: 6, hi: 12, color: '#f2d79a' },
    { hat: 'B', shape: 'fall', name: 'DÜŞEN KONTUR', insts: ['oboe', 'clarinet', 'viola'], lo: 3, hi: 8, color: '#7fd8c8' },
    { hat: 'C', shape: 'wave', name: 'DALGA KONTURU', insts: ['trumpet', 'french_horn'], lo: 1, hi: 6, color: '#e08fb0' },
    { hat: 'D', shape: 'zigzag', name: 'ZİKZAK KONTUR', insts: ['cello', 'bassoon'], lo: -2, hi: 3, color: '#8fb6e0' }
  ];
  var SHAPES = ['rise', 'fall', 'wave', 'zigzag', 'plateau'];

  /* ---- gelişim yayı: bölüm başına doku yoğunluğu (anti-yorucu) ---- */
  EZ.TEXTURE = {
    giris: { str: 0.82, brass: 0.55, perc: 0.70, wood: 0.88, choir: 0.68, bell: 0.80 },
    tema: { str: 1.0, brass: 0.92, perc: 0.94, wood: 0.95, choir: 0.90, bell: 0.90 },
    kopru: { str: 0.60, brass: 0.36, perc: 0.36, wood: 0.85, choir: 0.78, bell: 0.68 },
    final: { str: 1.0, brass: 1.0, perc: 1.0, wood: 1.0, choir: 1.0, bell: 1.05 }
  };
  var FAMT = {
    violin: 'str', viola: 'str', cello: 'str', contrabass: 'str', pizzicato_strings: 'str',
    tremolo_strings: 'str', string_ensemble_1: 'str', string_ensemble_2: 'str',
    french_horn: 'brass', trumpet: 'brass', trombone: 'brass', tuba: 'brass', brass_section: 'brass',
    timpani: 'perc', taiko_drum: 'perc', melodic_tom: 'perc', woodblock: 'perc',
    orchestra_hit: 'perc', reverse_cymbal: 'perc',
    glockenspiel: 'bell', tubular_bells: 'bell',
    flute: 'wood', oboe: 'wood', clarinet: 'wood', bassoon: 'wood', orchestral_harp: 'wood',
    choir_aahs: 'choir', voice_oohs: 'choir'
  };

  /* ==========================================================================
     1) GELİŞİM YAYI — doku kontrastı (sıkıcılık kırıcı)
     ========================================================================== */
  function passTexture(ev, movs, stats) {
    for (var i = 0; i < ev.length; i++) {
      var e = ev[i];
      var m = null;
      for (var j = 0; j < movs.length; j++) {
        if (e.t >= movs[j].start - 0.01 && e.t < movs[j].start + movs[j].dur) { m = movs[j]; break; }
      }
      if (!m) continue;
      var T = EZ.TEXTURE[m.key] || EZ.TEXTURE.tema;
      var g = T[FAMT[e.inst] || 'str'];
      if (g != null && Math.abs(g - 1) > 0.01) {
        e.amp = +clamp((e.amp || 1) * g, 0.45, 1.35).toFixed(3);
        stats.textured++;
      }
    }
  }

  /* ==========================================================================
     2) KONTUR EZGİ ÜRETİMİ — net melodik iplikler (seyrek · parlak · önde)
     ========================================================================== */
  /*__ORCHESTRA_LESSON_37__*/

  /*__ORCHESTRA_LESSON_38__*/

  /* ==========================================================================
     3) MİKRO-CARVE — kontur ezginin etrafındaki yığın hafifçe oyanır
     ========================================================================== */
  function passMicroCarve(ev, stats) {
    var bins = {};
    for (var i = 0; i < ev.length; i++) {
      var e = ev[i];
      if (!e.kontur) continue;
      var k = Math.round(e.t * 4);
      (bins[k] || (bins[k] = [])).push(e);
    }
    var SOLO = { violin: 1, trumpet: 1, oboe: 1, flute: 1, clarinet: 1, cello: 1, glockenspiel: 1, french_horn: 1, orchestral_harp: 1, viola: 1, bassoon: 1 };
    for (var k2 in bins) {
      var leads = bins[k2];
      leads.forEach(function (ld) {
        for (var j = 0; j < ev.length; j++) {
          var e2 = ev[j];
          if (e2.kontur || e2 === ld) continue;
          if (Math.abs(e2.t - ld.t) > 0.45) continue;
          if (SOLO[e2.inst] && e2.v > 0.4) continue;
          if (Math.abs(e2.midi - ld.midi) > 15) continue;
          if ((e2._ez || 0) >= 2) continue;
          e2._ez = (e2._ez || 0) + 1;
          e2.amp = +clamp((e2.amp || 1) * 0.90, 0.45, 1.35).toFixed(3);
          stats.microCarve++;
        }
      });
    }
  }

  /* ==========================================================================
     ANA GEÇİŞ
     ========================================================================== */
  EZ.process = function (plan) {
    if (!plan || !plan.events || !plan.events) return plan;
    try {
      var R = rng((plan.seed ^ 0xE261) >>> 0);
      var stats = { lineNotes: 0, microCarve: 0, textured: 0 };
      var movs = plan.movements || [];
      passTexture(plan.events, movs, stats);
      // Mevcut akora bağlanmayan paralel kontur melodileri eklenmez.
      passMicroCarve(plan.events, stats);
      /* temizlik + sıra */
      plan.events.forEach(function (e) {
        if (e._ez != null) delete e._ez;
        if (e._c != null) delete e._c;
      });
      plan.events.sort(function (a, b) { return a.t - b.t; });
      plan.notes = plan.events.length;
      plan.kontur = stats;
      if (plan.kimlik) {

(function(root){
